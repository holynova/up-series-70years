<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>人物 · 《人生七年》</title><meta name="description" content="14 个人，63 年人生"><style>*{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#faf7f0;--ink:#22252a;--muted:#6b6f76;--accent:#1d4e89;--line:#e4ddcf;--card:#fffdf8}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:18px;line-height:1.9;max-width:720px;margin:0 auto;padding:0 20px 80px}
h1,h2,h3{font-family:Georgia,"Songti SC","Noto Serif SC",serif;line-height:1.5;font-weight:700}
h1{font-size:1.7rem;margin:1.6em 0 .6em}h2{font-size:1.35rem;margin:2.2em 0 .8em;padding-bottom:.4em;border-bottom:2px solid var(--ink)}
h3{font-size:1.12rem;margin:1.6em 0 .5em}p{margin:.9em 0}ul,ol{margin:.9em 0 .9em 1.4em}li{margin:.45em 0}
a{color:var(--accent);text-decoration:none}a:active{opacity:.6}
.hero{padding:56px 0 30px;text-align:center}
.hero .kicker{color:var(--muted);letter-spacing:.35em;font-size:.8rem;margin-bottom:14px}
.hero h1{font-size:2rem;margin:0 0 12px;border:none;padding:0}
.hero .sub{color:var(--muted);font-size:1.02rem}
.nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:26px 0}
.nav a{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 18px;font-size:.92rem;color:var(--ink)}
.section-label{color:var(--muted);font-size:.85rem;letter-spacing:.25em;margin:44px 0 6px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:480px){.cards{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:block;color:var(--ink)}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.card .bd{padding:14px 14px 16px}
.card .nm{font-weight:700;font-size:1.05rem}.card .en{color:var(--muted);font-size:.82rem}
.card .nick{display:inline-block;margin-top:8px;font-size:.85rem;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 12px}
.card .sum{font-size:.88rem;color:var(--muted);margin-top:10px;line-height:1.7}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 16px;font-size:.88rem;color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tl{position:relative;margin:18px 0 0;padding-left:26px;border-left:2px solid var(--line)}
.tl details{margin:0 0 6px;position:relative}
.tl details::before{content:"";position:absolute;left:-34px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--accent)}
.tl summary{cursor:pointer;list-style:none;font-weight:700;font-size:1.05rem;padding:10px 0;display:flex;justify-content:space-between;align-items:center}
.tl summary::-webkit-details-marker{display:none}

.tl .body{padding:2px 0 18px;color:#33373d}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:18px 0}
.meta div{background:var(--card);padding:10px 14px;font-size:.9rem}
.meta .k{color:var(--muted);font-size:.78rem;display:block}
.person-head{text-align:center;padding:40px 0 10px}
.person-head img{width:180px;height:180px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.person-head .nick{font-size:1.05rem;color:var(--accent);margin-top:10px}
.person-head .en{color:var(--muted)}
.dead{color:#a33;font-weight:700}
.compare-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}
.foot-nav{display:flex;justify-content:space-between;margin:50px 0 0}

.table-wrap{overflow-x:auto;margin:16px -20px;padding:0 20px}
table{border-collapse:collapse;width:100%;font-size:.82rem;min-width:900px;background:var(--card)}

<script>
const DATA={"andrew":{"id":"andrew","name":"安德鲁·布拉克菲尔德","en":"Andrew Brackfield","nickname":"人生按剧本走的精英律师","avatar":"avatars/andrew.jpg","summary":"一个7岁时就能背出自己一生的孩子，几乎一字不差地兑现了预言——查特豪斯公学、剑桥、律师事务所合伙人、同一个人生的妻子48年；63岁后才第一次承认，这份完美的人生，代价是孩子们长大的那些年他不在场。","class7":"伦敦肯辛顿富裕家庭的男孩，英国阶层顶端的起跑线","education":"肯辛顿预备学校 → 查特豪斯公学（Charterhouse）→ 剑桥大学（三一学院）","career":"事务律师（solicitor），做到律师事务所合伙人","marriage":"与简（Jane）结婚近48年（约1978年起），未离","children":"两个儿子","turning":"49岁时一度传出辞去律师工作、改建谷仓想换活法（说法有冲突，未定论）","status70":"退休，与妻子同住，对少年时的自己感到惭愧，最大的遗憾是工作挤掉了陪孩子的时间","alive":true,"tags":["精英家庭","上大学","退休"],"intro":"<p>安德鲁是1964年第一部《Seven Up!》里站在镜头前最体面的三个男孩之一：肯辛顿富人区的预备学校学生，7岁就会说自己看《金融时报》。他是全系列里最&quot;省事&quot;的参与者——从7岁到70岁，他一次都没退出过节目，14个人里唯一十部全勤。教育上他走完了那条被预言好的路：查特豪斯公学、剑桥大学、成为事务律师并做到合伙人，娶了妻子简近五十年，育有两个儿子。但这个&quot;别人家的孩子&quot;在晚年反复说起同一个遗憾：工作挤掉了太多陪伴孩子长大的时间。</p>\n","background":"<p>关于安德鲁的家庭，公开资料其实很少——他本人极其低调，连父母的姓名和职业都没有出现在任何主流媒体报道里。这本身就说明了一些问题：他的&quot;富裕&quot;是一种安静的、不需要被解释的富裕。</p>\n<p>我们能确认的事实是：他是伦敦肯辛顿区一所预备学校的三个男孩之一（另两人是约翰·布里斯比和查尔斯·弗诺）。1964年的节目正是要用这三个男孩和东区贫民区的孩子们做最刺眼的对比：这边三个男孩穿着校服、用拉丁语唱《Waltzing Matilda》（Wikipedia，Up film series，2026）。没有资料给出这所肯辛顿预备学校的名字。</p>\n<p>他的父母到底是做什么的？没有第一手来源。唯一的线索来自他自己7岁时留下的名场面：被问到看什么报纸，他答&quot;《金融时报》&quot;——多年后他承认，这其实是照抄他父亲的回答（Wikipedia，Up film series，2026）。换句话说，这个家里有个每天读《金融时报》的父亲。这是全系列里关于他家境最具象的一句话：不是城堡，不是庄园，而是一种空气——家里讨论的就是钱、投资和未来，一个孩子耳濡目染地把金融报纸当成&quot;我们家看的东西&quot;。</p>\n<p>这就是阶级差异最原始的形态。不在于7岁时安德鲁比别的孩子聪明多少，而在于：当被问到&quot;你以后想上什么学校&quot;时，他和两个同伴能脱口而出整条路径——预备学校、公学、牛津或剑桥，每一步都清清楚楚；而别的孩子连&quot;大学&quot;这个词意味着什么都不知道。差距不是从跑道上开始的，是从&quot;知不知道有这条跑道&quot;开始的。</p>\n","ages":[{"age":7,"title":"7岁 ——《Seven Up!》（1964）","html":"<p>1964年5月5日，格兰纳达电视台《World in Action》栏目播出了40分钟的黑白节目《Seven Up!》，导演是保罗·阿尔蒙德，23岁的迈克尔·阿普特德是研究助理。14个孩子被选来&quot;代表&quot;英国的不同阶层。</p>\n<p>7岁的安德鲁是三人组里最居中的那一个。三个男孩一起用拉丁语唱歌、一起谈论报纸和学校的样子，成为后来半个多世纪英国人谈起&quot;阶级&quot;时反复引用的画面。安德鲁的《金融时报》回答则是全系列最著名的童言之一：一个7岁的孩子，用大人的腔调说出大人的报纸名。好笑的是，多年后他坦承这完全是复读机行为——父亲被问时说看《金融时报》，他就跟着说（Wikipedia，Up film series，2026）。</p>\n<p>还有一层值得注意的细节：三个男孩不只&quot;知道&quot;要去哪所学校，其中两个甚至能说出具体想去牛津剑桥的哪个学院（Wikipedia，Up film series，2026）。2019年的一位评论者回忆起他，说安德鲁年轻时简直是个&quot;让人受不了的小贵族老爷&quot;（theartsdesk.com，2019）。但另一面同样真实：多年后安德鲁自己说，看当年那个趾高气扬的小孩，他感到&quot;羞愧&quot;——那是后来才有的觉悟。</p>\n<p><strong>伏笔：</strong> 7岁时那种按部就班的笃定，后来成了他一生的底色。1998年（42岁）他在片中把自己的优点总结为&quot;坚持&quot;和&quot;不爱冒险&quot;（Boston Phoenix，1999）——这几乎是对7岁状态最诚实的注脚。</p>\n"},{"age":14,"title":"14岁 ——《7 Plus Seven》（1970）","html":"<p>关于14岁的安德鲁，没有找到任何具体的文字记录——他的资料缺口主要集中在少年时期。我们只知道三人组整体的轨迹：一篇2019年的回顾写道，从7岁到21岁，这三个预备学校的男孩&quot;基本上都走到了他们想去的地方……他们说想进这所那所学校，到了21岁，阿普特德在旁白里说，他们真的都进了。这种感觉就像他们走在一条铺好的金光大道上&quot;（eriklundegaard.com，2019）。</p>\n<p>这话很刺耳，但对安德鲁而言是事实：查特豪斯公学——英格兰最顶级的私立寄宿学校之一——他去了。对于别的孩子，14岁是人生分岔的开始；对他，是按计划前进。</p>\n"},{"age":21,"title":"21岁 ——《21 Up》（1977）","html":"<p>21岁的安德鲁在剑桥大学读书（Wikipedia 写的是三一学院，但有一份低质量来源写三一学堂，这个冲突没有更权威的来源能解决）。他学什么专业、什么时候怎么认识妻子简的，公开资料里都没有。</p>\n<p>这是第一次真正看到：7岁时的阶级差距，如何变成人生道路的差距。同一个系列里，有的孩子21岁已经在工厂流水线上，有的在为生计发愁；而安德鲁的&quot;梦想&quot;没有破碎——因为它们本来就不是梦想，是日程表。</p>\n"},{"age":28,"title":"28岁 ——《28 Up》（1984）","html":"<p>28岁的安德鲁已经走上事务律师的路，并且已经和简结婚（按IMDb类数据库的说法，两人从1978年起就是夫妻；官方press kit只确认&quot;在《35 Up》之前结婚&quot;，两种说法都指向约1977–78年成婚）。有一个流传很广但来源很弱的说法：有观众在看完《28 Up》后觉得，他和简的婚姻&quot;看起来注定要完&quot;（kattykakesbakery.com）。这个说法不可靠，但它反映了一个真实的观感——早年镜头前的安德鲁和简，确实不像后来那样松弛。</p>\n<p>有意思的是，就在这一集，约翰·布里斯比拒绝出镜了（第一次退出），查尔斯·弗诺也在这之后彻底离开。而安德鲁始终在场——这个习惯他保持了整整63年。</p>\n"},{"age":35,"title":"35岁 ——《35 Up》（1991）","html":"<p>官方的《56 Up》press kit确认：安德鲁在《35 Up》之前就已和简结婚，此时已是律师事务所的合伙人（First Run Features，2012）。事业进入稳定期，家庭也安顿下来。</p>\n<p>需要说明的是，这一集里约翰第一次说出那句著名的&quot;这节目是我生命里的一颗小毒丸&quot;（&quot;a little pill of poison&quot;）——这是三人组里开始公开表达对阶级标签不满的起点。安德鲁在35岁时没有留下类似的激烈言论，他选择了继续合作。</p>\n"},{"age":42,"title":"42岁 ——《42 Up》（1998）","html":"<p>《49 Up》的官方press kit给了这一时期最清楚的快照：到《42 Up》时，安德鲁和简&quot;幸福地结婚超过15年&quot;，他是律师事务所的合伙人，夫妻俩有两个儿子，大儿子正准备去上他当年上的那所寄宿学校——查特豪斯（First Run Features，2005）。也就是说，连下一代都走上了同一条路。</p>\n<p>1999年的一篇《42 Up》评论捕捉到了安德鲁的自我认知：他把自己一路平安走过来的原因归结为&quot;坚持&quot;和&quot;不爱冒险&quot;这两项优点（Boston Phoenix，1999）。这话说得平淡，但放在整个系列里看很动人：当别的参与者在中年经历离婚、破产、流浪、疾病时，安德鲁的&quot;不爱冒险&quot;成了一种保护罩——也是他后来最后悔的东西。</p>\n"},{"age":49,"title":"49岁 ——《49 Up》（2005）","html":"<p>这里有一个<strong>未解决的冲突</strong>，必须如实说明。散文家布鲁斯·鲍尔在《Hudson Review》（2007年8月）写道：在《49 Up》里，&quot;谨慎保守、一辈子照着父母剧本走、注定要在同一家律所干到死的安德鲁，突然辞去了律师工作，正在把一座旧谷仓改造成全家住的房子，还鼓励孩子们多冒险。&quot;但七年后的官方《56 Up》press kit（First Run Features，2012）却说他&quot;最终成了律师事务所合伙人，至今仍在法律界工作&quot;。两种说法很难调和——除非他辞职后又回去了，或者鲍尔的解读有偏差。这个矛盾没有定论，这里如实记录，不做取舍。</p>\n"},{"age":56,"title":"56岁 ——《56 Up》（2012）","html":"<p>官方press kit的说法：安德鲁在《35 Up》前和简结婚，成为事务律师合伙人，&quot;至今仍在法律界工作，有两个儿子&quot;（First Run Features，2012）。没有新的婚姻、健康或住址信息。他依然是这个系列里最稳定的存在——一篇回顾写道：&quot;三个人里的第三个，安德鲁·布拉克菲尔德，从来没有掉过队&quot;（eriklundegaard.com，2019）。</p>\n"},{"age":63,"title":"63岁 ——《63 Up》（2019）","html":"<p>63岁的安德鲁&quot;正在考虑退休&quot;（whattowatch.com，2019）。一位评论者形容他是&quot;十足的成功人士，虽然有点压力山大——按他自己的说法，他过着'幸福而充实的人生'&quot;（screen-space.net，2019）。简也出现在镜头里，她自称&quot;一个地道的约克郡姑娘&quot;（theartsdesk.com，2019）——这是公开记录里少有的、简直接发声的时刻。</p>\n<p>这一集里安德鲁说出了他晚年最重要的自我评价：&quot;他几乎为自己年轻时那个自视甚高的蠢小子感到羞愧，并且后悔工作太多次挤掉了家庭生活。他现在正尽力弥补失去的时间&quot;（theartsdesk.com，2019）。这是他第一次如此明确地谈论代价。</p>\n"},{"age":70,"title":"70岁 ——《70 Up》（2026）","html":"<p>《70 Up》于2026年9月15日和22日在ITV1和ITVX播出两集、每集90分钟，由奥斯卡导演阿西夫·卡帕迪亚接棒已故的迈克尔·阿普特德（2021年1月去世，享年79岁）。安德鲁出现在回归名单中（Radio Times，2026；memorabletv.com，2026）——他是14个人里唯一参加了全部十部的人。</p>\n<p><strong>退休。</strong> 到《70 Up》时，安德鲁已经从法律界退休（Wikipedia，引自节目内容，2026）。回望一生，他说希望在孩子们长大的那些年里，自己能多花点时间陪他们（Wikipedia，引自《70 Up》，2026）——这是63岁那番话的延续和加深。</p>\n<p><strong>婚姻与家庭。</strong> 和简依然在一起，整个系列里没有任何离婚记录。两个儿子都已长大成人。关于孙辈：没有找到任何资料。</p>\n<p><strong>住址与日常生活。</strong> 有一家低权威的媒体（celebrity24h.com，2026，转述《每日邮报》）称他目前在温布尔登和西萨塞克斯两处房子之间轮流居住。这个说法只有单一弱来源，没有更高质量的媒体证实，这里如实标注。关于他70岁时的健康状况，没有找到公开信息。</p>\n<p><strong>对阿普特德和节目的评价。</strong> 和约翰（说&quot;从来没喜欢过迈克尔&quot;）以及查尔斯（说&quot; dread 七年一次的轮回&quot;）不同，安德鲁的立场是忠诚：他说自己一直参与这个项目，是因为它提供了&quot;跨越六十多年的、不可思议的、独一无二的对称性&quot;（celebrity24h.com，2026）。肯辛顿三人组里，他是唯一一个十次全勤的人——约翰缺席过几部、查尔斯只留了画外音和一张遮住脸的照片（Wikipedia，2026）。</p>\n<p><strong>对7岁自己的看法。</strong> 没有找到他在《70 Up》里专门谈论7岁自己的直接引语。最接近的是63岁时的态度——&quot;几乎为那个自视甚高的蠢小子感到羞愧&quot;（theartsdesk.com，2019）。而《70 Up》用档案影像把7岁唱拉丁语歌的男孩和70岁退休的老人并置在一起，这种对照本身就是一种回答。</p>\n"}],"compare":{"title":"7岁的他，和70岁的他","html":"<h3>没变的地方</h3>\n<ul>\n<li><strong>坚持。</strong> 42岁时他说自己的优点是&quot;坚持&quot;和&quot;不爱冒险&quot;（Boston Phoenix，1999），这八个字几乎可以概括他的一生：同一个职业、同一个妻子近五十年、每七年准时出现在镜头前。7岁时那种&quot;我知道我的人生是什么样&quot;的笃定，70岁时还在。</li>\n<li><strong>低调。</strong> 7岁时他是三人组里话最少、最不张扬的那一个；70岁时他依然是14个人里公开信息最少的一个，连父母的职业都没人知道。</li>\n</ul>\n<h3>完全改变的地方</h3>\n<ul>\n<li><strong>对&quot;特权&quot;的态度。</strong> 7岁时他理直气壮地享受着自己的位置，甚至把《金融时报》当成炫耀的资本；63岁后他说为那个&quot;自视甚高的蠢小子&quot;感到羞愧。这不是表演出来的谦虚——是一个人在镜头前被拍了63年之后，真正的自我审视。</li>\n<li><strong>对工作的态度。</strong> 年轻时工作就是人生的全部证明；70岁时他唯一的遗憾是工作挤掉了陪孩子的时间。那个曾经&quot;注定要在同一家律所干到死&quot;的人（Hudson Review，2007），最后说出的却是&quot;希望多陪孩子&quot;。</li>\n</ul>\n<h3>最出人意料的变化</h3>\n<p>有两个候选，都带着一点不确定性，但都值得说。</p>\n<p>第一，<strong>那段&quot;看起来要完&quot;的婚姻，活了将近48年。</strong> 有观众在《28 Up》后觉得他和简&quot;注定要完&quot;，结果这段婚姻成了全系列里最长久的之一，比绝大多数参与者的婚姻都长。</p>\n<p>第二，<strong>《49 Up》里那个突然&quot;辞职改建谷仓&quot;的安德鲁。</strong> 如果布鲁斯·鲍尔的记述属实，那将是这个&quot;最按剧本走的人&quot;一生中唯一一次撕剧本——可惜官方资料与之矛盾，真相至今不明。</p>\n"},"conclusion":"<p>一个7岁时就能把自己的一生背得像课文一样的孩子，几乎一字不差地兑现了预言：查特豪斯、剑桥、律师事务所合伙人、娶同一个女人近五十年、两个儿子也走上同一条路；他没有经历任何戏剧性的坠落，也没有创造任何奇迹，只是把63年活成了一条直线——然后在70岁时第一次承认，这条直线的代价，是孩子们长大的那些年，他不在场。</p>\n","sources":"<p>主要来源：Wikipedia &quot;Up (film series)&quot;（2026）；First Run Features《49 Up》press kit（2005）、《56 Up》press kit（2012）；theartsdesk.com《63 Up》评论（2019）；whattowatch.com《63 Up》前瞻（2019）；screen-space.net（2019）；Boston Phoenix《42 Up》评论（1999）；Bruce Bawer, Hudson Review（2007年8月）；eriklundegaard.com（2019）；Radio Times（2026）；memorabletv.com（2026）；celebrity24h.com（2026，转述《每日邮报》，低权威，已标注）。</p>\n<p>冲突与缺口：</p>\n<ol>\n<li>剑桥学院：三一学院（Wikipedia）vs 三一学堂（低质量来源），未解决。</li>\n<li>《49 Up》是否辞职改建谷仓：Hudson Review/Bawer（2007）说辞职了；官方《56 Up》press kit（2012）说&quot;仍在法律界工作&quot;。未解决。</li>\n<li>结婚年份：约1978年（IMDb类数据库）vs 官方press kit只说&quot;《35 Up》之前&quot;。两种说法一致指向1977–78年，但没有精确证实。</li>\n<li>缺口：准确出生日期和出生地；父母姓名与职业；肯辛顿预备学校校名；妻子简的姓氏；两个儿子的名字；有无孙辈；律所名称与专业领域；任何年龄段的健康状况；退休日常生活的细节（温布尔登/西萨塞克斯两处住所为单一弱来源）；他对阿普特德的直接评价。</li>\n</ol>\n"},"john":{"id":"john","name":"约翰·布里斯比","en":"John Brisby","nickname":"最不买账的御用大律师","avatar":"avatars/john.jpg","summary":"7岁时全国人民眼里的\"小势利鬼\"，长大后成了英国顶尖商事大律师（御用大律师）；他是全系列里唯一敢在终章镜头前说\"我从来没喜欢过迈克尔·阿普特德\"的人，用了63年证明节目组把他拍错了。","class7":"伦敦肯辛顿富裕家庭男孩，父亲9岁时去世，母亲是保加利亚人","education":"肯辛顿预备学校 → 威斯敏斯特公学（Westminster）→ 牛津大学基督堂学院（读法律）","career":"出庭大律师（barrister），1996年获御用大律师（KC）头衔；\"保加利亚之友\"慈善会主席","marriage":"1985年娶克莱尔·洛根（英国前驻保加利亚大使之女），未离","children":"无公开记录","turning":"28岁和42岁两次拒绝参演；35岁起要求永不由阿普特德采访；把节目称为\"生命里的一颗小毒丸\"","status70":"仍在执业的大律师，投身保加利亚慈善，在终章与节目彻底\"算账\"","alive":true,"tags":["精英家庭","上大学","退出过节目","退休"],"intro":"<p>约翰是14个孩子里最有名的&quot;反派&quot;：7岁时那个在镜头前大谈报纸、学校和&quot;女孩会让男孩分心&quot;的小男孩，让几代英国观众记住了&quot;阶级傲慢&quot;长什么样。他后来的人生倒是没辜负那份伶牙俐齿——威斯敏斯特公学、牛津读法律，1978年成为出庭大律师，1996年获御用大律师头衔，是英国顶尖的商事诉讼律师之一，还长期担任&quot;保加利亚之友&quot;慈善会主席。但他和这部纪录片的关系，是全系列最刺眼的一条裂缝：28岁和42岁两次拒绝参演，35岁起要求永远不由阿普特德亲自采访，把节目称为&quot;生命里的一颗小毒丸&quot;，并在2026年的终章里当众说：&quot;我从来没喜欢过迈克尔。&quot;</p>\n","background":"<p>约翰的全名很长：John Constant Shannon Mcburney Brisby，1956年5月生于伦敦（具体日期有5月5日和5月8日两种说法，见文末冲突）。他的家庭背景比表面看起来复杂得多——这也是他晚年反复用来反驳&quot;特权标签&quot;的弹药。</p>\n<p>他的父亲迈克尔·布里斯比是英国人，在约翰9岁那年去世（1965年）。母亲莉莉安娜·布里斯比（1923–1998）是保加利亚人，她的讣告登在1998年11月的《独立报》上。约翰还有一个兄弟和一个姐妹。往上追溯，外祖父是保加利亚著名的商人、政治家和慈善家，高祖则是保加利亚第一任首相——这份血统成了他成年后身份认同的核心，也是他解释自己为什么投身保加利亚慈善事业的理由（Wikipedia，2026；Film Comment，2019）。</p>\n<p>这里必须说清楚一件事：节目组把他塑造成&quot;含着金汤匙出生的上流男孩&quot;，但约翰在56岁那集里公开反驳过这个标签——父亲9岁去世后，是母亲打工供他读完收费学校，牛津他是靠奖学金去的（Fandom Up Series，转述《56 Up》，2012）。一个细节很能说明问题：他7岁时说以后要去威斯敏斯特公学然后上剑桥，结果他确实进了威斯敏斯特，但大学去的是牛津不是剑桥（TV Guide，2026）。阶级给了他起跑线，但&quot;丧父+移民母亲打工+奖学金&quot;这条线，节目组在早期几乎没拍。</p>\n<p>换句话说，约翰的童年是一个被简化的童年。镜头只保留了&quot;小绅士&quot;，剪掉了&quot;9岁丧父的男孩&quot;和&quot;保加利亚移民的儿子&quot;。这个剪辑决定，成了他后来六十年愤怒的源头。</p>\n","ages":[{"age":7,"title":"7岁 ——《Seven Up!》（1964）","html":"<p>7岁的约翰是三个肯辛顿男孩里话最多的一个，也是今天看来最&quot;不讨喜&quot;的一个。Film Comment（2019）回顾时形容他是&quot;一个 outrageous 的小性别歧视者……一个可怕的小势利鬼&quot;。</p>\n<p>他留下的名场面有这么几句：被问看什么报纸，他说&quot;我看《观察家报》和《泰晤士报》&quot;（粉丝整理的逐字稿，fanfare.metafilter.com）；谈到收费学校，他和同伴们为私立教育辩护，理由是如果免费开放，&quot;学校会又脏又挤&quot;——完整对话里还有&quot;那穷人会涌进来&quot;这样的句子；谈到女孩，他说&quot;男孩跟女孩混在一起，就不好好干正事了&quot;。</p>\n<p>这几分钟的画面让他成了全英国最有辨识度的孩子之一——用他后来的话说，成了一个&quot;招人恨的形象&quot;。2026年他在《70 Up》里回忆：年轻时当律师，有人见了他会承认， approach 他之前心里先有了一种&quot;本能的反感&quot;，那是看节目看出来的；而真正认识他7岁时的人记得的是&quot;一个挺不错的孩子，还有点爱做梦&quot;，那一面镜头从来没拍（TV Guide，2026）。他对电视里那个7岁自己的评价是：&quot;一个可怕的小势利鬼&quot;（TV Guide，2026）。</p>\n<p><strong>伏笔：</strong> 7岁时的伶牙俐齿和好斗，后来原封不动地长成了职业——Legal 500 评价他是&quot;凶猛的交叉盘问者&quot;。那个在沙发上跟人辩论的小男孩，70岁时还在盘问，只不过被告席上坐的是这部纪录片本身。</p>\n"},{"age":14,"title":"14岁 ——《7 Plus Seven》（1970）","html":"<p>14岁的约翰&quot;开始大谈政治&quot;（Fandom Up Series），Film Comment（2019）回顾档案影像时注意到，14岁的他宣称自己的志向是&quot;政治权力&quot;。从这一集起，阿普特德正式接过导筒。</p>\n<p>按约翰后来的说法，正是包括这一集在内的&quot;头三部&quot;，让他开始对节目产生不满（BBC，2026，转引自Wikipedia）。公众印象里的&quot;小傲慢鬼&quot;形象，在这一集被进一步焊死。</p>\n"},{"age":21,"title":"21岁 ——《21 Up》（1977）","html":"<p>21岁的约翰在牛津大学基督堂学院读法律的最后一年（1974–1977）。Film Comment（2019）形容21岁的他&quot;穿着三件套西装，自信得扎眼&quot;。</p>\n<p>值得一提的是，《21 Up》是查尔斯·弗诺作为完整参与者的最后一集——查尔斯此后退出。三人组从这里开始分叉：安德鲁留下，约翰开始对抗，查尔斯直接走人。</p>\n"},{"age":28,"title":"28岁 ——《28 Up》（1984）：第一次拒绝","html":"<p>约翰拒绝出演《28 Up》——这是他第一次退出。他在2026年《70 Up》里亲口解释了原因：&quot;28岁那年，我对头三部里自己被呈现的样子很不满意&quot;（TV Guide，2026）。</p>\n<p>此时的他已经在1978年7月取得出庭大律师资格，正在打拼事业。他觉得节目已经给他造成了职业伤害：把他钉死在&quot;阶级漫画人物&quot;的位置上，走到哪儿都有人带着看节目形成的偏见看他。对一个靠法庭辩论吃饭的人来说，&quot;全国人民先入为主地讨厌你&quot;是实实在在的损失。</p>\n"},{"age":35,"title":"35岁 ——《35 Up》（1991）：有条件的回归","html":"<p>他同意回来了，但开了两个硬条件：第一，采访他的人不能是迈克尔·阿普特德；第二，节目必须拍他的慈善工作——他称之为保加利亚人道主义危机（Entertainment Daily，2026）。从这一集起，他的采访永远由阿普特德之外的人来做，这个条件一直延续到阿普特德导演的最后一集。</p>\n<p>也是在这一集，他说出了那句载入史册的话，称这部系列片是&quot;a little pill of poison in my life&quot;——&quot;我生命里的一颗小毒丸&quot;（The i Paper，2026，转引自Wikipedia）。他说自己回来只是为了给选定的慈善机构多争取曝光，并批评阿普特德为了叙事需要，故意忽略他的慈善工作和保加利亚血统（Wikipedia，2026）。</p>\n<p>个人生活方面：他此时已与克莱尔·洛根结婚——她是英国前驻保加利亚大使唐纳德·洛根爵士的女儿（Fandom Up Series）。结婚年份有两个说法：1985年（Wikipedia，引家谱网站）或1991年（ScreenDollars，低权威来源）。1985年的说法更可信。关于两人的子女：没有任何可靠来源提到过孩子，这里不做推测。</p>\n"},{"age":42,"title":"42岁 ——《42 Up》（1998）：第二次退出","html":"<p>他没有出现在《42 Up》里（Wikipedia，2026）。这一集也是全系列唯一一次在BBC One播出（而非ITV）。关于他为什么偏偏缺席这一集，没有找到公开的具体解释。</p>\n"},{"age":49,"title":"49岁 ——《49 Up》（2005）：回归","html":"<p>缺席14年后他回来了。官方press kit写道：&quot;在《49 Up》里，约翰解释了他为什么决定回到这个系列，以及他现在在做什么&quot;（First Run Features，2005）。当时的一篇美国评论写道，约翰把这个系列比作低劣的真人秀——但承认，这点小名气其实帮到了他的生意（Combustible Celluloid，2006）。有观众觉得，这一集里的他&quot;比以前任何一集都讨喜&quot;（Letterboxd观众评论）。</p>\n<p>事业上，此时他已是御用大律师——1996年获&quot; silk &quot;头衔（Chambers，经Wikipedia，2026）。Hudson Review（2007）也确认&quot;约翰现在是御用大律师&quot;。</p>\n"},{"age":56,"title":"56岁 ——《56 Up》（2012）：正面反驳","html":"<p>已经是资深商事诉讼律师的约翰，在这一集里对节目的阶级叙事发起了最直接的一次挑战。他公开反驳阿普特德把他包装成&quot;特权上流阶级&quot;的做法：父亲9岁去世、母亲打工供他读贵族学校、牛津靠奖学金（Fandom Up Series，转述《56 Up》）。他形容自己是个觉得&quot;人生几乎方方面面都很幸运&quot;的诉讼律师。</p>\n<p>这一时期也是他职业声望的顶峰：2015年他被评为Chambers英国律师奖&quot;年度商事御用大律师&quot;（Chambers，经Wikipedia，2026）。</p>\n"},{"age":63,"title":"63岁 ——《63 Up》（2019）","html":"<p>美国公共电台的一篇评论形容63岁的约翰&quot;穿着粗花呢、头发稀疏，明显温和了许多&quot;，他&quot;幸福地退休，把时间投入到和妻子一起在巴尔干地区的慈善工作&quot;，并指出&quot;我们早年对他财富和蓝血的假设，结果是错的&quot;（KHSU/NPR，2019）。Film Comment（2019）觉得他变成了&quot;谦逊得多、富有同情心的人，比早期那些形象复杂得多&quot;——他提醒观众，母亲是保加利亚人、外祖父是&quot;革命者&quot;，而节目一直把他当&quot;富家子&quot;符号来用。</p>\n<p>按系列资料记载，在《63 Up》里他又一次称节目为&quot;小毒丸&quot;，但也承认看到了它的价值（Wikipedia，Up film series，2026）。这是阿普特德导演的最后一集——他于2021年1月去世，享年79岁。</p>\n"},{"age":70,"title":"70岁 ——《70 Up》（2026）","html":"<p>《70 Up》2026年9月15日、22日在ITV1和ITVX播出两集，由阿西夫·卡帕迪亚执导。约翰出现在回归名单中，节目单上写的是&quot;John Brisby KC&quot;（m247.newsonline.biz，2026）。</p>\n<p><strong>住址与事业。</strong> 他住在伦敦和北安普敦郡（Chambers，经Wikipedia，2026）。没有任何可靠来源显示他移民国外——所谓&quot;搬去国外&quot;的说法不成立；有充分证据的是他深度参与保加利亚慈善。他仍是执业大律师：在林肯律师学院的4 Stone Buildings出庭，专长公司/商事诉讼，Chambers记载他经手过150多个有判例记录的案子，包括巴林银行、安然、麦道夫案、LIBOR操纵案等（Chambers）。他是英国慈善机构&quot;保加利亚之友&quot;（Friends of Bulgaria，1991年在英国成立）的主席，妻子克莱尔也在该机构执行委员会任职（机构官网）。该机构的记录显示，他曾为给保加利亚斯塔拉扎戈拉市一家弃婴之家的音乐舞蹈项目筹款，去爬巴尔干的山。</p>\n<p><strong>健康与退休。</strong> 63岁时他被描述为&quot;向慈善工作退休&quot;（KHSU，2019），但2021年5月他还在上诉法院出庭（4 Stone Buildings记录）。70岁时的健康状况、孙辈、日常生活细节：没有找到公开信息。</p>\n<p><strong>对阿普特德和节目的评价——全系列最狠的一次清算。</strong> 《70 Up》里有他最不留情面的表态：&quot;我从来没喜欢过迈克尔&quot;（Wikipedia，2026）；&quot;我和迈克尔·阿普特德之间不存在什么关系。他有一种讥讽的、居高临下的做派。我不觉得他站在我这边&quot;；&quot;他想要的是一个假的我，一个稻草人&quot;（TV Guide，2026；Entertainment Daily，2026）。他强调自己和阿普特德&quot;没有闹翻&quot;——&quot;但我不喜欢他，也不信任他&quot;（Entertainment Daily，2026）。他说自己&quot;被安排去代表一个在现代世界已经没有意义的、过时的阶级制度&quot;（TV Guide，2026），并在镜头前披露：从35岁起采访他的从来不是阿普特德本人——这是他当年回归的条件（Wikipedia，Up film series，2026）。《每日邮报》的克里斯托弗·史蒂文斯总结他的指控是：阿普特德&quot;把特权阶层画成稻草人&quot;，同时也承认阿普特德自己说过早年&quot;带着评判的眼光&quot;（Broadcast，2026，评论综述）。</p>\n<p><strong>对7岁自己的看法。</strong> 他称电视里的7岁自己是&quot;一个可怕的小势利鬼&quot;，但坚持真正的孩子&quot;其实挺不错的……有点爱做梦&quot;，那一面节目从来没拍（TV Guide，2026）。他的 complaints 不是说画面造假，而是说剪辑有选择：留下了势利鬼，剪掉了做梦的孩子。</p>\n<p>节目最后，他和其他参与者一起向这个系列告别（TV Guide，2026）。</p>\n"}],"compare":{"title":"7岁的他，和70岁的他","html":"<h3>没变的地方</h3>\n<ul>\n<li><strong>能言善辩和好斗。</strong> 7岁时对着镜头大谈报纸、学校和异性的小男孩，长成了被Legal 500称为&quot;凶猛的交叉盘问者&quot;的御用大律师——&quot;是个斗士，不怕得罪人&quot;。7岁时的辩论欲，70岁时原样保留，只是辩论对象变成了节目本身。</li>\n<li><strong>核心预言应验。</strong> 威斯敏斯特（去了），法律职业（成了，只是牛津代替了剑桥）。</li>\n</ul>\n<h3>完全改变的地方</h3>\n<ul>\n<li><strong>&quot;势利&quot;的公开表达——至少是表现形式。</strong> 为收费学校辩护、怕学校&quot;又脏又挤&quot;的孩子，长大后把大量工作时间给了保加利亚弃婴之家的慈善事业，到63岁时被评论家形容为&quot;谦逊&quot;&quot;富有同情心&quot;（Film Comment，2019）。7岁时他在表演特权；70岁时他在为&quot;被塑造成特权符号&quot;这件事赎罪。</li>\n<li><strong>与镜头的敌对程度。</strong> 7岁时他享受镜头；从28岁起，镜头成了他要谈判、要设条件、要清算的对象。</li>\n</ul>\n<h3>最出人意料的变化</h3>\n<p>节目组钦定的&quot;反派&quot;，成了全系列道德感最强、同时也最愤怒的参与者。大多数参与者最后都温和地原谅了阿普特德，只有约翰在终章镜头前说：我从来没喜欢过他，不信任他，他要的从来不是真实的我。那个看起来最&quot;代表阶级制度&quot;的男孩，最后成了这个系列内部最 persistent 的批评者——批判的恰恰是节目组拍阶级的方式。</p>\n"},"conclusion":"<p>约翰·布里斯比让耶稣会那句箴言对了一半：7岁的孩子确实预示了成年后的男人——但不是镜头里那个小势利鬼预示的傲慢，而是一个 formidable 的、好斗的大律师，用接下来的63年，在法庭上和在镜头前双线作战，盘问这个让他出名的节目到底有没有拍出真实的他；他赢了事业，赢了慈善，唯独没赢回7岁时那个&quot;挺不错、有点爱做梦的孩子&quot;的名声——因为那一面，从来没被拍下来过。</p>\n","sources":"<p>主要来源：Wikipedia &quot;John Brisby&quot; / &quot;Up (film series)&quot;（2026）；Bar Standards Board 律师名录；Chambers &amp; Partners 约翰·布里斯比 profile；4 Stone Buildings 律师事务所官网；Friends of Bulgaria 官网；TV Guide（Natasha Rigler，2026年9月18日）；Entertainment Daily（2026年9月）；Broadcast（2026年9月评论综述）；The Observer（2026年9月）；The i Paper（Nick Duerden，2026年9月15日）；Film Comment（2019）；KHSU/NPR（2019）；Screen-Space（2019）；First Run Features《49 Up》press kit（2005）；Hudson Review（Bruce Bawer，2007）；The Independent（1998年11月，莉莉安娜讣告，经Wikipedia转引）。</p>\n<p>冲突与缺口：</p>\n<ol>\n<li>出生日期：1956年5月5日（Wikipedia信息框）vs 5月8日（Wikipedia正文及其他电影资料站）。统一记为1956年5月。</li>\n<li>结婚年份：1985年（Wikipedia，引家谱网站）vs 1991年（ScreenDollars，低权威）。采用1985年。</li>\n<li>TV Guide（2026）称他为&quot;法官&quot;（judge），但所有法律名录都只记录他是执业大律师/KC，无任何法官任命记录，应为媒体笔误。</li>\n<li>缺口：有无子女及孙辈（无任何可靠来源提及）；肯辛顿预备学校校名；威斯敏斯特（1969–1973）到牛津（1974）之间空了一年的解释；缺席《42 Up》的具体原因；70岁时的健康状况与退休细节；是否移民（无证据，现有记录为伦敦和北安普敦郡两处居住）。</li>\n</ol>\n"},"charles":{"id":"charles","name":"查尔斯·弗诺","en":"Charles Furneaux","nickname":"拒绝了半个世纪的幕后人","avatar":"avatars/charles.jpg","summary":"7岁时被钉上\"肯辛顿三公子\"标签的男孩，21岁拍完《21 Up》就转身离开，此后49年拒绝一切采访和出镜，却在幕后成了英国最顶尖的纪录片制作人之一（监制过拿下BAFTA的《触摸虚空》）；2026年终章，他时隔49年开口——只出声音、不露脸。","class7":"伦敦肯辛顿富裕家庭男孩，三人组里\"最不合群的第三个\"","education":"肯辛顿预备学校 → 马尔伯勒公学（Marlborough）→ 杜伦大学（现代史，1978年毕业）→ 牛津读研","career":"纪录片导演/制片人：BBC、Channel 4 委托编辑、Talkback Thames 纪实部门主管；创办 Kaboom Film & TV；约2017年退休","marriage":"与乔斯琳·安·詹姆斯（Jocelyn Ann James）结婚（据IMDb类来源称1990年起），育有二孩（单一来源，未完全证实）","children":"两个孩子（单一IMDb类来源，未完全证实）","turning":"21岁后彻底退出节目49年；2026年《70 Up》以画外音+遮脸登山照片回归","status70":"退休纪录片制片人，热爱登山，70岁终章只献声不露面","alive":true,"tags":["精英家庭","上大学","退出过节目","退休"],"intro":"<p>查尔斯是《人生七年》里最大的&quot;未解之谜&quot;：7岁时他是肯辛顿三个小绅士之一，21岁拍完《21 Up》后，他拒绝了《28 Up》，然后消失了整整49年——不出镜、不接受采访，甚至试图起诉让节目组删掉档案里他的画面。与此同时，他在镜头后面活出了另一种人生：BBC受训出身，做过《Panorama》制片人、Channel 4 委托编辑、Talkback Thames 纪实部门主管，自己创办制作公司，监制的《触摸虚空》（Touching the Void）拿下BAFTA最佳英国电影，《鸡的自然史》拿下艾美奖。2026年《70 Up》终章，阿普特德已经去世五年，新导演阿西夫·卡帕迪亚接棒，查尔斯终于开口——但条件是：只出声音，不露脸，连提供的登山照片都要把脸遮住。</p>\n","background":"<p>查尔斯的全名是 Charles St John Wallace Furneaux（英国公司注册处 Kaboom Film &amp; Television Ltd 记录；Wikipedia，2026）。关于他的家庭，公开资料少得惊人——这很符合他一生的风格。</p>\n<p>出生年份有两个说法：1956年（ScreenDollars/IMDb）或1957年（Wikipedia正文；信息框写&quot;1956或1957&quot;），没有确切到日的记录。出生地据单一IMDb类来源称是伦敦哈克尼，未经证实。父母的姓名、职业：没有任何公开来源。家庭成员：不详。他母亲只在他2026年的发言里被间接提到过一次——他说当年&quot;为这事跟我妈闹过&quot;，怪她1964年稀里糊涂就同意他参演（经Wikipedia转引《镜报》，2026年9月）。</p>\n<p>能确定的是阶级标签：所有资料都把他描述为三个肯辛顿预备学校男孩之一（另两人是安德鲁和约翰），上流阶层无疑。他后来上的马尔伯勒公学是英格兰最著名的私立寄宿学校之一。</p>\n<p>这里有一个值得玩味的细节：2026年他回忆，1964年校长之所以同意拍摄，是因为&quot;想给学校做宣传&quot;（TV Guide，2026年9月11日）。也就是说，连这所预备学校的名字，公开资料里都找不到——一个想&quot;做宣传&quot;的学校，六十年后名字依然成谜。这多少说明了查尔斯家族和这个圈子对隐私的守护到了什么程度。</p>\n<p>阶级对他的影响，和对安德鲁、约翰的影响不太一样。安德鲁是&quot;享受并兑现&quot;特权，约翰是&quot;被标签激怒然后反驳&quot;，查尔斯则是第三种：<strong>他觉得这个标签从一开始就贴错了人</strong>。2026年他说：&quot;我被迫和两个男孩绑在一起，他们人都不错，但不是我的朋友……从选角上，我这辈子就被钉死在这个组合里了。我觉得我和他们不一样&quot;（TV Guide，2026年9月）。三人组里，他一直是那个&quot;不合群的第三个&quot;。</p>\n","ages":[{"age":7,"title":"7岁 ——《Seven Up!》（1964）","html":"<p>1964年，三个肯辛顿男孩一起用拉丁语唱《Waltzing Matilda》出场（Wikipedia，Up film series，2026）。三个孩子都能说出自己想去的预备学校、公学和大学——牛津或剑桥，其中两个连具体学院都想好了（Wikipedia；The Times，2026年9月）。</p>\n<p>查尔斯7岁最著名的瞬间不是一句话，而是一个<strong>问题</strong>。当约翰回答完&quot;最喜欢哪份报纸&quot;后，坐在沙发另一头的查尔斯探身追问了一句：&quot;那你喜欢它什么？&quot;（&quot;What do you like about it?&quot;）影评人布鲁斯·鲍尔（2007）写道，这个7岁的查尔斯——日后会成为记者和纪录片导演——&quot;已经像个本能的采访者&quot;。这是他一生最早的预告：<strong>他永远是话筒后面那个人，哪怕当时他是被采访的对象。</strong></p>\n<p>他7岁时说想当什么？没有任何来源记录。不像尼克那句&quot;我想了解月亮的一切&quot;广为流传，查尔斯的童年志向是个空白。</p>\n<p><strong>伏笔：</strong> 7岁那个追问&quot;为什么&quot;的男孩，和70岁那个只肯用声音提问、不肯露脸的老人，是同一个人。他一辈子都在问问题，只是不许别人问他。</p>\n"},{"age":14,"title":"14岁 ——《7 Plus Seven》（1970）","html":"<p>关于14岁的查尔斯，没有找到任何具体记录。这也是他资料里系统性缺失的一部分——从少年时期起，公开文字就很少提到他。</p>\n"},{"age":21,"title":"21岁 ——《21 Up》（1977）：最后一次完整出镜","html":"<p>《21 Up》播出于1977年5月9日。此时的查尔斯在杜伦大学读现代史。他<strong>没有考上牛津</strong>——他在节目里说，自己很高兴避开了&quot;预备学校—马尔伯勒—牛津剑桥&quot;这条传送带，去了杜伦（Wikipedia，Up film series，2026）。评论者形容21岁的他&quot;又瘦又留着长发&quot;（Erik Lundegaard，2020）。</p>\n<p>2026年回看这一集，他说拍《21 Up》是痛苦的：&quot;拍21岁那集挺痛苦的。我看起来已经跟另外两个不太一样了。我有种被困住的感觉，被困在一个不属于我的处境里&quot;（TV Guide，2026年9月11日）。他还说，自己开始&quot; dread 七年一次的轮回&quot;——害怕镜头每七年准时回来。</p>\n<p>这是他作为完整参与者的最后一集。之后发生的事，成了这个系列最著名的决裂。</p>\n"},{"age":28,"title":"28岁 ——《28 Up》（1984）：转身离开","html":"<p>他拒绝了《28 Up》。从他2026年的发言和早年记录里，可以拼出他离开的四个原因：</p>\n<p>第一，<strong>被选角。</strong> &quot;我觉得他（阿普特德）给每个人都定了角色，每个人都有自己的戏份要演。有的人还真就认了&quot;（TV Guide，2026年9月）。</p>\n<p>第二，<strong>对电视这种媒介本身的不信任。</strong> &quot;电视会对人做什么，这是个问题。这就是我对迈克尔（阿普特德）的不满，也是我从28岁起不再参与的原因&quot;（TV Guide，2026年9月）。</p>\n<p>第三，<strong>同意问题。</strong> 他说1964年时，无论是孩子还是家长，都没明白自己同意的是什么：&quot;我们根本不知道发生了什么。后来我为这事跟我妈闹过，她说校长想给学校做宣传。我们从来没真正同意过。我父母也不知道发生了什么&quot;（经Wikipedia转引《镜报》，2026年9月）。</p>\n<p>第四，<strong>和阿普特德的私人决裂。</strong> 他拒绝《28 Up》后，两人通过一次电话，阿普特德<strong>亲口承认自己&quot;气疯了&quot;</strong>（&quot;went berserk&quot;）——关系彻底完蛋（Wikipedia，Up film series，2026）。阿普特德后来也承认很震惊：&quot;有点意外。我们完全没想到他会走&quot;（nightviz.ca，转引阿普特德访谈）。</p>\n<p>离开之后，他不只是&quot;淡出&quot;，而是<strong>主动反抗</strong>：阿普特德在2005年伦敦国家电影院的一次对谈里说，查尔斯曾试图<strong>起诉</strong>，要求把《49 Up》档案片段里他的形象删掉（Allison Pearson，《每日电讯报》，2012年5月16日）。2012年阿普特德还对《Radio Times》说，查尔斯也想把自己从更早的几部里删掉，&quot;但他是著名的'三公子合影'里不可分割的一部分，格兰纳达电视台让他该干嘛干嘛去&quot;（Radio Times，2012年5月14日）。阿普特德说，最让他&quot;难以下咽&quot;的是，查尔斯自己后来成了纪录片导演——&quot;讽刺的是，身为纪录片导演，他是唯一一个拒绝继续的人&quot;（Wikipedia，Up film series，2026）。《每日电讯报》的艾莉森·皮尔森当时写道：&quot;一个靠电视发了财的人，却拒绝为电视史上最伟大的丰碑献出自己的生活，这说明了什么？&quot;（2012年）。</p>\n<p>从《28 Up》到《49 Up》，他还出现在档案片段里；《56 Up》（2012）和《63 Up》（2019）里，除了和安德鲁、约翰的三人合影一闪而过，所有关于他的内容都被拿掉了（Wikipedia，Up film series，2026）。</p>\n"},{"age":35,"title":"35岁 ——《35 Up》（1991）","html":"<p>他不在。这一时期他在做什么？公开记录显示他正在电视圈里往上走：1988–92年间做了15集《Panorama》的制片人（Wikipedia，2026）。一个拒绝被拍的人，正在学习怎么拍别人。</p>\n"},{"age":42,"title":"42岁 ——《42 Up》（1998）","html":"<p>他不在。这一年他出现在Channel 4的一档观众评论节目《Right to Reply》里，谈论电视节目（BFI，1998）——有意思的是，他愿意谈论电视，只是不愿意谈论自己被电视拍这件事。</p>\n<p>职业上，90年代中期他是BBC的导演，作品包括《Secret Lives》（1995）、 landmark 系列《People's Century》的两集（1996）、人物纪录片《Jackie O》（1995）。1994年他成为Channel 4的委托编辑（Wikipedia，2026）。</p>\n"},{"age":49,"title":"49岁 ——《49 Up》（2005）","html":"<p>他不在——而且这一年阿普特德公开了他试图起诉删画面的事（见上）。职业上，2003年他跳槽到Talkback Thames，任纪实与纪录片部门主管（《卫报》，2004年3月17日，John Plunkett报道了这次从Channel 4挖人的消息），2007年辞职创办自己的制作公司 Kaboom Film &amp; TV（Wikipedia，2026）。</p>\n<p>他监制的作品开始拿奖：《鸡的自然史》（The Natural History of the Chicken，2000）获2002年艾美奖最佳科学与自然类长节目（Emmyonline.org）；《触摸虚空》（Touching the Void，2003，凯文·麦克唐纳导演）获2004年BAFTA最佳英国电影（BBC News，2004年2月15日；BFI ScreenOnline）。</p>\n"},{"age":56,"title":"56岁 ——《56 Up》（2012）","html":"<p>他不在，除了三人合影的闪回。这一年《每日电讯报》发表了艾莉森·皮尔森那篇著名的质问（见上）。同一年他仍在Talkback Thames体系内工作至2007年创办Kaboom之后——更准确地说，2012年时他已是Kaboom的老板。</p>\n"},{"age":63,"title":"63岁 ——《63 Up》（2019）","html":"<p>他不在。这一年《触摸虚空》之后他又添了重要作品：《托马斯·胡恩德尔之死》（The Shooting of Thomas Hurndall，2008）获2009年两项BAFTA和蒙特卡洛金仙女奖（BAFTA.org）；《戴安娜：她的自述》（Diana: In Her Own Words，2017年8月6日播出）成为Channel 4自2014年以来收视最高的纪录片，峰值410万观众（KaboomTV.co.uk，经Wikipedia，2026）。约2017年他退休（Wikipedia，2026；多家2026年9月媒体称他为&quot;退休电视制片人&quot;）。</p>\n"},{"age":70,"title":"70岁 ——《70 Up》（2026）：时隔49年的声音","html":"<p>《70 Up》于2026年9月15日、22日在ITV1和ITVX播出两集90分钟，由奥斯卡导演阿西夫·卡帕迪亚执导——阿普特德已于2021年1月去世，享年79岁。两位原始参与者在终章前去世：林恩·约翰逊（2013年）和尼克·希钦（2023年，节目收录了他生前录好的采访）。</p>\n<p>2026年4月，《Radio Times》（Katelyn Mensah）率先报道查尔斯将回归终章——这是他自《21 Up》之后第一次参与（Radio Times，2026年4月16日）。9月的报道确认了细节（TV Guide，2026年9月11日；《泰晤士报》，2026年9月）。</p>\n<p><strong>他回归的条件，每一条都刻着他的名字：</strong></p>\n<ul>\n<li>他<strong>不出镜</strong>，贡献的是<strong>画外音</strong>，这是他1977年以来第一次参与（Wikipedia；TV Guide，2026年9月11日）；</li>\n<li>他提供了自己登山时的近照，但照片里他的脸被<strong>&quot;故意遮住&quot;</strong>（Wikipedia，Up film series；TV Guide，2026年9月11日）。</li>\n<p><strong>他为什么回来？</strong> 没有任何来源记录他亲口说出的单一理由。但几个因素凑到了一起，指向很明显：第一，<strong>阿普特德2021年去世</strong>，那个和他决裂的人不在了，障碍消失；第二，<strong>新导演卡帕迪亚</strong>，他和查尔斯没有任何过节；第三，<strong>系列终结</strong>——这是一次性的终章，不是一份新的七年合约；第四，<strong>用他自己的方式讲自己的版本</strong>——只有声音、遮住脸、不出镜。《泰晤士报》的评论还加了一个细节：阿普特德晚年曾&quot;开着一辆 flash 的车&quot;去劝他回来，而查尔斯——这个后来自己也干电视的人——想证明的是：人是可以说&quot;不&quot;的（《泰晤士报》，2026年9月）。他的回归不是和节目的和解，而是对&quot;如何被拍&quot;这件事的终极掌控。用一位评论者的话说：&quot;在镜头里待了一辈子之后，这一次，他决定自己怎么入镜&quot;（gazettely.com，2026年9月）。</p>\n<p><strong>他的画外音说了什么</strong>（2026年9月各媒体 condensed）：</p>\n<li>谈电视对拍摄对象的权力：&quot;电视会对人做什么，这是个问题。这就是我对迈克尔的不满，也是我从28岁起不再参与的原因。&quot;</li>\n<li>谈被选角：&quot;我觉得他给每个人都定了角色，每个人都有自己的戏份要演。&quot;</li>\n<li>谈三人组标签：&quot;我被迫和两个男孩绑在一起，他们人都不错，但不是我的朋友……从选角上，我这辈子就被钉死在这个组合里了。我觉得我和他们不一样。&quot;</li>\n<li>谈七年轮回：他&quot;dread&quot;它；&quot;拍21岁那集挺痛苦的……我有种被困住的感觉，被困在一个不属于我的处境里。&quot;</li>\n<li>谈同意：父母当年稀里糊涂就同意了，校长是为了&quot;给学校做宣传&quot;；&quot;我们从来没真正同意过。&quot;</li>\n<li>谈职业路：画外音里 trace 了他从报纸编辑到BBC制片人的路（TV Guide，2026年9月11日）。</li>\n<p><strong>评论界怎么看他的回归：</strong> 《泰晤士报》给了五星，从&quot;同意&quot;这个角度框定他的回归——每七年在电视上看到自己的脸&quot;是有代价的&quot;；他想告诉人们，人是可以说不的，哪怕对方是开着豪车来的好莱坞导演。gazettely.com的评论写道：&quot;查尔斯最清楚地证明了，出演这个系列是一个选择……他的照片比任何善意的宣言都更有力：<strong>在镜头里待了一辈子之后，他决定自己怎么入镜。</strong>&quot; 露西·芒甘（《卫报》，2026年9月15日）给了《70 Up》五星，特别提到了终章里参与者们对阿普特德和这个系列的元叙事评价（经broadcastnow.co.uk评论综述）。</p>\n<p><strong>70岁的现状（截至2026年9月）：</strong> 退休纪录片制片人；热爱登山——他提供的照片就是登山时拍的，脸被遮住（TV Guide，2026年9月11日）；与乔斯琳·安·詹姆斯结婚（公司记录证实这段关系；&quot;1990年起结婚、有两个孩子&quot;的说法来自单一IMDb类来源，未经证实）；住在哪里：<strong>没有任何报道</strong>；健康状况：<strong>没有报道</strong>，70岁还在登山。</p>\n<p>关于婚姻多说一句：ScreenDollars（IMDb数据）称&quot;他与乔斯琳·A·詹姆斯自1990年起结婚，有两个孩子&quot;。英国公司记录强力佐证了这段关系：乔斯琳·安·詹姆斯曾任Kaboom Film &amp; Television Ltd 的公司秘书（2007年10月2日任命，2026年9月23日辞任），查尔斯本人持有公司100%股份（uk.globaldatabase.com；companydatashop.com，2026年抓取）。所以婚姻关系本身可信度高，但&quot;1990年&quot;和&quot;两个孩子&quot;只有单一弱来源，没有英国主流媒体或官方记录佐证——孩子的名字、年龄从未公开过。</p>\n</ul>\n"}],"compare":{"title":"7岁的他，和70岁的他","html":"<h3>没变的地方</h3>\n<ul>\n<li><strong>本能的采访者。</strong> 7岁时他探身问约翰：&quot;那你喜欢它什么？&quot;（Bawer，2007）；70岁时他给《70 Up》的贡献依然是&quot;只有声音、没有画面&quot;——一个用声音提问的人。他永远是话筒后面那一个，哪怕他是被拍的对象。</li>\n<li><strong>说了算。</strong> 7岁的他能准确说出自己要去的学校和大学；70岁的他开出了回归的条件：只出声音、遮住脸、不出镜。同一个男孩，规划好了进英国名校的路，也规划好了怎么走出英国最有名的纪录片。</li>\n<li><strong>三人组里的局外人。</strong> 2026年他说那两个&quot;不是我的朋友&quot;，他&quot;和他们不一样&quot;。他从来没觉得自己属于那个&quot;肯辛顿三公子&quot;的镜头，从7岁到70岁，这个坚持没变过。</li>\n</ul>\n<h3>完全改变的地方</h3>\n<ul>\n<li><strong>和镜头的权力关系。</strong> 7岁时，他在父母和校长都没搞明白的情况下被拍；70岁时，他控制了每一个像素：自己提供的照片、遮住的脸、不出的镜。被拍的对象，成了自己形象的制片人——而这，字面意义上就是他的职业。</li>\n<li><strong>和电视的关系。</strong> 1977年他离开了电视史上最有名的系列，然后花了四十年在电视圈里爬到顶层：BBC、Channel 4、Talkback Thames纪实部门主管，监制出BAFTA获奖作品。那个对电视说&quot;不&quot;的男孩，成了英国电视纪实领域获奖最多的人之一。阿普特德说这事让他&quot;难以下咽&quot;（Radio Times，2012）——可以理解。</li>\n<li><strong>可见度。</strong> 1977到2026，49年：不接受采访、不出镜、不公开评论，一片寂静。然后为了终章，他开口了。分量拿捏到克：刚好够回答这个系列里最长寿的谜题，不多给一克。</li>\n</ul>\n<h3>最出人意料的变化</h3>\n<p>那个拒绝&quot;预备学校—马尔伯勒—牛津剑桥传送带&quot;的人，最后恰恰<strong>钻进了生产这个系列的那台机器内部</strong>——BBC、Channel 4、Talkback Thames——成了一个比阿普特德更懂纪录片的人。他对电视的报复不是离开电视，而是精通电视，然后以精通者的权威，再拒绝它一次。这一次，没人能说他不懂&quot;电视会对人做什么&quot;——他太懂了。</p>\n"},"conclusion":"<p>查尔斯·弗诺7岁时被选角成&quot;上流特权&quot;的符号，花了接下来的63年证明镜头认错了人——先是转身走人，然后是成为一个比拍他的人更优秀的纪录片导演，最后在70岁回来，只用声音说完自己的版本，脸还遮着：你们不必非说&quot;yes&quot;不可。</p>\n","sources":"<p>主要来源：Wikipedia &quot;Charles Furneaux (TV producer)&quot; / &quot;Up (film series)&quot;（2026）；TV Guide（Natasha Rigler，2026年9月11日）；《泰晤士报》70 Up评论及&quot;did the Seven Up series exploit its stars?&quot;（2026年9月）；《卫报》露西·芒甘70 Up评论（2026年9月15日，经broadcastnow.co.uk综述）；Radio Times（2026年4月16日；2012年5月14日）；《每日电讯报》Allison Pearson（2012年5月16日）；BBC News（2004年2月15日，《触摸虚空》BAFTA）；Emmyonline.org（2002）；BAFTA.org；BFI ScreenOnline；KaboomTV.co.uk；英国公司记录（uk.globaldatabase.com；companydatashop.com）；Bruce Bawer（sethroberts.org，2007）；ScreenDollars/IMDb（低权威，已标注）；BFI（1998《Right to Reply》）；《卫报》John Plunkett（2004年3月17日）。</p>\n<p>冲突与缺口：</p>\n<ol>\n<li>出生年份：1956年（ScreenDollars/IMDb）vs 1957年（Wikipedia正文；信息框&quot;1956或1957&quot;）。未解决。出生地&quot;伦敦哈克尼&quot;只有单一弱来源。</li>\n<li>&quot;牛津读研&quot;（Wikipedia）与他21岁时说避开&quot;牛津剑桥传送带&quot;不矛盾（读研是后来的事），但读研一事无其他来源。</li>\n<li>&quot;为BBC当报纸编辑&quot;（Wikipedia措辞奇怪）vs TV Guide&quot;当过报纸编辑、也当过BBC制片人&quot;——具体哪家报纸从未被说出，来源薄弱。</li>\n<li>缺口：父母姓名职业及任何家庭背景；预备学校校名；7岁时说想当什么；14岁时的任何细节；结婚年份（1990年为单一弱来源）及两个孩子的身份；现居地；健康状况；是谁说服他参与《70 Up》、他亲口说的回归理由（均无记录）；是否与其他参与者保持联系。</li>\n</ol>\n"},"suzy":{"id":"suzy","name":"苏西·拉斯克","en":"Suzy Lusk","nickname":"不情愿的富家女孩","avatar":"avatars/suzy.jpg","summary":"全系列唯一的富家女孩：7岁是练芭蕾、想要\"两个孩子加一个保姆\"的小淑女，21岁变成镜头前不停抽烟、对婚姻嗤之以鼻的愤青；28岁结婚后整个人翻了篇——48年婚姻、三个孩子、四十多岁转行做丧亲辅导员；她恨了这节目63年，63岁那集直接罢演，70岁终章却为了去世的尼克回来了。","class7":"伦敦富裕家庭女孩，系列里唯一的\"富家女\"","education":"伦敦私立走读学校，16岁辍学","career":"全职母亲多年；四十多岁转行做丧亲辅导员（bereavement counsellor）","marriage":"约1978–79年（22岁）嫁事务律师鲁珀特·杜威（Rupert Dewey），48年未离","children":"三个孩子（两子一女）","turning":"28岁结婚彻底扭转人生；父亲去世促使她转行做丧亲辅导员","status70":"身体\"还不错\"，与丈夫同住乡下，70岁终章回归并第一次决定看这部片子","alive":true,"tags":["精英家庭","没上大学","退出过节目","退休"],"intro":"<p>苏西是14个孩子里唯一的富家女孩，也是全系列&quot;最不配合&quot;的参与者之一：14岁就说这节目&quot;又没劲又蠢&quot;，21岁在镜头前一根接一根抽烟、宣称对婚姻&quot;非常非常 cynical &quot;，49岁时宣布《49 Up》就是她的最后一集，63岁那集直接罢演——阿普特德得用别人的手机给她打电话，她一听是他就挂掉。但她的人生后半段是个彻底的反转：22岁结婚，48年没离过，三个孩子，四十多岁父亲去世后转行做了丧亲辅导员。2026年《70 Up》终章，她回来了，理由很简单：唯一保持联系的老朋友尼克病得那么重都拍了，&quot;那我也得咬咬牙上&quot;。</p>\n","background":"<p>苏西的全名是 Suzanne Lusk，1956–57年间生于伦敦（确切出生日期没有任何公开来源）。她是&quot;系列里唯一来自富裕家庭的女孩&quot;（《泰晤士报》，2026），《Radio Times》（2026）称她是&quot;来自乡绅阶层的上层中产女孩&quot;。有一个流传的细节说她父亲在苏格兰有4000英亩的庄园——这个说法出自一份二手传记汇总，可信但没有第一手来源证实。</p>\n<p>父母是做什么的？没有公开记录。能确定的是：<strong>父母在她14岁前后离了婚</strong>（Wikipedia；《每日邮报》/Femail 2021年汇总；《泰晤士报》2026，多方一致）。离婚后她一度跟着父亲住在苏格兰（低质量来源的说法，未经证实），也被送去寄宿学校，变得&quot;叛逆&quot;。</p>\n<p>她7岁时上的是伦敦一所私立走读学校（校名不详），她后来形容自己&quot;恨&quot;这所学校（ITV/《70 Up》宣传物料称她是&quot;恨私立学校的芭蕾女孩&quot;；《泰晤士报》2026）。她<strong>16岁就离开了学校</strong>（多方证实）。</p>\n<p>父亲的去世是她人生的一个暗扣：乐评人Jude Rogers（Substack，2026）写道，正是父亲的去世，促使她在四十多岁转行去做丧亲辅导员。父亲去世的具体年份没有公开记录。</p>\n<p>阶级对苏西的影响，和三个肯辛顿男孩是镜像：他们是&quot;被羡慕的特权&quot;，她是&quot;被审视的特权&quot;。节目组需要她来代表&quot;富家女&quot;这个符号，而她从14岁起就拒绝配合这个符号。2026年她说，感觉阿普特德&quot;有点针对我&quot;（Radio Times，2026）——一个富家女孩，在一部讲阶级不公的片子里，天然就成了&quot;反面教材&quot;。这种被当作靶子的感觉，她记了63年。</p>\n","ages":[{"age":7,"title":"7岁 ——《Seven Up!》（1964）","html":"<p>经典画面：在伦敦的学校里练芭蕾的小姑娘，努力想表现得&quot;lady 一点&quot;（BFI/Sight &amp; Sound 2005年评论后来形容她是&quot;一个好笑的、自恋的小芭蕾舞者&quot;）。</p>\n<p>她7岁的名言是：<strong>想要&quot;两个孩子，再加一个保姆来照顾他们&quot;</strong>（《泰晤士报》，2026）。节目组把她框成&quot;特权小孩&quot;的证据是：她自己在校外就有一个保姆。谈到父母时她很安静——有评论说她&quot;可能在想他们&quot;。</p>\n<p><strong>伏笔：</strong> 7岁想要&quot;两个孩子+保姆&quot;的女孩，长大后成了三个孩子的全职母亲，并且<strong>从来没请过保姆</strong>（《泰晤士报》，2026）——这是她对自己童年最安静的反驳。</p>\n"},{"age":14,"title":"14岁 ——《7 Plus Seven》（1970）","html":"<p>14岁的苏西是青春期阴郁本郁：内向、别扭，称这个项目&quot;pointless and silly&quot;——&quot;又没劲又蠢&quot;（Wikipedia）。《泰晤士报》（2026）回忆，她妈妈得把她从床上拖起来她才肯拍。</p>\n<p>这一集还留下一个著名的穿帮花絮：采访中途，她的狗追出去咬死了一只兔子，阿普特德在旁边说：&quot;我觉得你的狗给你带了点东西回来&quot;（tropedia粉丝wiki）。</p>\n<p>家庭方面：父母在这前后离婚（多方证实）。她和阿普特德的关系从这时起就是对抗性的。</p>\n"},{"age":21,"title":"21岁 ——《21 Up》（1977）：最灰暗的阶段","html":"<p>她16岁离开学校去了巴黎，然后靠父母资助在欧洲旅行（Wikipedia）。镜头前的21岁苏西：神经质地瘫在沙发上，一根接一根抽烟，&quot;整个人垮掉的样子&quot;（低质量来源描述，但与BFI/Sight &amp; Sound 2005年&quot;一个愤懑的、任性的、烟不离手的年轻女人&quot;的评价一致）。</p>\n<p>她的名言：&quot;我16岁离开学校去了巴黎……我对婚姻非常非常 cynical &quot;（pagegoo/Cup of Jo整理的《70 Up》档案片段逐字稿）。Wikipedia也记载，她当时&quot;对婚姻和为人父母形成了强烈的负面看法&quot;。</p>\n<p>她再次说这个项目又没劲又蠢（Wikipedia）。这是她人生的谷底——有钱，有闲，有父母的资助，唯独没有方向。</p>\n"},{"age":28,"title":"28岁 ——《28 Up》（1984）：转折点","html":"<p>到28岁，苏西已经<strong>和鲁珀特·杜威结婚，有了两个儿子</strong>，Wikipedia写道，她&quot;把婚姻看作给自己带来了早年影片里完全看不到的乐观和幸福&quot;。</p>\n<p><strong>婚姻：</strong> 《Radio Times》（2026）报道她22岁嫁给鲁珀特，48年后还在一起——婚礼大约在1978–79年，也就是《21 Up》和《28 Up》之间。鲁珀特·杜威是事务律师：Wikipedia和《每日邮报》说他是&quot;巴斯（Bath）的事务律师&quot;，《泰晤士报》（2026）却说他是&quot;伦敦金融城的事务律师&quot;——这个冲突没有解决，可能是他在金融城工作、全家住在巴斯附近。他从未成为公众人物。</p>\n<p>21岁那个说对婚姻&quot;非常非常 cynical &quot;的女孩，28岁说婚姻拯救了她。这个反转的幅度，在全系列里排得上号。</p>\n"},{"age":35,"title":"35岁 ——《35 Up》（1991）：反转完成","html":"<p>一个自信、爱笑的苏西，和21岁那个烟鬼判若两人，坦然享受采访（低质量来源描述，但nypress的对比是扎实的）：&quot;21岁时抽烟、对家庭没兴趣的苏西&quot; vs &quot;35岁时乡下房子、三个孩子的苏西&quot;。</p>\n<p><strong>孩子：</strong> 到这时她已有<strong>三个孩子——两个儿子、一个女儿</strong>（Wikipedia；《每日邮报》；Radio Times 2026）。孩子的名字从未公开。</p>\n<p>她把幸福归功于婚姻和母亲这个身份；据说她刻意多花时间陪孩子，而不是把他们送去寄宿学校——这是对她自己童年（&quot;被遗忘、很孤独&quot;）的刻意纠正（低质量来源，但与她公开表达的&quot;想要自己小时候没得到的亲密家庭&quot;一致，《泰晤士报》2026）。</p>\n"},{"age":42,"title":"42岁 ——《42 Up》（1998）","html":"<p>公开细节很少：幸福的已婚母亲，三个孩子，住在乡下。这一集的具体内容在可检索的报道里没有找到。和阿普特德的关系：这个阶段总体配合，但永远带着保留。</p>\n"},{"age":49,"title":"49岁 ——《49 Up》（2005）：想退出","html":"<p>BFI/Sight &amp; Sound（2005）写道，她&quot;平静地厌倦了阿普特德 renewed 的打扰，厌倦了重访那些她早就走出来的不愉快回忆&quot;，并宣布《49 Up》很可能是她参与的最后一集。</p>\n<p>她在这一集说，<strong>直到《49 Up》，她才第一次&quot;觉得做自己挺舒服&quot;</strong>（《泰晤士报》，2026）——也就是说，从28岁开始的转变，花了二十多年才真正 consolid 成自我认同。</p>\n<p><strong>事业：</strong> 这个时期她正在转行/已经成为<strong>丧亲辅导员</strong>（Jude Rogers，2026：父亲的去世让她在四十多岁走上这条路）。</p>\n"},{"age":56,"title":"56岁 ——《56 Up》（2012）：\"出于义务\"回来","html":"<p>Wikipedia记载：49岁时她以为自己不会再参加了，但《56 Up》里她承认，&quot;不管自己怎么想，对这个项目有义务&quot;。</p>\n<p>名言：&quot;就像读一本烂书——再烂我也要读完&quot;（NPR/KTTZ，2013）。First Run Features的press kit引她的话说她&quot;恨&quot;这些片子，每七年露一次面就像&quot;把一本烂书看完&quot;。</p>\n<p>这一集有个温暖的细节：节目组把她和尼克·希钦安排在一起做联合采访，两人成了<strong>邮件笔友</strong>——相似的乡村成长背景（Fandom Up Series wiki；hackwriters评论）。尼克后来成了她唯一保持联系的参与者（Radio Times，2026）——这个细节直接决定了她70岁的回归。</p>\n<p>性别议题上，她对阿普特德越来越不客气。1986年阿普特德承认自己&quot;完全错过了女权革命&quot;；《泰晤士报》（2026）报道，苏西曾在镜头外质问他为什么女孩这么少，得到的回答是：&quot;嗯，1964年的时候女人没那么重要&quot;——&quot;回头看，这话吓人得很。&quot;</p>\n"},{"age":63,"title":"63岁 ——《63 Up》（2019）：罢演","html":"<p><strong>她拒绝参加</strong>——这是她第一次整集缺席（Radio Times 2019确认苏西和查尔斯都没出现，只用了她的档案影像）。</p>\n<p>阿普特德讲过一个著名的段子（2019年访谈，经nightviz.ca 2026年转载）：&quot;苏西我是真弄丢了，她是个宝贝，但大部分时间也是个让人头疼的家伙……我只好用别人的手机给她打电话，她接起来以为是别人，我一说是阿普特德，她就把电话挂了！&quot;</p>\n<p>原因：《Radio Times》（2026）说她&quot;63岁那集因为个人原因没来&quot;；《泰晤士报》（2026）则解读为长期积累的结果——她觉得阿普特德因为她的富裕背景&quot;针对&quot;她、节目扭曲了她。BritBrief/GMB的报道说她罢演是因为觉得节目组在富裕背景这件事上扭曲了她。&quot;个人原因&quot;是她自己的说法，没有公开过生病之类的具体缘由。</p>\n"},{"age":70,"title":"70岁 ——《70 Up》（2026）：为了尼克回来","html":"<p>《70 Up》2026年9月15日、22日在ITV1和ITVX播出两集，由阿西夫·卡帕迪亚执导。苏西回来了。</p>\n<p><strong>为什么回来：</strong> 因为尼克。&quot;我保持联系的只有他一个&quot;，她说，&quot;他病得那么重都能拍——就在去世前几天拍的——我想，得了，我也得咬咬牙上&quot;（Radio Times，2026；《泰晤士报》：&quot;他能在去世前几天拍这个，我也该振作起来&quot;）。尼克·希钦2023年去世，节目收录了他生前录好的采访。</p>\n<p><strong>婚姻：</strong> 和鲁珀特依然在一起——<strong>48年</strong>（Radio Times，2026）。三个孩子（两子一女）。孙辈：没有公开信息。</p>\n<p><strong>事业：</strong> 丧亲辅导员（Radio Times，2026；《泰晤士报》；Wikipedia）。70岁是否还在执业：没有说明。</p>\n<p><strong>健康：</strong> 她自述身体&quot;reasonably good health&quot;——&quot;还不错&quot;（Wikipedia，引《70 Up》报道），&quot;70岁了，我还在这儿，已经算幸运&quot;（Radio Times，2026）。在《早安英国》（2026年9月）上她说：&quot;到了70岁，我们有朋友比我年轻得多就因癌症和其他病走了。现在这个年纪就是'狙击手巷'（sniper alley），子弹横飞——70岁身体还行、日子还能过，那就是天大的幸运。&quot; <strong>必须澄清：没有任何可信来源说苏西本人得过癌症或大病</strong>——《70 Up》报道里的癌症指的是朋友们的去世（尤其是尼克的喉癌）。所谓&quot;她晚年患病&quot;的说法未经证实，很可能是把朋友的病安到了她身上。</p>\n<p><strong>住址与日常：</strong> 除了乡下的房子和巴斯的关联，没有更具体的公开信息；《70 Up》的采访 presumably 在家里拍的（无确切报道）。</p>\n<p><strong>对人生的看法：</strong> &quot;这一路我学到了很多，到了这个年纪，我对自己挺舒服的，很多事都想通了&quot;（Radio Times，2026）。对死亡的看法是通过朋友的离世来谈的——&quot;狙击手巷&quot;那段话就是她的死亡观：70岁，幸运，知足。</p>\n<p><strong>对阿普特德：</strong> 回来的一半原因是&quot;对迈克尔的 loyalty &quot;；另一半是意难平——她觉得自己是&quot;唯一的单身女人（指女性参与者里处境特殊的一个），有点被针对&quot;（Radio Times，2026）。</p>\n<p><strong>对节目：</strong> 她发誓要<strong>这辈子第一次看这部片子</strong>——为了尼克：&quot;这辈子第一次，我要看它。我想我得看。这是最后一章了&quot;（《早安英国》，经BritBrief/clactonandfrintongazette，2026年9月）。她说这个节目让她觉得&quot;difficult and intrusive&quot;——&quot;难受， invasive &quot;，并放话：&quot;不会有77 Up了&quot;（GMB/BritBrief）。</p>\n<p><strong>对7岁自己的看法：</strong> 《70 Up》的报道里没有她直接谈论7岁自己的话（未找到）。《泰晤士报》（2026）记录了她的一句：现在的阶级制度&quot;比以前模糊多了，谢天谢地&quot;。</p>\n"}],"compare":{"title":"7岁的她，和70岁的她","html":"<h3>没变的地方</h3>\n<ul>\n<li><strong>对节目的不买账，63年没变。</strong> 14岁说&quot;又没劲又蠢&quot;，70岁说这辈子没看过、觉得&quot;difficult and intrusive&quot;。被当成&quot;富家女&quot;符号的不满，从1964年记到了2026年。</li>\n<li><strong>镜头前的戒备。</strong> 49岁时她&quot;厌倦了 renewed 的打扰&quot;；70岁时她说拍这个得&quot; compartmentalise &quot;（把情绪隔开），因为拍摄&quot;会搅起很多难受的回忆&quot;（Radio Times，2026）。</li>\n</ul>\n<h3>完全改变的地方</h3>\n<ul>\n<li><strong>婚姻观。</strong> 21岁对婚姻&quot;非常非常 cynical &quot;（逐字稿，pagegoo/Cup of Jo），28岁说婚姻带来了幸福，70岁时48年婚姻还在。</li>\n<li><strong>&quot;保姆&quot;的预言。</strong> 7岁想要&quot;两个孩子+保姆&quot;（《泰晤士报》，2026）；成年后她成了三个孩子的全职母亲，<strong>从来没请过保姆</strong>（《泰晤士报》，2026）。她用自己的人生把7岁的剧本改了。</li>\n<li><strong>自我接纳。</strong> 21岁垮掉、49岁才&quot;第一次觉得做自己挺舒服&quot;、70岁&quot;对自己挺舒服的，很多事都想通了&quot;（Radio Times，2026）。这条线走了将近五十年。</li>\n</ul>\n<h3>最出人意料的变化</h3>\n<p>有两个。第一是<strong>职业</strong>：乡绅家庭出身、一度被评论家刻薄地评价为&quot;好像没在世界上留下什么痕迹&quot;的女孩（hackwriters，2012），四十多岁把丧父之痛转行成了一份陪伴他人走过丧亲之痛的工作——丧亲辅导员。从特权的象征，到 grief 的见证人。</p>\n<p>第二是<strong>回归本身</strong>：49岁宣布那是最后一集，63岁直接罢演（阿普特德用别人手机打电话都被挂掉），70岁却回来了——不是为了阿普特德的 vision，一半为了对迈克尔的 loyalty ，一半为了尼克。</p>\n"},"conclusion":"<p>苏西·拉斯克花了63年反抗镜头在7岁时给她贴的标签，但这个系列唯一说准她的一件事——一个想要家庭的孩子真的会去建造一个家庭——成了她成年生活的全部实质：48年婚姻、三个孩子，和一份坐在别人的 grief 旁边的工作；她恨了这节目一辈子，最后却为了一个朋友回来，并决定这辈子第一次把它看完。</p>\n","sources":"<p>主要来源：《泰晤士报》&quot;The Seven Up! kids are 70. What have they learnt about life?&quot;（2026，苏西人物特写）；Radio Times &quot;Up, up and away&quot;（2026，苏西访谈）；Wikipedia &quot;Up (film series)&quot;（2026）；《早安英国》（ITV，经BritBrief/clactonandfrintongazette，2026年9月）；nightviz.ca转载阿普特德2019年访谈（2026）；Radio Times 63 Up播出报道（2019）；Fandom Up Series wiki；BFI/Sight &amp; Sound《49 Up》DVD评论（2005）；NPR/KTTZ（2013，&quot;烂书&quot;引言）；《每日邮报》/Femail经americandailydigest镜像（2021）；Jude Rogers, Substack（2026）；pagegoo/Cup of Jo（2026，档案引言）；tropedia.fandom.com（狗咬兔子花絮）；novelsummary.com学生作文（低质量，仅在有旁证处使用，已标注）。</p>\n<p>冲突与缺口：</p>\n<ol>\n<li>鲁珀特·杜威的工作：&quot;巴斯的事务律师&quot;（Wikipedia；《每日邮报》）vs &quot;金融城的事务律师&quot;（《泰晤士报》，2026）。未解决。</li>\n<li>缺口：确切出生日期；两所学校的校名；父母姓名职业；父亲去世年份；孩子姓名年龄；有无孙辈；确切住址；丧亲辅导工作的雇主与起止年份；《42 Up》的具体内容；她本人是否患过大病——<strong>无任何可信来源</strong>，&quot;狙击手巷&quot;指的是朋友，尼克的喉癌不要安到她身上。</li>\n</ol>\n"},"jackie":{"id":"jackie","name":"杰基·巴塞特","en":"Jackie Bassett","nickname":"向导演开火的东区妈妈","avatar":"avatars/jackie.jpg","summary":"一个7岁时靠话痨被选中的东区女孩，成年后离婚、丧母、患类风湿性关节炎、伴侣在癌症治疗期间车祸离世，却几十年敢当面质问导演的性别偏见；70岁搬到诺福克海岸重新开始，自称过着\"第二次童年\"，是\"很久以来最快乐\"的时候。","class7":"伦敦东区 Bethnal Green 的工人阶级家庭","education":"Susan Lawrence 小学，之后上综合学校；没上大学，一生遗憾没继续读书","career":"保险文员→帮父母经营酒吧→秘书；1998年起因类风湿性关节炎领残障补助","marriage":"19岁第一次结婚，后离婚；与伴侣 Ian 生两子，Ian 于2012年去世；现伴侣 Eddie（退休游泳教练）","children":"三个儿子（Charlie 与 Ian 的两个儿子），六个孙辈","turning":"30岁丧母、离婚；40岁确诊类风湿性关节炎；2012年伴侣 Ian 在癌症治疗期间车祸去世","status70":"搬到诺福克海岸的退休公寓，\"第二次童年\"；自称很久以来最快乐","alive":true,"tags":["工薪阶层","没上大学","离婚","有孙辈","退休"],"intro":"<p>杰基是 14 个孩子里话最多的一个——她自己说，剧组选中她纯粹是因为她&quot;嘴不停&quot;。7 岁时她是东区 Bethnal Green 的工人阶级小女孩，21 岁时她已经敢在镜头前跟导演 Michael Apted 拍桌子，49 岁时她把憋了 28 年的话当面说完。这一生她离婚、丧母、得了类风湿性关节炎、伴侣在癌症治疗期间被车撞死，但 70 岁的她搬到诺福克海岸，说自己正过着&quot;第二次童年&quot;，是&quot;很久以来最快乐&quot;的时候。她是全系列唯一一个把个人委屈变成替所有女性参与者说话的人。</p>\n","background":"<p>杰基 1956 年出生在伦敦东区，长在 Bethnal Green 那一片。她的家庭是典型的工人阶级：后来她帮父母经营过一家酒吧，父母去世前就是普通人家。三个东区女孩——杰基、林恩、苏——都在同一所 Susan Lawrence 小学读书，当时一个叫 Michael Apted 的年轻调研员参与了选孩子的工作（BBC News，2026）。</p>\n<p>小学之后杰基上的是综合学校（comprehensive），而林恩考上了文法学校。杰基后来回忆：&quot;我们这代女孩，没人催我们上大学&quot;，她不记得父母跟她谈过教育这回事（The Times，2026）。这个起点本身就是节目想拍的东西：最初的《Seven Up!》想看的，就是&quot;到 2000 年当工会代表和当公司高管的孩子，现在都七岁了&quot;——杰基她们就是工人阶级那一端。</p>\n<p>但杰基对这个框架有自己的解读。她说：&quot;别人有金钱的优势，但我们有自由——没人给我们定好路&quot;（The Times，2026）。这句话几乎可以当她一生的注脚：没人给她定路，所以她的人生格外跌宕，也格外由她自己说了算。</p>\n<p>家庭细节很多已不可考：母亲在她 30 岁左右（约 1986 年）去世，此后她的人生&quot;一下子乱了套&quot;，搬去了苏格兰（The Times，2026）；官方资料还提到她的继母、妹妹都在 2012 年前后离世（First Run Features，2012）。她至少有个妹妹——《70 Up》的报道里形容她 7 岁时&quot;牵着小妹妹蹦蹦跳跳走在路上&quot;（BBC News，2026）。</p>\n","ages":[{"age":7,"title":"7岁 ——《Seven Up!》（1964）","html":"<p>7 岁的杰基是三个东区女孩里最能说的。多年后她跟 BBC 开玩笑：&quot;他们选中我，就因为我嘴不停。在我们家，你不说话就没人听见你&quot;（BBC News，2026；ITV 相关报道，2026）。</p>\n<p>她留下了两句后来被引用了六十年的童言。被问到婚姻，她说想嫁一个&quot;没什么钱、但有点钱&quot;的男孩（BBC News，2026）。被问到对黑人的看法——用的是 1964 年的说法——她说：&quot;他们跟我们其实一样，只是皮肤是棕色的，我们是粉色的&quot;（The Times，2026）。她还表现出对穷人的同情，说穷人需要帮助。</p>\n<p>注意一个从第一天就存在的细节：节目问男孩们世界大事，问女孩们的主要是婚姻、男孩和家务。杰基几十年后才把这层窗户纸捅破，但种子 1964 年就埋下了。</p>\n<p>伏笔之一：她 7 岁时说如果能对小时候的自己说话，只会说一个词——&quot;嘘！&quot;（The Times，2026）。话痨了一辈子，70 岁回头看，唯一的遗憾居然是话太多。</p>\n"},{"age":14,"title":"14岁 ——《7 Plus Seven》（1970）","html":"<p>这一集的杰基在公开资料里几乎是空白。Apted 自己后来承认，拍十几岁的孩子最难：&quot;他们什么都不肯说&quot;（BBC News，2026）。能确定的是，节目组在这个年纪已经开始问女孩们关于男孩和婚姻的问题。</p>\n<p>BBC 在 2026 年的回顾里提到，杰基年轻时曾说过不想生孩子——但到了 42 岁，她已经是三个男孩的慈母（BBC News，2026）。回顾没有点名这句话出自哪一集，所以只能当作一条人生弧线来理解，不能钉死在 14 岁这一年。</p>\n"},{"age":21,"title":"21岁 ——《21 Up》（1977）","html":"<p>21 岁的杰基已经是个已婚女人：她 19 岁（约 1975–76 年）就结了婚，婚后在 Essex 买了房子（The Times，2026）。</p>\n<p>这一集的采访成了她一辈子的心结。Apted 问这个刚结婚的 21 岁姑娘：结婚前&quot;见过的男人够多吗&quot;。杰基后来回忆，那场采访她大部分时间都在看地板（BBC News，2026）。她在 2026 年跟《泰晤士报》说：&quot;我恨透了拍《21 Up》——世界在变，可 Michael 好像觉得我们还是会当家里的小媳妇。我骂了他一句，转身走了&quot;（The Times，2026）。她还记得自己当时怼过他：&quot;你知道我们有投票权了吧，Michael？&quot;（The Times，2026）。</p>\n<p>让她愤怒的不只是语气，更是双重标准：问男孩政治和世界，问女孩婚姻和男人。Film Comment 的回顾（2019）注意到，21 岁的杰基&quot;坚决地说不想过那种顺从的小媳妇式婚姻，而且她说到做到&quot;——这句话后来成了她一生的写照。</p>\n"},{"age":28,"title":"28岁 ——《28 Up》（1984）","html":"<p>28 岁的杰基在公开资料里只有轮廓：第一次婚姻还没结束（离婚是在 35 岁之前），工作上换了好几份。她最早在伦敦金融城做保险文员，后来辞职去帮父母经营酒吧（The Times，2026）。她后来指责 Apted 在这个年代&quot;对节目里的女人和男人完全是两套标准&quot;（NPR，2019）。</p>\n<p>坦白说，1984 年那次拍摄的具体情形，现有资料里查不到——这里记一笔空白，不编。</p>\n"},{"age":35,"title":"35岁 ——《35 Up》（1991）","html":"<p>35 岁这一集，杰基的人生第一次大转弯已经发生：第一次婚姻离婚了。她在片子里透露，大儿子 Charlie 是离婚后一段短暂感情的孩子（First Run Features，2012）。母亲在她 30 岁那年去世（约 1986 年，The Times，2026），之后她搬去了苏格兰——格拉斯哥附近的 Motherwell（The Times，2026；Daily Mail，2021）。苏在 2026 年的回忆里说&quot;杰基离婚很早，搬去了格拉斯哥&quot;（The Times，2026），和 Motherwell 的说法基本兼容（Motherwell 就在格拉斯哥边上）。</p>\n"},{"age":42,"title":"42岁 ——《42 Up》（1998）","html":"<p>42 岁的杰基是离了婚、独自带三个儿子的单亲妈妈，住在格拉斯哥郊外的市议会公寓里。小的两个儿子是她和伴侣 Ian 的孩子，两人已经分开（The Times，2026；First Run Features，2012）。钱永远不够花，类风湿性关节炎（约 40 岁确诊）让她越来越难继续工作（Boston Phoenix，1999）。</p>\n<p>但看过这一集的人都记得她的韧性。《波士顿凤凰报》写她&quot;为病发愁，但坚持说对生活不发愁——她觉得自己幸福、感恩&quot;，还特别提到她和前婆婆关系极好，老人一直在帮她带孩子（Boston Phoenix，1999）。她说自己住的社区让她想起小时候的东区（Television Heaven）。</p>\n<p>为什么这个阶段重要：42 岁的杰基是全系列&quot;工人阶级女性中年&quot;最完整的样本——离婚、带孩子、患病、缺钱，四件事叠在一起。但她没有垮，这为她后来几十年的姿态打了底：她不是受害者，她是幸存者。</p>\n"},{"age":49,"title":"49岁 ——《49 Up》（2005）","html":"<p>这一集有名场面：杰基终于把憋了 28 年的话（从 1977 年那次采访算起）当面说给了 Apted。她说：&quot;我当时真的很生气……你不会问节目里其他人这种问题。这节目你想怎么剪就怎么剪，我管不着&quot;（BBC News，2026；The Times，2026）。她跟《卫报》说：&quot;他心里对事情该怎么发展有固定想法，很长一段时间都转不过弯……我就决定了，今天就是我把心里话全倒出来的日子。他有点被吓到&quot;（Daily Mail Femail，2021，转引《卫报》）。</p>\n<p>她还反驳了节目对她病情的呈现：&quot;类风湿关节炎管不着我。Michael 觉得那就是我人生的全部现实，但我不想被人这么看&quot;（Daily Mail Femail，2021，转引《卫报》）。但她对节目的态度是复杂的——她在片子里说想回学校读书，&quot;这样我能跟世界上任何人聊天，什么都聊得上来。我觉得我比你以为的要聪明。我很享受做我自己。我觉得你没想到我会长成这样&quot;（Television Heaven，转引《49 Up》）。</p>\n<p>49 岁的杰基开始形成那个跟她一辈子的遗憾：没多读书。这个遗憾此后每七年出现一次。</p>\n"},{"age":56,"title":"56岁 ——《56 Up》（2012）","html":"<p>56 岁是杰基人生里最惨的一集。到这一集，她因为类风湿性关节炎领残障补助已经约 14 年（从 1998 年左右算起），而联合政府正在重新审核、要砍掉她的补助。她在镜头前说：&quot;要是卡梅伦能给我找份工作，我就去干&quot;（The American Spectator，2012）。</p>\n<p>更大的悲剧是伴侣 Ian 的死。拍摄期间杰基告诉观众，Ian 和他母亲都得了晚期癌症。然后在两次拍摄之间，正在接受癌症治疗的 Ian 被车撞了，送医后没再醒过来（First Run Features，2012；Entertainment Daily，2026）。他们的第一个孙女就在几天前出生，Ian 没见过孩子一面，家人把宝宝的照片放进了他的棺材（Entertainment Daily，2026）。大儿子 Charlie 需要长期心理辅导，从此不再看这个节目，怕想起那段日子（The Times，2026）。同一时期，她的继母、姐夫、妹妹也相继去世（First Run Features，2012）。</p>\n<p>这一集之后，&quot;杰基很惨&quot;成了很多观众对她的印象。但她自己从来不接受这个标签——这也是她 70 岁时状态的重要背景：她是在见过最坏的日子之后，才说出&quot;第二次童年&quot;这种话的。</p>\n"},{"age":63,"title":"63岁 ——《63 Up》（2019）","html":"<p>63 岁的杰基把对 Apted 的批评推到了新高度。她在镜头前直接问他：为什么年轻时问女人婚姻和男人，却不问&quot;国家怎么样、世界怎么样&quot;——&quot;我小时候就一直在想：他为什么问我婚姻和男人的问题？为什么不问我对这个国家怎么看？&quot;（NPR，2019）。Film Comment 称她是&quot;这群人里最叛逆的一个&quot;，也承认 Apted 把这段尖锐批评剪进成片，算他有气度（Film Comment，2019）。</p>\n<p>生活上，她是五个孩子的奶奶，住在 Motherwell（Daily Mail，2021）。她在 2019 年跟《星期日邮报》说，类风湿性关节炎&quot;有时候真的很折磨人，全看我怎么应付……有几天早上醒来觉得很好，有几天只想翻个身连床都不起……越来越难，但只能应付下去&quot;（Daily Mail，2021，转引 Sunday Post）。《TheWrap》的影评（2019）注意到，她担心自己急需的残障补助&quot;朝不保夕&quot;。</p>\n<p>这是 Apted 执导的最后一集。杰基回忆，拍这一集时&quot;Michael 看起来非常虚弱&quot;（The Times，2026）。</p>\n"},{"age":70,"title":"70岁 ——《70 Up》（2026）","html":"<p>杰基活着，并且参加了最后一集。Apted 在 2021 年 1 月去世（79 岁）后，接棒的是导演 Asif Kapadia（《艾米》《塞纳》的导演）。两集 90 分钟的终章在 2026 年 9 月 15 日和 22 日在 ITV 播出（Wikipedia）。</p>\n<p>她一开始对换导演很忐忑，但说 Kapadia 让她立刻放松下来：他的采访更像聊天，而 Apted 会在她答完后留下长长的、尴尬的沉默（BBC，2026，经 venus.pp.ua 转引）。</p>\n<p>70 岁她人生最大的变化是搬家：她离开了住了三十年的苏格兰，搬到诺福克海岸。&quot;我搬到诺福克来了。最大的原因是我需要安静，为我自己。阳光有帮助，让我感觉好多了&quot;（TV Guide，2026；Entertainment Daily，2026）。她住在一栋退休公寓里（TV Guide，2026；The Times，2026）。&quot;搬来之后，日子好过多了，好过太多了……我觉得我现在是在过第二次童年&quot;（TV Guide，2026）。&quot;这儿很安静。我喜欢&quot;（The Times，2026）。</p>\n<p>感情上，她和 Eddie 在一起——一个退休游泳教练，小时候在东伦敦就认识，最近重逢（The Times，2026）。这里有个小冲突要说明：ITV 的通稿说她和 Eddie 住在同一栋退休公寓，但杰基自己跟《泰晤士报》说的是&quot;Eddie 住在伦敦，我们各过各的，但会见面、一起看球、一起度假&quot;——以她本人的说法为准（The Times，2026）。</p>\n<p>三个儿子都三十多岁了，六个孙辈从两岁到十八岁（The Times，2026；Entertainment Daily，2026）。她说自己&quot;比很久以来都要快乐&quot;（The Times，2026），健康状况&quot;还不错&quot;——有资料提到，看到同龄朋友一个个走，她觉得自己能有这个身体算幸运（Wikipedia，转引《70 Up》报道）。</p>\n<p>关于老朋友林恩的死，她说得特别坦率：&quot;我爱林恩——她是个好人、善良的人——但 Michael 指望我们三年后还在哭，我们哭不出来。我 30 岁没了妈，56 岁没了孩子的爸。你没法拿这个跟一个七年才见一次的朋友比&quot;（The Times，2026）。这话听着冷，但这是杰基式的诚实。</p>\n<p>她这辈子最大的遗憾还是读书：&quot;日子本可以更好，但也本可以糟得多……我唯一后悔的，就是没多读点书&quot;（ITV 专访，2026，经 ranzware 转引）。她会跟 14 岁的外孙女说：&quot;你想当什么都行。告诉我是什么，我们给你找条路&quot;（The Times，2026）——这句话，是她替 14 岁的自己说的。</p>\n<p>70 岁的杰基政治上更敢说了：《泰晤士报》写她担心儿子的工作 stability，看不惯骗补助的人、看不惯房价、看不惯老人挨饿受冻；她甚至觉得该取消国家养老金、让年轻人自己买商业保险；觉得&quot;盖伊·福克斯（1605 年想炸议会那位）有时候想得挺对&quot;（The Times，2026）。7 岁时那个说&quot;黑人和我们一样&quot;的小女孩，70 岁对移民问题倒有了保留——人的变化就是这么不讲道理，照实记下来就是。</p>\n<p>关于 Apted 的死，她说来得突然、但不意外。拍完《63 Up》后有顿饭，Apted 跟她说：&quot;我原以为我还能再拍一部，但我觉得我拍不动了&quot;（The Times，2026）。她也记得节目带来的快乐：去伦敦参加首映、见到 Mick Jagger（The Times，2026）。</p>\n<p>该不该停在 70 岁？她说：&quot;说实话，我不确定我们还有没有力气再拍……我觉得现在停是对的，真的。70 这个数字很对称。我们 7 岁开始，70 岁结束——就这样&quot;（BBC，2026）。她还说，这个系列一开始是关于阶级的，&quot;但后来他们突然意识到，不对，这是关于人生&quot;（BBC，2026）。</p>\n<p>最后是她对自己这一生的总结，冷静得不像鸡汤：&quot;我觉得我和苏混得还不错。讽刺的是，我们比那些男孩有更多选择，因为他们的人生早就被安排好了。我宁愿处在我的位置。每次聚会我们什么都聊。我们可能来自不同世界，但他们是我的第二个家&quot;（The Times，2026）。以及她的人生哲学：最好的丈夫，是&quot;可以放进柜子里、需要时再拿出来的那种&quot;（The Times，2026）。</p>\n"}],"compare":{"title":"7岁的她，和70岁的她","html":"<h3>没变的地方</h3>\n<ul>\n<li><strong>嘴和胆子</strong>。7 岁&quot;嘴不停&quot;，70 岁还在说——21 岁骂导演、49 岁当面摊牌、63 岁质问性别偏见，一辈子没学会闭嘴。影评人说她&quot;小时候嘴贫，长大一张嘴就没停过&quot;（Erik Lundegaard，2020），算是盖章。</li>\n<li><strong>替穷人说话的本能</strong>。7 岁说穷人需要帮助；中年为残障补助抗争，在镜头前跟政府叫板。</li>\n<li><strong>婚姻观</strong>。7 岁说要嫁&quot;有点钱但不太有钱&quot;的男孩；21 岁拒绝&quot;顺从的小媳妇式婚姻&quot;；晚年总结&quot;丈夫放进柜子&quot;哲学。一辈子没把婚姻当人生的全部。</li>\n</ul>\n<h3>完全改变的地方</h3>\n<ul>\n<li><strong>对孩子的态度</strong>。年轻时说不想生孩子，42 岁成了三个男孩的妈，70 岁是六个孙辈的奶奶，家庭成了她生活的中心。</li>\n<li><strong>地理</strong>。东区→Essex→苏格兰三十年→诺福克海岸。14 个人里搬家跨度最大的一批。</li>\n<li><strong>政治表达</strong>。年轻时是本能的左派同情心，70 岁变得务实甚至带点保守——担心骗补助、质疑移民、对政客失望。</li>\n</ul>\n<h3>最出人意料的变化</h3>\n<p>7 岁时那个话痨小女孩，谁也没想到她会成为全系列唯一一个敢连续几十年当面怼导演的人——而且怼的不是私事，是&quot;为什么你只问女人婚姻问题&quot;这种替所有女性参与者说话的事。从&quot;嘴不停&quot;到&quot;替人说话&quot;，这条线走了六十年。</p>\n"},"conclusion":"<p>一个 7 岁时因为话多被选中的东区女孩，长大后经历了离婚、丧母、类风湿性关节炎、伴侣离奇去世，没上过大学、领了十几年残障补助；但她从 21 岁起就敢跟导演拍桌子，替节目里的女性要一个平等提问的权利。70 岁时她搬到海边，说自己正过&quot;第二次童年&quot;，比很久以来都快乐——她没赢过传统意义上的成功，但她把&quot;敢说话&quot;活成了一种人生。</p>\n","sources":"<p><strong>主要来源</strong>：The Times（2026 年 9 月长篇专访，最重要的 70 岁一手资料）；BBC News（2026 年 9 月 George Wright 回顾）；ITV 通稿经 TV Guide UK / Entertainment Daily（2026）；Daily Mail Femail（2021 年 1 月 Apted 去世后盘点）；Sunday Post（2019 年 6 月类风湿采访）；NPR（2019 年《63 Up》评论）；Film Comment（2019）；First Run Features《56 Up》官方新闻资料包（2012）；Boston Phoenix（1999 年《42 Up》评论）；Wikipedia 仅作结构核对。</p>\n<p><strong>冲突与空白</strong>（如实记录）：1）搬去苏格兰的时间，各家说法在&quot;九十年代中期&quot;&quot;三十多岁&quot;&quot;近三十年前&quot;之间浮动，取九十年代中期；2）格拉斯哥 vs Motherwell——Motherwell 在格拉斯哥附近，兼容；3）类风湿确诊约 1996 年 vs 领补助从约 1998 年算起，可能有延迟或回忆误差；4）伴侣 Eddie 是否同住——ITV 通稿与杰基自述矛盾，以杰基自述为准；5）28 岁（1984）那次拍摄的具体情形查不到，不编；6）小报把《63 Up》写成&quot;64 Up&quot;，系笔误；7）孙辈从 2021 年的五个变成 2026 年的六个，时间自然增长；8）出生只精确到 1956 年，月日不详；父母和首任丈夫的姓名、她上的综合学校校名，均无公开资料。</p>\n"},"lynn":{"id":"lynn","name":"林恩·约翰逊","en":"Lynn Johnson","nickname":"最早离场的老好人","avatar":"avatars/lynn.jpg","summary":"14 人里最稳的一个：7 岁说长大要去 Woolworths 当售货员，21 岁开着流动图书馆车给孩子们送书，在同一个岗位干了三十年，19 岁结婚一次到老；却是 14 人里第一个去世的，2013 年 5 月病逝，终年 57 岁，《70 Up》里只剩下一把\"空椅子\"。","class7":"伦敦东区工人阶级家庭","education":"Susan Lawrence 小学；考上文法学校（grammar school），三个女孩里学历起点最高","career":"儿童流动图书馆管理员（开图书馆车下乡送书）约三十年；预算削减后被裁员","marriage":"19 岁嫁给 Russ，一生一次婚姻，视他为灵魂伴侣","children":"两个女儿；三个孙辈","turning":"流动图书馆被砍、56 岁正式失业——干了一辈子的工作被紧缩政策终结；2013 年 5 月病逝","status70":"已于 2013 年 5 月去世（57 岁）；《70 Up》以\"空椅子\"纪念她","alive":false,"tags":["工薪阶层","没上大学","已去世","有孙辈"],"intro":"<p>林恩是 14 个人里看起来最不可能先走的一个：婚姻一次到老，工作一干三十年，朋友一次没断，连导演都说她是&quot;我们最喜欢的人之一，因为她直率又诚实&quot;。7 岁时她说长大要去 Woolworths（英国当年的连锁百货）当售货员，说得&quot;特别笃定&quot;；21 岁她真的开着一辆&quot;流动学校图书馆&quot;的车，给东区的孩子们送书，一送就是三十年。她是东区三个女孩里唯一考上文法学校的，却一辈子没离开过工人社区。2013 年 5 月，她在《56 Up》播出一年后病逝，57 岁——成了 14 个人里第一个离开的人。</p>\n","background":"<p>林恩 1956 年出生在伦敦东区，工人阶级家庭。关于她父母，公开资料里几乎什么都没有——名字、职业都查不到，只留下一个碎片：14 岁那年被问到罢工，她淡淡地说了一句&quot;我妈参加过罢工&quot;（Katherine Wikoff 博客，2013，逐集分析）。就这一句，能看出她母亲是六十年代末东区有组织的工人中的一员，行业和单位不详。</p>\n<p>她和杰基、苏在同一所 Susan Lawrence 小学读书，三个女孩一起被选进节目，代表工人阶级那一端。但林恩有个不一样的起点：小学之后，她考上了文法学校——当时英国公立教育里选拔性的那一轨，而杰基和苏上的是综合学校。有分析者注意到，14 岁时她坐在两个朋友中间显得有点拘谨，杰基和苏夸综合学校的木工金工课时，她替文法学校辩解得有点心虚（Wikoff，2013）。这个小细节说明，阶级差异的种子在三个好朋友之间早就发芽了。</p>\n<p>按节目的&quot;七岁看老&quot;逻辑，林恩是个绝佳的测试品：一个工人阶级东区女孩，人生是不是早就写好了？她后来用一辈子回答了这个问题——答案比节目组预想的复杂。</p>\n","ages":[{"age":7,"title":"7岁 ——《Seven Up!》（1964）","html":"<p>1964 年的黑白画面里，林恩是个机灵、直率的东区小学生，通常和杰基、苏一起出镜，三个人的段落剪在一起。</p>\n<p>她最出名的一句童言，被官方资料引用了几十年。问长大想干什么，她说：<strong>&quot;我要去 Woolworths 工作&quot;</strong>——官方《56 Up》新闻资料包（2012）原文引用了这句；有学术研究说她说这话时&quot;特别笃定&quot;（academia.edu）。一个研究者提醒过：曾有人说林恩 7 岁时讲过一句关于&quot;有钱人&quot;的名言，但遍查资料找不到出处，能落实到林恩头上的就是 Woolworths 这一句——&quot;想买大房子&quot;之类的话是杰基说的，不能张冠李戴。</p>\n<p>三个女孩的联合采访里还有一段：问&quot;长大想结婚吗&quot;，答&quot;想找个没什么钱、但有点钱的&quot;；问&quot;有男朋友吗&quot;，答&quot;<strong>这事保密，懂吧？</strong>&quot;（That's personal, innit?）（《49 Up》文字实录，转录 1964 年片段）。这段话落在三个女孩的段落里，不能确定是哪一个说的，照实说明。</p>\n"},{"age":14,"title":"14岁 ——《7 Plus Seven》（1970）","html":"<p>14 岁的林恩已经在文法学校了。分析者形容她&quot;有点 defensive（戒备）&quot;——腿交叉着、手抱膝盖、眼神往下看，&quot;像觉得自己在被评判&quot;，坐在两个朋友中间，朋友们好像刻意不让她难堪（Wikoff，2013）。画面里她在学校的家政课上看烹饪演示，杰基和苏大谈综合学校的金工木工课多好，她小声回了一句：文法学校的女生也没几个想学木工。</p>\n<p>时代背景是英国工业动荡，Apted 问十几岁的孩子们怎么看罢工。林恩就是在这儿说出&quot;我妈参加过罢工&quot;的。Apted 还&quot;警告&quot;三个女孩：小心结婚生子之后&quot;被困在家里&quot;——把她们的人生框成&quot;事业还是家庭&quot;的二选一，这种问题他从来不问男孩（Wikoff，2013）。</p>\n"},{"age":21,"title":"21岁 ——《21 Up》（1977）","html":"<p>21 岁的林恩，人生的形状已经定型：</p>\n<ul>\n<li><strong>结婚</strong>：19 岁（约 1975 年）嫁给了 <strong>Russ</strong>——这个她后来称为灵魂伴侣的男人，陪她走完一生（Wikipedia；Daily Mail，2021）。</li>\n<li><strong>工作</strong>：成了一名<strong>儿童图书管理员</strong>，开着一辆写着&quot;流动学校图书馆&quot;的车，把书送到各个学校（Wikipedia；Wikoff，2013）。</li>\n<li><strong>家</strong>：还住在东区（Wikoff，2013）。杰基那时已搬去 Essex，苏还是单身、在旅行社工作。</li>\n<p>这一集有个著名的 pub 圆桌讨论：Apted 追问三个女孩，她们是不是和富家女苏西（Suzy）有同样的机会。杰基说&quot;我得到了我想要的机会&quot;，林恩接了一句：<strong>&quot;我觉得我在另一个方面比她机会更多。我差不多做了所有我想做的事&quot;</strong>（PopMatters，2013，转引）。注意她的措辞——&quot;差不多&quot;&quot;在另一个方面&quot;——评论家说，这是她们绕开节目的阶级决定论、同时捍卫自己选择的方式：不跟你辩论体制，只说我过得不差。</p>\n</ul>\n"},{"age":28,"title":"28岁 ——《28 Up》（1984）","html":"<p>林恩 28 岁这一集，公开资料很薄。能确定的是延续性：嫁给 Russ，两个女儿已经出生，在儿童图书馆的事业线上稳步走。没有离婚、没有换工作、没有搬家——在几个同伴人生翻江倒海的年纪，她的线是平的。资料没写的不编，但&quot;没大事发生&quot;本身也是她人生的特征。</p>\n"},{"age":35,"title":"35岁 ——《35 Up》（1991）","html":"<p>35 岁同样没什么林恩的特写——她是那个&quot;稳定的对照组&quot;，衬托别人的动荡（比如杰基的离婚和生病）。她还是图书管理员。有篇美国评论（Bruce Bawer，《哈德逊评论》，2007）顺嘴提过一句林恩&quot;顶着重病坚持做 demanding 的图书馆工作&quot;，但上下文不明、无法佐证，这里只记一笔&quot;未证实&quot;，不当事实写。</p>\n"},{"age":42,"title":"42岁 ——《42 Up》（1998）","html":"<p>官方《56 Up》新闻资料包给了关键的一句：<strong>&quot;她后来一直在流动图书馆工作，到《42 Up》时已经干了三十年&quot;</strong>（First Run Features，2012）。三十年，同一个流动儿童图书馆——在 14 个人里，这种职业稳定性是独一份。她还是 Russ 的妻子，两个女儿长大了。</p>\n"},{"age":49,"title":"49岁 ——《49 Up》（2005）","html":"<p>《49 Up》是林恩政治色彩最浓的一集。官方资料包写道：&quot;在《49 Up》里，林恩得知自己儿童图书管理员的岗位可能要被裁， devastated（大受打击）。这个两个孩子的母亲，愤怒的是：她干了这么多年、给成千上万孩子带去教育和快乐的工作，可能就要没了&quot;（First Run Features）。</p>\n<p>拼凑出的经过是：<strong>流动图书馆服务被砍掉</strong>后，她转去一所学校的图书馆；到 49 岁，地方政府的预算大刀又要砍到这个岗位。她的愤怒指向一件事：她认为对社会至关重要工作，正在被轻飘飘地作废。这个主题七年后在她最后一次出镜时达到顶点。</p>\n"},{"age":56,"title":"56岁 ——《56 Up》（2012）","html":"<p>这是林恩最后一次被拍到，也是这一集里最让人难受的段落之一：</p>\n<ul>\n<li><strong>失业</strong>。&quot;在《56 Up》里她透露，因为预算削减丢了工作&quot;（First Run Features《56 Up》新闻资料包，2012）。当时的评论写：她和 Russ 本来计划退休、多陪家人，&quot;但几轮预算削减之后，她的图书管理员岗位被裁了&quot;（Daily Nebraskan，2013）。她只能提前领养老金（WhatCulture，2013）。</li>\n<li><strong>工作的意义</strong>。&quot;到 56 岁，她依然相信图书管理员这份工作极有价值，它定义了她的人生&quot;（Wikipedia，转引《56 Up》报道）。</li>\n<li><strong>家庭</strong>：还是和 Russ 在一起；<strong>三个孙辈的奶奶</strong>，其中一个孙辈早产、当时已是健康的学龄前儿童（First Run Features，2012；Wikipedia）。</li>\n<li><strong>社区角色</strong>：她在 Poplar 的 St Saviour's 小学当了<strong>校董会主席，超过 25 年</strong>（Wikipedia；Daily Mail，2021）——在她长大的那个区，做了四分之一个世纪的志愿公共服务。</li>\n<p>她的段落在《56 Up》里被普遍读作&quot;紧缩时代的良心&quot;：那个把一生献给&quot;给孩子们带去教育和快乐&quot;的图书管理员，亲眼看着这份事业被预算砍掉。</p>\n</ul>\n"},{"age":63,"title":"63岁 ——《63 Up》（2019）：她已经不在了","html":"<p>林恩没能接受《63 Up》的采访。Apted 用<strong>档案影像</strong>搭了她的段落——21 岁、7 岁、35 岁、56 岁的她依次出现，&quot;我们跟着她从图书管理员走到 56 岁&quot;，然后影片揭晓：她 2013 年就去世了（Film Comment，2020；Erik Lundegaard，2020）。她的<strong>丈夫 Russ 和两个女儿接受了采访</strong>，回忆她的离世和对家庭的影响（Wikipedia；Lundegaard）。影片还提到<strong>她工作的图书馆以她的名字命名了纪念区</strong>（Lundegaard；Wikipedia）。评论家说，这种结构——先看档案里的林恩，再意识到她已经去世六年——是全片最不动声色、也最狠的一刀（Lundegaard，2020）。</p>\n<p><strong>去世时间的核实</strong>：2013 年 5 月，各家来源一致——&quot;2013 年 5 月，一场短暂的疾病之后，林恩成为第一个去世的参与者&quot;（Wikipedia）；Daily Mail（2021）、The Sun（2026）、NPR（2019）都佐证是 2013 年。终年 57 岁（与 1956 年出生吻合）。<strong>死因没有确证</strong>：主流说法都是&quot;短暂的疾病&quot;，不展开；2026 年《太阳报》和《每日邮报》写成&quot;脑部疾病&quot;；有个专栏作家写&quot;脑瘤&quot;，但只有这一家、无佐证。家属和 ITV 从未公布确切病因——照实说&quot;短暂疾病&quot;，不乱写。</p>\n<p><strong>最后一次拍摄</strong>：确认是《56 Up》（2012），去世约在该片播出一年后。</p>\n<p>Apted 的悼念：&quot;她是个可爱的女人。她很聪明，人生挺不容易。她是我们最喜欢的人之一，因为她直率又诚实&quot;（Daily Mail，2021，转引）。他 2019 年还说，她的死&quot;太让人难受了&quot;——这是他第一次失去参与者（nightviz.ca，转引 2019 年采访）。</p>\n<p>身后事：St Saviour's 学校把图书馆的一部分以她的名字命名（Wikipedia；图书馆员博客记下了铭牌文字，大意是&quot;纪念热爱阅读的林恩·约翰逊&quot;）；托尼·沃克组织了很多参与者去她的墓前看她（The Sun，2026）——托尼和林恩私交一直很好。</p>\n"},{"age":70,"title":"70岁 ——《70 Up》（2026）：空椅子","html":"<p>终章《70 Up》（ITV，2026 年 9 月 15 日和 22 日播出，Asif Kapadia 接替 2021 年去世的 Apted 执导）里，林恩是被怀念的缺席者之一。</p>\n<p>ITV 的官方简介写：&quot;本系列将深情怀念已故的林恩——三姐妹中的一员&quot;（RadioTimes/ITV，经 Edinburgh Live，2026，转引）。</p>\n<p>苏在采访里说，拍三个女孩的合体采访、却没有林恩，是整个系列&quot;最难过的一刻&quot;：&quot;我们以前都是先单独拍，再三个人一起拍。没有她，就感觉……<strong>像一把空椅子</strong>&quot;（Edinburgh Live，2026）。杰基也在片子里谈了失去这位童年朋友（Wikipedia，转引《70 Up》评论）。有评论把终章的基调概括为&quot;两把空椅子：2013 年去世的林恩·约翰逊，和 2023 年去世的尼克·希钦&quot;（ciceros.org，2026）。</p>\n<p>《70 Up》没有关于林恩的新事实——她的故事在终章里由档案影像和活着的朋友们讲述。这本身就很说明问题：她人不在了，但三个女孩的段落永远缺她不可。</p>\n"}],"compare":{"title":"7岁的她，和最后的她（她没有走到70岁）","html":"<h3>没变的地方</h3>\n<ul>\n<li><strong>直率</strong>。Apted 悼念她时用的词就是&quot;直率又诚实&quot;（straightforward and honest）——7 岁时她就是那个有话直说的东区女孩。</li>\n<li><strong>知足</strong>。7 岁说去 Woolworths 当售货员，&quot;特别笃定&quot;；21 岁说&quot;我差不多做了所有我想做的事&quot;。她从没觉得起点低就欠了自己一个人生。</li>\n<li><strong>守</strong>。工作三十年、婚姻一生、朋友一辈子。14 个人里，她是&quot;不变&quot;的代名词。</li>\n</ul>\n<h3>完全改变的地方</h3>\n<ul>\n<li><strong>从被期待&quot;去鞋店打工&quot;的女孩，到社区受尊敬的人</strong>。25 年校董会主席、图书馆以她命名——她没上过大学，但成了 Poplar 那个小学的&quot;自己人&quot;。</li>\n<li><strong>从节目的&quot;阶级样本&quot;，到节目的&quot;良心&quot;</strong>。晚年她用镜头为图书馆事业和公共服务说话，Apted 给了她这个平台。</li>\n</ul>\n<h3>最出人意料的变化</h3>\n<p>14 个人里第一个走的，是看起来最稳的她——婚姻完整、工作稳定、儿孙满堂、从不冒险。她的离世让所有人（包括观众）第一次意识到：这个系列不只是关于阶级和选择，也是关于死亡。而且讽刺的是：她死后，人们才发现她有多重要——连一向嘴硬的杰基都在《70 Up》里专门谈了她。</p>\n"},"conclusion":"<p>一个 7 岁时说要去 Woolworths 当售货员的东区女孩，长大后果然没去追什么&quot;成功&quot;：19 岁结婚，开着流动图书馆车给孩子们送书，一送三十年，顺带给母校当了二十五年校董会主席。她是 14 个人里人生最稳的一个，也是第一个离开的——2013 年 5 月病逝，57 岁。她证明了&quot;七岁看老&quot;最朴素的版本：一个知足、直率、守得住的人，从 7 岁到 56 岁，真的没怎么变。</p>\n","sources":"<p><strong>主要来源</strong>：First Run Features《56 Up》官方新闻资料包（2012，林恩 56 岁小传最权威的出处）；First Run Features《49 Up》新闻资料包；《49 Up》完整文字实录（含 1964 年档案对白）；Daily Mail Femail（2021 年 1 月）；The Sun（2026 年 9 月）；NPR（2019）；RadioTimes/ITV 经 Edinburgh Live（2026）；Film Comment（2020）；Erik Lundegaard（2020）；PopMatters（2013）；Katherine Wikoff 博客逐集分析（2013）；Wikipedia 仅作结构核对。</p>\n<p><strong>冲突与空白</strong>（如实记录）：1）死因——&quot;短暂疾病&quot;（主流）、&quot;脑部疾病&quot;（太阳报/邮报 2026）、&quot;脑瘤&quot;（一家专栏，无佐证）；家属和 ITV 从未公布确切病因，不采信任何单一说法；2）出生只精确到 1956 年，月日不详（某数据库的&quot;1956 年 1 月 1 日&quot;疑似占位）；3）曾有人说她 7 岁讲过关于&quot;有钱人&quot;的名言，查无出处，不采用——她的名言是 Woolworths 那句；4）父母姓名职业、两个女儿的名字，均无公开资料；5）28 岁、35 岁两集的细节稀薄，记空白；6）图书馆纪念的表述各家略有出入（&quot;命名一个区&quot;/&quot;修葺后立牌&quot;/&quot;命名一翼&quot;），同一件事的不同说法。</p>\n"},"sue":{"id":"sue","name":"苏·戴维斯","en":"Sue Davis（现名 Sue Fitzgerald）","nickname":"最爱这节目的幸运儿","avatar":"avatars/sue.jpg","summary":"三个东区女孩里最爱笑、也最爱这个节目的一个：没上过大学，却从秘书一路做到伦敦玛丽女王大学法学院的行政负责人，能站在 600 人的讲堂上讲话；35 岁离婚后单身带大两个孩子，与 Glenn 订婚 22 年后 2020 年结婚；70 岁退休搬到 Essex，自称\"除了离婚，人生一直平衡得不错\"。","class7":"伦敦东区工人阶级家庭，父母是市议会公房租户","education":"Susan Lawrence 小学，之后上综合学校；没上大学——后来却在大学里工作了几十年","career":"秘书起家→伦敦玛丽女王大学法学院行政部门负责人（主管法律课程）","marriage":"24 岁嫁给 Billy，35 岁离婚；与 Glenn Fitzgerald 订婚 22 年，2020 年结婚，改姓 Fitzgerald","children":"一子一女（William 和 Kathryn），均已四十多岁","turning":"35 岁离婚后单身带两孩子重返职场，从秘书一步步做到大学行政负责人","status70":"约 2025 年退休，与 Glenn 搬到 Essex；正在找志愿者工作，自称退休后\"有点找不着北\"","alive":true,"tags":["工薪阶层","没上大学","离婚","再婚","退休"],"intro":"<p>苏是东区三个女孩里最开朗、最&quot;想得开&quot;的一个，也是全系列里对节目感情最深的参与者——&quot;有人觉得被冒犯，但我一直为它骄傲&quot;。7 岁时她是那个外向的小女孩，杰基是&quot;深沉的思想者&quot;，林恩&quot;严肃但好玩&quot;——她说 7 岁时&quot;我们的性格就定型了&quot;。她没上过大学，&quot;同龄人里一个上大学的都不认识&quot;，却在伦敦玛丽女王大学的法学院当了几十年行政负责人，能站在 600 人的讲堂上讲话。35 岁离婚，单身带大两个孩子；跟 Glenn 订了 22 年的婚，2020 年终于结婚。70 岁的她刚退休一年，搬到 Essex，&quot;有点找不着北&quot;，但总结自己：&quot;除了离婚，我的人生一直平衡得不错。&quot;</p>\n","background":"<p>苏 1956 年 11 月出生在伦敦东区（《泰晤士报》2026 年 9 月写她&quot;11 月满 70 岁&quot;，日子精确到月）。工人阶级，父母是<strong>市议会公房的租户</strong>（Daily Mail，2026）。她很骄傲的一件事：靠政府的&quot;优先购买权&quot;政策，她成了<strong>全家第一个拥有自己房子的人</strong>。</p>\n<p>她和杰基、林恩在 Bethnal Green 的 Susan Lawrence 小学同班，&quot;从 7 岁起就分不开&quot;（Daily Mail，2026）。小学之后她上的是综合学校，具体校名无公开资料。她对自己起点的描述特别实在：&quot;我们这代女孩，没人催我们上大学&quot;，她不记得父母跟她谈过教育（Daily Mail，2026）；&quot;我同龄人里，一个上大学的都不认识&quot;（The Times，2026）。而节目里那些富家男孩 7 岁就在谈 Charterhouse（贵族公学）和牛津——差距从起跑线就摆在那儿。</p>\n<p>关于她父母，公开资料少得可怜：职业从没提过。2019 年她跟《Radio Times》说父母都还健在，还盘算&quot;七年之后他们还会在吗&quot;；2026 年的状况不详。兄弟姐妹的情况，无公开资料。</p>\n","ages":[{"age":7,"title":"7岁 ——《Seven Up!》（1964）","html":"<p>1964 年 5 月，格兰纳达电视台的《World in Action》栏目组来到 Susan Lawrence 小学，拍一期关于英国阶级和机会的节目，导演是 Paul Almond，年轻的 Michael Apted 帮忙选孩子。没人想到这会变成拍 62 年的系列。</p>\n<p>三个女孩一起出镜。2026 年 9 月 BBC 的回顾（被多家媒体转载）提到，第一集里女孩们&quot;被问在学校里的男孩、以及对未来的希望&quot;——从第一天起，女孩就被往&quot;家庭话题&quot;上引，男孩则被问世界大事。苏对 7 岁的自己记得不多：她跟《Radio Times》（2019）说自己&quot;记性糟透了，像条金鱼&quot;，连 1964 年拍摄那天都不记得，只看过片段。</p>\n<p>她对 7 岁三人组的定性后来被引用很多：她是<strong>外向的那个</strong>，杰基是深沉的思想者，林恩严肃但好玩——&quot;7 岁时我们的性格就定型了&quot;（The Times，2026）。这句话是她 70 岁时说的，本身就是一个&quot;伏笔&quot;：六十年过去，她觉得 7 岁的性格鉴定依然有效。</p>\n<p>7 岁的苏没有留下杰基那种名言。女孩们 1964 年的著名童言（&quot;嫁个有点钱但不太有钱的男孩&quot;之类）是杰基的，不能安到苏头上。</p>\n"},{"age":14,"title":"14岁 ——《7 Plus Seven》（1970）","html":"<p>第二集是 Apted 第一次执导。14 岁的苏留下了一句被她 70 岁时亲口认领的话：她说希望<strong>&quot;知足，知道自己往哪儿去，能温柔地回望做过的事&quot;</strong>（to be content, to know where I'm going and remember fondly what I've done）（The Times，2026）。</p>\n<p>好玩的是，69 岁的她说自己完全不记得说过这话，但依然认账——&quot;想在镜头前显得聪明，说出来的全是废话&quot;，她自嘲道。她跟《Radio Times》（2019）说，14 岁是唯一记得被拍的年纪，因为&quot;那是尴尬的年纪&quot;。</p>\n<p>这一句 14 岁的愿望，后来成了她人生的谶语：70 岁的她，基本就是按这句话活的。</p>\n"},{"age":21,"title":"21岁 ——《21 Up》（1977）","html":"<p>《21 Up》是苏和 Apted 公开闹翻的一集。那时杰基和林恩都结婚了，Apted 反复追她：&quot;你怎么还没结婚？你到底想找什么样的？&quot;——她才 21 岁（Daily Mail，2026）。</p>\n<p>苏后来一直很坦率：<strong>她恨透了拍《21 Up》</strong>。&quot;世界在变，可 Michael 好像觉得我们还是会当家里的小媳妇&quot;——她骂了他一句，转身走了（Daily Mail，2026）。NPR 在 2019 年的回顾里写，21 岁的三个女孩给了 Apted&quot;一顿脆生生的抢白&quot;，就因为他只问她们家庭问题——这成了全系列性别议题的标志性时刻。Apted 后来也认了：2012 年他跟 BBC 承认，原版 14 个孩子里女孩太少是他&quot;最后悔的事之一&quot;（BBC News，2012）。</p>\n<p>生活上，21 岁的苏离开学校，当了<strong>秘书</strong>——这就是她后来在大学行政系统里步步高升的起点（Daily Mail，2026）。</p>\n"},{"age":28,"title":"28岁 ——《28 Up》（1984）","html":"<p>28 岁的苏走的是节目里&quot;工人阶级女性标准剧本&quot;：24 岁（约 1980–81 年）嫁给了 <strong>Billy</strong>（官方《56 Up》新闻资料包，First Run Features，2012），然后<strong>辞职生了两个孩子</strong>——一儿一女。孩子的名字《泰晤士报》（2026）给了：<strong>William 和 Kathryn</strong>。按&quot;《42 Up》前已是青少年&quot;&quot;2026 年四十出头&quot;倒推，出生约在 1982–85 年（Daily Mail，2026；The Times，2026）。</p>\n<p>所以 28 岁的苏是全职带两个小孩子的已婚妈妈，不在外工作。Billy 是干什么的、家住哪儿，公开资料都没写。但和&quot;标准剧本&quot;不一样的是：苏没在这条路上走到底。</p>\n"},{"age":35,"title":"35岁 ——《35 Up》（1991）","html":"<p>到《35 Up》，婚姻结束了：苏和 Billy 在她 35 岁（约 1990–91 年）<strong>离婚</strong>（First Run Features 新闻资料包；Wikipedia）。她自己的总结后来被多次引用：&quot;24 岁结婚，生了两个孩子，35 岁分开。任何破裂都让人难过，但我们还是朋友&quot;（Daily Mail，2026）。</p>\n<p>离婚的细节——抚养权、有没有撕破脸——公开资料一概没有。她在镜头前没演过怨妇，这也是她一生的风格：<strong>&quot;除了离婚，我的人生一直平衡得不错&quot;</strong>（Daily Mail，2026）。</p>\n"},{"age":42,"title":"42岁 ——《42 Up》（1998）","html":"<p>这一集，现代意义上的苏出现了：42 岁的她是<strong>单亲妈妈，带着儿子和女儿，回去上班，一个人养全家</strong>（First Run Features）。《泰晤士报》（2026）形容她是&quot;当了很久的单亲妈妈，<strong>必须工作</strong>&quot;——&quot;必须&quot;两个字，是她事业心的全部燃料。</p>\n<p>而在《42 Up》段落的结尾，来了个转折：她透露<strong>认识了一个新男人</strong>，但说&quot;还早着呢&quot;（First Run Features）。这个男人就是 <strong>Glenn</strong>（婚后姓 Fitzgerald）。孩子们那时是青少年（The Times，2026）。谁也没想到，&quot;还早着呢&quot;的这段感情，会绵延下一个四分之一世纪。</p>\n"},{"age":49,"title":"49岁 ——《49 Up》（2005）","html":"<p>到《49 Up》，苏和 Glenn 在一起<strong>七年</strong>了（First Run Features）。工作上，她已经进了<strong>伦敦玛丽女王大学法学院的行政部门</strong>（First Run Features，2012 年新闻资料包——她职位最权威的出处）。《Radio Times》的&quot;今昔&quot;栏目（2019）也把她列为玛丽女王大学的行政人员，还开玩笑说她在谈&quot;全世界最长的订婚&quot;。</p>\n<p>这一集也是杰基当面跟 Apted 摊牌的那一集——苏在场，并且站在杰基这边，和她 1977 年的退场一脉相承。苏自己和 Apted 的关系可以叫&quot;温暖的对抗&quot;：她跟 Daily Mail（2026）说，&quot;Michael 是最好的人，但他心里想要什么节目效果，就非常一根筋&quot;；她拒绝谈任何可能伤害家人的事，&quot;但他还是会想方设法偷塞一个问题进来&quot;。她还说：&quot;我觉得他不明白单亲妈妈有多难。&quot;</p>\n<p>生活里，她的另一面也出来了：新闻资料包提到她玩<strong>社区话剧</strong>，后来的报道说她爱业余戏剧（Femail/Daily Mail，2019）、爱卡拉 OK（ABCtales，2019），ITV 的《70 Up》简介总结她&quot;一直爱着唱歌和戏剧&quot;。</p>\n"},{"age":56,"title":"56岁 ——《56 Up》（2012）","html":"<p>56 岁是苏的高光集，连 Apted 都亲口盖章。Apted 在《Harlem World Magazine》访谈（约 2013 年）里说，苏是 <strong>《56 Up》的&quot;成功故事&quot;</strong>：工人阶级单亲妈妈，&quot;最后成了大学行政人员&quot;——他很佩服，一个没上过大学的人，能站在 600 人的讲堂前面讲话。</p>\n<p>这一集的事实（First Run Features 新闻资料包）：苏和 Glenn <strong>订婚 14 年</strong>（从约 1998 年算起），她在玛丽女王大学法学院行政部门<strong>越做越高</strong>，社区话剧还在玩。罗杰·伊伯特的《56 Up》影评（2013）给了个一句话版本：&quot;离了婚，带着两个孩子，她找了份秘书工作，一路升到行政高层。我们看她站在坐满学生的讲堂前讲话，承认这事儿对她自己都很魔幻——她可从没上过大学。&quot;</p>\n"},{"age":63,"title":"63岁 ——《63 Up》（2019）","html":"<p>到《63 Up》，苏和 Glenn 订婚<strong>21 年</strong>——电视预告开玩笑说这是&quot;已知最长的订婚&quot;（What to Watch，2019）。她在玛丽女王大学做法学院行政，等着退休。</p>\n<p>2019 年她的段落有两个主题：</p>\n<p><strong>林恩的空位</strong>。林恩 2013 年 5 月去世，57 岁，14 个人里第一个走的。《63 Up》是第一次三个女孩凑不齐。苏后来跟《Radio Times》（2026）说，整个系列&quot;最难过的一刻&quot;就是林恩走后拍合体采访：&quot;我们以前都是先单独拍，再三个人一起拍。没有她，就感觉……像一把空椅子&quot;（经 Edinburgh Live，2026，转引）。Daily Mail（2026）补充，苏和杰基都去了林恩盛大的葬礼。</p>\n<p><strong>变老和阶级</strong>。她跟《Radio Times》（2019）说得很实在：现在状态不错，&quot;但以后只会更糟。你会更病、更老&quot;——父母那时还健在，她盘算&quot;七年之后他们还会在吗&quot;（经 Femail/Daily Mail，2021 年 1 月，转引）。《TheWrap》（2019）记下她的阶级观：她说自己那种市议会公房出身——政府给穷人家庭一个攒钱买房的起点——是&quot;最后一代&quot;了；《The Arts Desk》（2019）写她&quot;对变老很豁达，但觉得年轻人的日子更难了&quot;，还说&quot;能参与这个节目一辈子，是个成就……这是真正的真人秀&quot;。她还跟《Radio Times》许愿，退休想去&quot;德文或康沃尔找个田园小屋&quot;（Femail，2019）——七年后她真搬去了乡下方向，只是落点是 Essex。</p>\n"},{"age":70,"title":"70岁 ——《70 Up》（2026）","html":"<p>终章在 ITV1 播出（2026 年 9 月 15 日和 22 日，两集 90 分钟，另有两集 30 分钟番外），Asif Kapadia 接替 2021 年去世的 Apted 执导（hellorayo/Radio Times，2026）。ITV 官方简介：&quot;苏会谈嫁给 Glenn，以及在伦敦玛丽女王大学的几十年。&quot;</p>\n<p><strong>终于结婚</strong>。订婚 21 年（2019 年）——苏自己随口说过&quot;最长的订婚（25 年！）&quot;——<strong>2020 年，苏和 Glenn 结了婚</strong>（Daily Mail，2026）。《泰晤士报》（2026 年 9 月）写她是 <strong>Sue Fitzgerald</strong>，确认她随了夫姓。Daily Mail 称 Glenn 是她的&quot;第二任丈夫&quot;。</p>\n<p><strong>退休和搬家</strong>。苏从玛丽女王大学退休了——《泰晤士报》写她&quot;退休一年&quot;，倒推约 2025 年离岗——<strong>搬到了 Essex</strong>（Daily Mail，2026；Wikipedia）。她很诚实：退休到现在&quot;有点找不着北&quot;，正在家附近找<strong>志愿者工作</strong>（The Times，2026）。</p>\n<p><strong>家庭</strong>。William 和 Kathryn 四十出头，&quot;都挺好，有自己的房子&quot;——苏把这直接连回她的阶级之路：父母是公房租户，她是全家第一个买房的人（Daily Mail，2026）。有没有孙辈？所有资料都没提，<strong>不详</strong>。</p>\n<p><strong>70 岁的看法</strong>。《泰晤士报》勾勒出的苏，还是那个外向的 7 岁女孩，只是多了回望：她是节目最积极的参与者——&quot;有人觉得被冒犯，但我一直为它骄傲&quot;——她珍惜的是观众&quot;在我们身上看到自己&quot;。对 2026 年的英国她没那么乐观：看大学经费挣扎，觉得国家缺的是&quot;水管工和电工这种手艺人&quot;，而不是&quot;拿了学位找不到工作&quot;的毕业生。对阶级，她跟《泰晤士报》说：某种程度上还在——&quot;你怎么说话、怎么表现，在某些人眼里永远把你归到某一类&quot;——但&quot;有钱就能改善生活&quot;。Daily Mail 的采访里她担心政府&quot;在学徒制上 missed the boat（错失良机）&quot;：&quot;不是人人都想上大学，尤其背着债毕业还找不到工作。&quot;</p>\n<p><strong>对 Apted 和节目</strong>。Apted 走了，她的评价深情又清醒：最好的人，但一根筋；她在他错的时候挑战他（1977 年退场；&quot;你知道我们有投票权了吧，Michael？&quot;）。但她也记他的好：&quot;因为 Michael 给我们打开了一个新世界，我们会被请去伦敦参加首映&quot;——包括那晚在 Docklands 的邦德片场见到 Pierce Brosnan，Brosnan 跟她说&quot;你们这节目太棒了！&quot;（Daily Mail，2026）。她记得拍《63 Up》时 Apted&quot;虚弱得不行&quot;，他 2021 年去世&quot;突然，但不意外&quot;——拍完那顿饭上他说：&quot;我原以为我还能再拍一部，但我觉得我拍不动了。&quot;</p>\n<p><strong>对 7 岁的自己</strong>。除了&quot;性格 7 岁就定型&quot;，她最被引用的一句自我评价来自《泰晤士报》：她 69 岁依然认 14 岁那句&quot;知足，知道自己往哪儿去&quot;。她给整个实验的总结（Daily Mail，2026）：&quot;一开始他们对我们没抱什么期望，但我们做到的，远比谁想的都多。&quot;</p>\n<p><strong>孤独、幸福、遗憾</strong>。公开资料里看不到苏孤独的证据：已婚，住在 Essex，两个成年子女。70 岁的情绪底色是&quot;知足&quot;，掺着退休初期的找不着北——&quot;有点 lost（找不着北）&quot;，想找点事做。她在 2026 年的采访里没提过重大遗憾，最接近遗憾的一句是 63 岁时说的：&quot;以后只会更糟，更病、更老&quot;——时间不多了。她跟《Radio Times》（2026 年 9 月）说：&quot;我为自己参与了这个节目<strong>非常骄傲</strong>。有时候我都惊讶居然有人看……要说我有什么特别，就是参与了这个了不起的系列&quot;（经 Edinburgh Live 转引）。<strong>健康</strong>：没有任何一集公开过她的健康问题，2026 年露面状态良好。<strong>对死亡</strong>：除了 2019 年谈变老那些话，没有专门谈过自己的死亡，不编。</p>\n"}],"compare":{"title":"7岁的她，和70岁的她","html":"<h3>没变的地方</h3>\n<ul>\n<li><strong>外向和爱笑</strong>。7 岁&quot;外向的那个&quot;，70 岁还是节目里最爱笑、最配合的人。她自己说的&quot;性格 7 岁就定型&quot;，在她身上最成立。</li>\n<li><strong>14 岁的愿望</strong>。&quot;知足，知道自己往哪儿去，能温柔地回望做过的事&quot;——69 岁的她亲口认领：这句话我认。这在 14 个人里是罕见的：少年立的 flag，老年没倒。</li>\n<li><strong>不端着</strong>。7 岁是东区普通女孩，70 岁是大学行政负责人，但说话还是大白话，对阶级问题从不绕弯。</li>\n</ul>\n<h3>完全改变的地方</h3>\n<ul>\n<li><strong>职业</strong>。从&quot;同龄人里一个上大学的都不认识&quot;，到在大学法学院当了几十年行政负责人、站上 600 人讲堂。这是 14 个人里最漂亮的&quot;跨界&quot;之一——不是跨阶级，是跨进了那个曾经够不着的世界。</li>\n<li><strong>婚姻</strong>。24 岁结婚、35 岁离婚、单亲妈妈 20 年、订婚 22 年、64 岁结婚。感情线是全系列最&quot;马拉松&quot;的一条。</li>\n<li><strong>地理和心态</strong>。东区→Essex；从&quot;必须工作&quot;的单亲妈妈，到退休后&quot;有点找不着北&quot;、想找志愿者工作的人。</li>\n</ul>\n<h3>最出人意料的变化</h3>\n<p>没人想到三个东区女孩里&quot;最普通&quot;的苏，会成为 Apted 亲口认证的&quot;成功故事&quot;。7 岁时节目组对她的期待大概也就是&quot;嫁人生子&quot;；70 岁时她站在大学讲堂上、结了婚、买了房、退休了——把&quot;工人阶级女孩的标准剧本&quot;演成了一个上扬的故事。更意外的是她对节目的感情：被冒犯过（1977 年退场）、被问烦过，但她是 14 个人里最以节目为傲的。&quot;要说我有什么特别，就是参与了这个了不起的系列&quot;——这句话只有她说得出口。</p>\n"},"conclusion":"<p>一个 7 岁时外向爱笑、14 岁时许愿&quot;知足&quot;的东区女孩，没上过大学，24 岁结婚、35 岁离婚，一个人把两个孩子带大，从秘书一路干到伦敦玛丽女王大学法学院的行政负责人；跟 Glenn 订婚 22 年、64 岁才结婚，70 岁退休搬到 Essex。她是三个女孩里唯一走到最后的，也是全系列对节目感情最深的人——她的人生证明，&quot;七岁看老&quot;看对了一半：性格 7 岁就定了，但人生的高度，是她自己一层层加上去的。</p>\n","sources":"<p><strong>主要来源</strong>：First Run Features《56 Up》官方新闻资料包（2012，苏的婚姻/职业时间线最权威出处）；ITV《70 Up》官方简介（2026，经 hellorayo/Radio Times）；苏本人采访：《Radio Times》（2019；2026 年 9 月经 Edinburgh Live 转引）、Daily Mail《周末杂志》（2026 年 9 月）、The Times（2026 年 9 月）；Michael Apted 访谈（Harlem World Magazine，约 2013；BBC News，2012）；BBC News 回顾（2026 年 9 月）；RogerEbert.com（2013）；TheWrap（2013、2019）；NPR（2019）；The Arts Desk（2019）；Wikipedia 仅作交叉核对。</p>\n<p><strong>冲突与空白</strong>（如实记录）：1）婚后姓氏——《泰晤士报》（2026）及一家转载写&quot;Sue Fitzgerald&quot;，Daily Mail（2026）和 Wikipedia 仍用&quot;Sue Davis&quot;；最可能是 2020 年结婚后随夫姓、但媒体沿用旧名，作&quot;同一人、名字变体&quot;处理；2）Glenn 的拼写——新闻资料包作&quot;Glen&quot;，多数媒体作&quot;Glenn&quot;，取多数；3）订婚时长——2012 年 14 年、2019 年 21 年，都指向约 1998 年；苏自称&quot;25 年&quot;是随口说的，不必较真；4）职位——&quot;法学院行政部门&quot;（新闻资料包、泰晤士报）vs NPR（2019）一句&quot;大学就业指导部门&quot;，以后者为误写处理；5）父母职业从未公开，2019 年说健在，2026 年不详；兄弟姐妹不详；6）出生精确到 1956 年 11 月，日不详；7）孩子出生年份系倒推（约 1982–85 年），非直接记载；8）有无孙辈、具体健康状况，无公开资料；9）首任丈夫&quot;Billy&quot;只有新闻资料包提过名字，无姓无其他信息；10）她住过的具体街区、上过的综合学校校名、退休时的具体职位，均无公开资料。</p>\n"},"paul":{"id":"paul","name":"保罗·克利格曼","en":"Paul Kligerman","nickname":"从儿童之家走到澳洲的建造者","avatar":"avatars/paul.jpg","summary":"14 个人里起点最低、结局最稳的一个：父母离异后住进儿童之家，8 岁随父亲移民澳洲；21 岁时说\"我总觉得自己是个没用的人\"，后来当泥瓦匠、白手起家做建筑生意；1978 年结婚，一次婚结了 48 年没离，是全系列唯一没离过婚的人；70 岁在墨尔本附近当祖父，留给观众的话是\"善良，宽恕，诚实地活\"。","class7":"父母离异后住进儿童之家的孩子（系列里\"一无所有\"的那一端）","education":"具体学校无公开资料；8 岁移民澳洲后在当地上学","career":"泥瓦匠→自己的建筑公司→招牌制作公司→与妻子一起在养老村做维修","marriage":"1978 年与 Sue（Susan）结婚，48 年无离异——14 人里唯一","children":"两个孩子；多个孙辈","turning":"8 岁离开儿童之家，随父亲、继母移居澳洲，人生从此换了一条跑道","status70":"住在墨尔本附近；祖父；可能是退休或半退休（无确证）；70 岁告别词谈家人与宽恕","alive":true,"tags":["儿童之家","没上大学","移民","有孙辈","退休"],"intro":"<p>保罗是 14 个人里起点最低的一个：父母&quot;一团糟地离婚&quot;，妈妈走了，他进了儿童之家。7 岁时他是个说话小声、看起来总在担心的小男孩，最出名的一句童言是怕结婚——因为&quot;不喜欢吃青菜&quot;，怕老婆做青菜逼他吃。8 岁那年，他的人生换了一条跑道：跟着爸爸、继母去了澳洲。21 岁时他说：&quot;我总觉得自己是个没用的人（no-hoper）。&quot;后来他当泥瓦匠，自己开建筑公司，1978 年结了婚——这段婚姻一结 48 年，是 14 个人里唯一没离过婚的。70 岁的他在墨尔本附近当祖父，留给观众的话是：要有个好家庭，善良，宽恕，诚实地活。他是这个系列&quot;七岁看老&quot;最大的反例：7 岁时最不被看好的孩子，过得最稳。</p>\n","background":"<p>保罗约 1956 年生于英国，具体生日和出生地无公开资料。父母在他很小的时候离了婚——Daily Mail（2026）形容是&quot;一团糟的离婚&quot;，妈妈离开了爸爸；Wikipedia（2026）写他&quot;留给了父亲&quot;。父亲后来再婚，继母成了移民澳洲的&quot;一家人&quot;的一部分；他还有个兄弟一起去了（Daily Mail，2026）。</p>\n<p>晚年还有个让人心酸的补充：保罗的父亲自己小时候也在儿童之家待过——因为保罗爷爷奶奶那辈也离了婚（Entertainment Daily，2026）。也就是说，&quot;进儿童之家&quot;这件事，在他们家是两代人的故事。</p>\n<p><strong>儿童之家到底是哪家</strong>，这是保罗档案里最大的事实冲突，很多中文二手资料写&quot;巴纳德之家&quot;（Barnardo's）。但目前最具体、有出处的说法是 Wikipedia（2026）：保罗 7 岁时住的是 <strong>Shaftesbury Homes 在 Twickenham 的儿童之家</strong>——和西蒙同一家。Shaftesbury Homes（全称 Shaftesbury Homes and Arethusa）是维多利亚时代的老牌儿童慈善机构，和 Barnardo's 是两家。2026 年几家小报也写过&quot;Barnardo's&quot;，但查不到出处，很可能是记者把&quot;英国最有名的儿童之家&quot;随手安上了。结论：<strong>以 Shaftesbury Homes、Twickenham 为准，&quot;Barnardo's&quot;不采信</strong>。</p>\n<p>在 1964 年节目的阶级框架里，保罗和西蒙是&quot;机构抚养&quot;这一层：不是父母养大，也不是学校养大，是&quot;之家&quot;养大。Apted 后来把原版的意图概括为&quot;这些孩子拥有一切，另一些孩子一无所有&quot;（Wikipedia，2026，转引《卫报》）——保罗就是&quot;一无所有&quot;那一端的代表。</p>\n","ages":[{"age":7,"title":"7岁 ——《Seven Up!》（1964）","html":"<p>7 岁的保罗是个小小个、表情严肃、看起来有点焦虑的男孩，和西蒙一起在儿童之家被拍。他说话轻声细语、很认真，留下了全系列最有名的一段童言。</p>\n<p>被问到以后想不想结婚，他用那种边想边补充的、特有的慢吞吞方式解释：他不确定，因为他<strong>&quot;不喜欢吃青菜&quot;</strong>——要是有了老婆，老婆做什么他就得吃什么，万一她做青菜，他就得吃，可他不喜欢吃青菜（Daily Mail，2026；Entertainment Daily，2026；TV Guide UK，2026）。这段话后来每七年被重播一次，一直到《70 Up》。</p>\n<p>注意：资料里<strong>没有</strong>保罗 7 岁时明确的职业理想——不像托尼想当骑师、尼尔想当宇航员那么清楚。他 7 岁的材料是关系型的：对家庭、婚姻、吃饭的焦虑。一个从小没稳定家庭的孩子，想的全是&quot;家会是什么样&quot;。</p>\n<p>按&quot;七岁看老&quot;的逻辑，这个焦虑的、机构里长大的孩子，应该是&quot;最没指望&quot;的一个。后来的事证明这个逻辑错得离谱。</p>\n"},{"age":14,"title":"14岁 ——《7 Plus Seven》（1970）","html":"<p>两集之间，保罗的人生彻底变了。他<strong>约 8 岁离开儿童之家</strong>（Entertainment Daily，2026），&quot;《Seven Up!》之后不久&quot;，父亲和继母把全家<strong>搬去了澳洲</strong>（Wikipedia，2026）——Daily Mail（2026）明确说是和父亲、兄弟一起走的。时间约在 1965 年，他八九岁（确切年份无资料，记约数）。</p>\n<p>14 岁的保罗在澳洲被拍到：还是不自信，&quot;表达自己很费劲&quot;（Entertainment Daily，2026；Daily Mail，2026）。儿童之家的那些年，在他身上留下了明显的怯。从此他的人生就在澳洲了——墨尔本一带，一住就是六十年。</p>\n"},{"age":21,"title":"21岁 ——《21 Up》（1977）","html":"<p>21 岁是保罗的转折集。留着长头发，身边有了女朋友 <strong>Sue</strong>——就是他后来结了 48 年婚的那位（Wikipedia，2026）。人还是那个内向的人（&quot;表达感情很费劲&quot;，Entertainment Daily，2026），但肉眼可见地开心了。</p>\n<p>他留下了一句全系列最动人的自我总结：<strong>&quot;事情都顺过来了。我开始享受生活了。我开始觉得，我不是个没用的人（no-hoper）。我觉得我一直是这么看自己的&quot;</strong>（Entertainment Daily，2026）。一个 7 岁时眼神躲闪的孩子，21 岁第一次敢说&quot;我不是没用的人&quot;——这句话的分量，放在整个系列里看才懂。</p>\n<p>工作上，离开学校后他当了<strong>泥瓦匠</strong>，后来自己开了建筑上的小生意（Wikipedia，2026；Daily Mail，2026）。这一集还有他和西蒙的第一次镜头重聚——两个儿童之家男孩的 találkozó，后来在《49 Up》《63 Up》又重演了两次（Wikipedia，2026）。</p>\n<p>他和节目的关系从这里起就定了：一直配合，从不闹别扭。不像有人骂 Apted、有人退赛，保罗 62 年，一集没落。</p>\n"},{"age":28,"title":"28岁 ——《28 Up》（1984）","html":"<p>28 岁的保罗：1978 年和 Sue 结了婚，两个孩子（Daily Mail，2026；IMDb，2026），在墨尔本一带安顿下来。工作还是泥瓦匠、自己的小生意（Wikipedia，2026）。</p>\n<p>这一集没有保罗的详细记载——他的弧线在这个阶段是&quot;成家&quot;，不是&quot; drama&quot;。顺带辟个谣：有传言说他结过不止一次婚，<strong>没有任何证据</strong>。所有资料都只记载了一段婚姻：1978 年娶 Sue，至今（IMDb，2026；Wikipedia，2026；Daily Mail，2026）。那个传言很可能是跟别人搞混了。</p>\n"},{"age":35,"title":"35岁 ——《35 Up》（1991）","html":"<p>35 岁这一集，保罗的公开细节很薄：还住在墨尔本，还和 Sue 在婚姻里，两个孩子在长大（Wikipedia，2026；IMDb，2026）。参与一集没落。他的&quot;稳&quot;本身就是故事——当别人的线在打结（尼尔流浪、杰基离婚），他的线一直是直的。</p>\n"},{"age":42,"title":"42岁 ——《42 Up》（1998）","html":"<p>42 岁同样缺少颗粒度。Wikipedia 的系列总结把他的泥瓦匠和自营生意阶段放在&quot;离开学校后&quot;一直延续到这个年代（Wikipedia，2026）。没有记载婚姻变动、搬家、健康事件。还是那句话：他的平稳就是他的故事。</p>\n"},{"age":49,"title":"49岁 ——《49 Up》（2005）","html":"<p>到《49 Up》，保罗从一线建筑退下来，进了一家<strong>招牌制作公司</strong>（Wikipedia，2026）。这一集又有他和西蒙的重聚——节目组把保罗从澳洲飞回来，拍了两人相处的段落（Wikipedia，2026）。还是和 Sue 在婚姻里，孩子大了，还在墨尔本。</p>\n"},{"age":56,"title":"56岁 ——《56 Up》（2012）","html":"<p>56 岁，保罗和妻子 Susan 一起去了一家<strong>本地养老村</strong>工作：他负责修修补补——小单元房和花园的杂活维护（Wikipedia，2026）。Daily Mail（2026）也确认了这段维修工的履历。从泥瓦匠到养老村维修工，六十年绕了一圈，还是动手、还是 locally、还是踏实。</p>\n<p>家庭：还是和 Sue；两个孩子；孙辈开始出现了（TV Guide UK，2026 在《70 Up》时确认&quot;好几个孙辈&quot;）。</p>\n"},{"age":63,"title":"63岁 ——《63 Up》（2019）","html":"<p>《63 Up》把保罗和西蒙的重聚做成了第三集的情感中心：两个儿童之家的男孩，<strong>在保罗的澳洲家里重逢</strong>（Screen-Space，2019）。《TheWrap》（2019）的评论说，这是全片&quot;最动人&quot;的段落——&quot;儿童之家的幸存者保罗和西蒙，隔着一个大洲也没断了偶尔的团聚&quot;，两人谈从&quot;破碎的原生家庭&quot;走出来、再经营好自己的小家，&quot;让人喉头一哽&quot;。NPR（2019）说：&quot;他和保罗在两位好女人的支持下取得的一切，按任何标准衡量都了不起。&quot;《Film Comment》（2019）提到，两人都说儿童之家&quot;管得很严&quot;（regimented），短期看留下的是&quot;缺自信、缺自我价值感&quot;，而不是情感封闭。评论人 Erik Lundegaard（2019）形容保罗：&quot;小时候温和，在澳洲当祖父时也温和。&quot;</p>\n<p>没有新的婚姻、离婚、疾病、危机。就还是那个保罗。</p>\n<p>《63 Up》是 Apted 执导的最后一集（他 2021 年 1 月去世）。没找到保罗在 63 岁时专门评价 Apted 的公开记录——他和这个项目的关系，就是六十二年安静的配合。</p>\n"},{"age":70,"title":"70岁 ——《70 Up》（2026）","html":"<p>保罗<strong>活着</strong>，参加了终章。IMDb（2026）把他列为《70 Up》参与者，BBC（2026）的重聚照片里有他。这个系列的两次死亡是林恩（2013）和尼克（2023）——没有保罗（The Sun，2026；BBC，2026）。</p>\n<p>终章是第十集、也是最后一集：Asif Kapadia 执导（《艾米》《塞纳》的导演，自称《Up》是他最爱的纪录片），2026 年 9 月 15 日和 22 日在 ITV1 和 ITVX 播出，两集 90 分钟（Radio Times，2026；Wikipedia，2026）。</p>\n<p>70 岁的保罗：</p>\n<ul>\n<li><strong>住</strong>：还在澳洲，墨尔本一带，住了六十年了（Wikipedia，2026；The Sun，2026）。</li>\n<li><strong>婚姻</strong>：还是和 Sue——到 2026 年 <strong>48 年</strong>（Daily Mail，2026）。电视报道说两人&quot;四十年了还幸福地在一起&quot;（Entertainment Daily，2026）。</li>\n<li><strong>孩子</strong>：两个（IMDb，2026；Daily Mail，2026）；《70 Up》里他是&quot;围着好几个孙辈转&quot;的祖父（Entertainment Daily，2026；TV Guide UK，2026）。ITV 自己的节目介绍叫他&quot;腼腆的保罗，如今当了祖父&quot;（经 Hello Rayo，2026，转引 ITV）。</li>\n<li><strong>工作/退休</strong>：没找到他谈退休的原话。最后有记载的工作是《56 Up》时的养老村维修。70 岁大概率退休或半退休——<strong>记&quot;无确证&quot;，不写死</strong>。</li>\n<li><strong>健康</strong>：没有任何一集公开过他的健康问题。不像杰基的关节炎、托尼的肺栓塞、尼克的癌、林恩的病，保罗的健康史在系列里是空白——<strong>记&quot;无公开报道&quot;，不等于&quot;没病过&quot;</strong>。</li>\n<p><strong>他的告别词</strong>。终章播出前，ITV 放出了保罗的临别赠言——算是那个怕青菜的男孩的收官（TV Guide UK，2026；Daily Mail，2026）。大意是：人得有个好家庭，为自己，也为让人生完整；说到约十年前去世的父亲时他哽咽了——&quot;他把我们养大，是个好人……他尽了他最大的努力，在我看来，他做得很好&quot;；他劝观众&quot;学着善良，学着原谅别人的不好&quot;，&quot;诚实地过好每一天&quot;，&quot;你的家庭越幸福，这份幸福传得越远，越变越大&quot;。</p>\n<p><strong>孤独、幸福、遗憾</strong>。看不到孤独的证据：48 年的婚姻、孩子、孙辈。他的弧线就是系列自己的判词：从 21 岁的&quot;我不是没用的人&quot;，到 70 岁知足的祖父。<strong>遗憾</strong>：没有任何资料把具体的遗憾安到他头上（注：2026 年 Wikipedia 里&quot;放弃骑马是最大遗憾&quot;那句，说的是<strong>托尼</strong>，不是保罗——别搞混）。<strong>对死亡</strong>：没找到他谈死亡的原话；有的是他在《70 Up》里为父亲流露的思念。<strong>对 7 岁的自己</strong>：没找到原话，但他 70 岁的&quot;家人与宽恕&quot;，可以看作那个焦虑男孩的问题的老年答案——这是解读，不是引文，照实说明。<strong>对 Apted 和节目</strong>：保罗说过，是《Up》系列帮他修复了和<strong>疏远的母亲</strong>的关系——每七年回英国拍摄，让母子
