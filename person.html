<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>人物 · 《人生七年》</title><meta name="description" content="14 个人，63 年人生"><style>*{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#faf7f0;--ink:#22252a;--muted:#6b6f76;--accent:#1d4e89;--line:#e4ddcf;--card:#fffdf8}

.person-head{text-align:center;padding:40px 0 10px}

.person-head .en{color:var(--muted)}

details.src{margin-top:30px}details.src summary{cursor:pointer;color:var(--muted)}

<script>
const DATA={"andrew":{"id":"andrew","name":"安德鲁·布拉克菲尔德","en":"Andrew Brackfield","nickname":"人生按剧本走的精英律师","avatar":"avatars/andrew.jpg","summary":"一个7岁时就能背出自己一生的孩子，几乎一字不差地兑现了预言——查特豪斯公学、剑桥、律师事务所合伙人、同一个人生的妻子48年；63岁后才第一次承认，这份完美的人生，代价是孩子们长大的那些年他不在场。","class7":"伦敦肯辛顿富裕家庭的男孩，英国阶层顶端的起跑线","education":"肯辛顿预备学校 → 查特豪斯公学（Charterhouse）→ 剑桥大学（三一学院）","career":"事务律师（solicitor），做到律师事务所合伙人","marriage":"与简（Jane）结婚近48年（约1978年起），未离","children":"两个儿子","turning":"49岁时一度传出辞去律师工作、改建谷仓想换活法（说法有冲突，未定论）","status70":"退休，与妻子同住，对少年时的自己感到惭愧，最大的遗憾是工作挤掉了陪孩子的时间","alive":true,"tags":["精英家庭","上大学","退休"],"short":true,"resume":"<ul>\n<li><strong>7岁（1964）</strong>：伦敦肯辛顿预备学校学生，镜头前说自己看《金融时报》，和两个同伴用拉丁语唱歌。</li>\n<li><strong>14岁（1970）</strong>：在查特豪斯公学读书，沿着预备学校→公学→牛剑的既定路线前进。</li>\n<li><strong>21岁（1977）</strong>：剑桥大学读书；三人组里唯一&quot;梦想没碎&quot;的人，因为那本来就是日程表。</li>\n<li><strong>28岁（1984）</strong>：走上事务律师之路，约1978年与简结婚；同年约翰第一次拒绝参演。</li>\n<li><strong>35岁（1991）</strong>：已是律所合伙人，婚姻家庭安顿；约翰称节目是&quot;生命里的一颗小毒丸&quot;。</li>\n<li><strong>42岁（1998）</strong>：合伙人，与简结婚超15年，两个儿子，大儿子准备进查特豪斯。</li>\n<li><strong>49岁（2005）</strong>：有说法称他辞职改建谷仓想换活法，但与官方资料冲突，未定论。</li>\n<li><strong>56岁（2012）</strong>：官方资料称仍在法律界工作，两个儿子，从未缺席任何一部。</li>\n<li><strong>63岁（2019）</strong>：考虑退休，自称&quot;幸福而充实&quot;，但承认工作挤掉了陪孩子的时间。</li>\n<li><strong>70岁（2026）</strong>：已退休，仍与简在一起；说希望孩子们长大时自己能多陪陪他们。</li>\n</ul>\n","verdict":"<p>安德鲁让&quot;七岁看老&quot;显得最成立：7岁时的笃定，70岁原样保留——同一职业、同一妻子、每七年准时坐在镜头前。他的人生几乎没有转折，唯一的裂缝是49岁那则真假难辨的&quot;辞职改建谷仓&quot;传闻。他对自己一生的评价集中在晚年：为年轻时那个趾高气扬的小孩羞愧，后悔工作挤掉了陪伴。他留给观众的不是成功学，而是一种安静的诚实——把63年活成一条直线的人，最后承认直线也有代价。</p>\n","verdictTitle":"他的一生","intro":"<p>7岁时就能背出自己一生的肯辛顿男孩，几乎一字不差地兑现了预言：查特豪斯、剑桥、律师事务所合伙人、同一段婚姻48年，14人里唯一十部全勤。但63岁后他第一次承认，这份完美人生的代价，是孩子们长大的那些年他不在场。</p>\n","background":"","ages":[],"compare":null,"conclusion":"","sources":""},"john":{"id":"john","name":"约翰·布里斯比","en":"John Brisby","nickname":"最不买账的御用大律师","avatar":"avatars/john.jpg","summary":"7岁时全国人民眼里的\"小势利鬼\"，长大后成了英国顶尖商事大律师（御用大律师）；他是全系列里唯一敢在终章镜头前说\"我从来没喜欢过迈克尔·阿普特德\"的人，用了63年证明节目组把他拍错了。","class7":"伦敦肯辛顿富裕家庭男孩，父亲9岁时去世，母亲是保加利亚人","education":"肯辛顿预备学校 → 威斯敏斯特公学（Westminster）→ 牛津大学基督堂学院（读法律）","career":"出庭大律师（barrister），1996年获御用大律师（KC）头衔；\"保加利亚之友\"慈善会主席","marriage":"1985年娶克莱尔·洛根（英国前驻保加利亚大使之女），未离","children":"无公开记录","turning":"28岁和42岁两次拒绝参演；35岁起要求永不由阿普特德采访；把节目称为\"生命里的一颗小毒丸\"","status70":"仍在执业的大律师，投身保加利亚慈善，在终章与节目彻底\"算账\"","alive":true,"tags":["精英家庭","上大学","退出过节目","退休"],"short":true,"resume":"<ul>\n<li><strong>7岁（1964）</strong>：肯辛顿男孩，大谈《泰晤士报》、为私立学校辩护，说女孩会让男孩分心。</li>\n<li><strong>14岁（1970）</strong>：开始大谈政治，宣称志向是&quot;政治权力&quot;，&quot;小傲慢鬼&quot;形象被焊死。</li>\n<li><strong>21岁（1977）</strong>：牛津基督堂学院读法律最后一年，穿三件套西装，自信扎眼。</li>\n<li><strong>28岁（1984）</strong>：1978年已取得出庭大律师资格；第一次拒绝参演，不满前三部对自己的呈现。</li>\n<li><strong>35岁（1991）</strong>：有条件回归：永不由阿普特德采访、必须拍慈善工作；称节目是&quot;小毒丸&quot;。约1985年娶克莱尔·洛根。</li>\n<li><strong>42岁（1998）</strong>：第二次缺席；全系列唯一在BBC One播出的一集他没有出现。</li>\n<li><strong>49岁（2005）</strong>：回归并解释原因；1996年已获御用大律师（KC）头衔。</li>\n<li><strong>56岁（2012）</strong>：正面反驳阶级标签：9岁丧父、母亲打工供读书、牛津靠奖学金。</li>\n<li><strong>63岁（2019）</strong>：被形容为&quot;谦逊、富有同情心&quot;，把时间投入巴尔干慈善；阿普特德最后一集。</li>\n<li><strong>70岁（2026）</strong>：仍在4 Stone Buildings执业，任&quot;保加利亚之友&quot;主席；终章清算：&quot;我从来没喜欢过迈克尔，他要的是一个假的我。&quot;</li>\n</ul>\n","verdict":"<p>约翰的人生是&quot;预言应验&quot;和&quot;标签错误&quot;的叠加：7岁的伶牙俐齿确实长成了&quot;凶猛的交叉盘问者&quot;，但节目组剪掉的&quot;9岁丧父、移民母亲打工、奖学金&quot;才是他真正的底色。他命运最大的变化不是职业，而是与镜头的敌对程度——从享受镜头，到谈判、设条件、清算。他留给观众的核心印象是愤怒的诚实：一个被钉成&quot;阶级反派&quot;的人，用63年证明，镜头认错了人。</p>\n","verdictTitle":"他的一生","intro":"<p>7岁时全国人民眼里的&quot;小势利鬼&quot;，长大后成了英国顶尖商事大律师；他是唯一敢在终章镜头前说&quot;我从来没喜欢过迈克尔·阿普特德&quot;的人，用63年证明节目组把他拍错了。</p>\n","background":"","ages":[],"compare":null,"conclusion":"","sources":""},"charles":{"id":"charles","name":"查尔斯·弗诺","en":"Charles Furneaux","nickname":"拒绝了半个世纪的幕后人","avatar":"avatars/charles.jpg","summary":"7岁时被钉上\"肯辛顿三公子\"标签的男孩，21岁拍完《21 Up》就转身离开，此后49年拒绝一切采访和出镜，却在幕后成了英国最顶尖的纪录片制作人之一（监制过拿下BAFTA的《触摸虚空》）；2026年终章，他时隔49年开口——只出声音、不露脸。","class7":"伦敦肯辛顿富裕家庭男孩，三人组里\"最不合群的第三个\"","education":"肯辛顿预备学校 → 马尔伯勒公学（Marlborough）→ 杜伦大学（现代史，1978年毕业）→ 牛津读研","career":"纪录片导演/制片人：BBC、Channel 4 委托编辑、Talkback Thames 纪实部门主管；创办 Kaboom Film & TV；约2017年退休","marriage":"与乔斯琳·安·詹姆斯（Jocelyn Ann James）结婚（据IMDb类来源称1990年起），育有二孩（单一来源，未完全证实）","children":"两个孩子（单一IMDb类来源，未完全证实）","turning":"21岁后彻底退出节目49年；2026年《70 Up》以画外音+遮脸登山照片回归","status70":"退休纪录片制片人，热爱登山，70岁终章只献声不露面","alive":true,"tags":["精英家庭","上大学","退出过节目","退休"],"short":true,"resume":"<ul>\n<li><strong>7岁（1964）</strong>：三个肯辛顿男孩之一，探身追问约翰&quot;最喜欢报纸什么&quot;——像个本能的采访者。</li>\n<li><strong>14岁（1970）</strong>：公开记录空白，少年时期的资料系统性缺失。</li>\n<li><strong>21岁（1977）</strong>：杜伦大学读现代史，庆幸避开&quot;牛津剑桥传送带&quot;；最后一次完整出镜。</li>\n<li><strong>28岁（1984）</strong>：拒绝《28 Up》，与阿普特德决裂；开始在电视圈学习怎么做节目。</li>\n<li><strong>35岁（1991）</strong>：缺席；在电视圈上升，1988–92年做15集《Panorama》制片人。</li>\n<li><strong>42岁（1998）</strong>：缺席；BBC导演，1994年起任Channel 4委托编辑。</li>\n<li><strong>49岁（2005）</strong>：缺席；2003年任Talkback Thames纪实部门主管，监制《触摸虚空》获BAFTA。</li>\n<li><strong>56岁（2012）</strong>：缺席；2007年创办Kaboom Film &amp; TV，曾试图起诉删掉档案里的自己。</li>\n<li><strong>63岁（2019）</strong>：缺席；监制《戴安娜：她的自述》创Channel 4收视纪录，约2017年退休。</li>\n<li><strong>70岁（2026）</strong>：时隔49年回归终章，只献画外音，登山照片故意遮脸；热爱登山，已退休。</li>\n</ul>\n","verdict":"<p>查尔斯的人生是全系列最大的反转：拒绝被拍的人，成了最懂怎么拍的人。他对命运的看法很明确——&quot;电视会对人做什么，这是个问题&quot;，而他选择用&quot;不&quot;来回答。他最大的变化是和镜头的权力关系：7岁时被稀里糊涂地拍，70岁时连一个像素都由自己控制。他留给观众的印象是：人是可以说&quot;不&quot;的，哪怕对方是这个系列本身。</p>\n","verdictTitle":"他的一生","intro":"<p>7岁时被钉上&quot;肯辛顿三公子&quot;标签的男孩，21岁拍完《21 Up》就转身离开，此后49年拒绝一切出镜，却在幕后成了英国顶尖纪录片制作人；2026年终章他时隔49年开口——只出声音、不露脸。</p>\n","background":"","ages":[],"compare":null,"conclusion":"","sources":""},"suzy":{"id":"suzy","name":"苏西·拉斯克","en":"Suzy Lusk","nickname":"不情愿的富家女孩","avatar":"avatars/suzy.jpg","summary":"全系列唯一的富家女孩：7岁是练芭蕾、想要\"两个孩子加一个保姆\"的小淑女，21岁变成镜头前不停抽烟、对婚姻嗤之以鼻的愤青；28岁结婚后整个人翻了篇——48年婚姻、三个孩子、四十多岁转行做丧亲辅导员；她恨了这节目63年，63岁那集直接罢演，70岁终章却为了去世的尼克回来了。","class7":"伦敦富裕家庭女孩，系列里唯一的\"富家女\"","education":"伦敦私立走读学校，16岁辍学","career":"全职母亲多年；四十多岁转行做丧亲辅导员（bereavement counsellor）","marriage":"约1978–79年（22岁）嫁事务律师鲁珀特·杜威（Rupert Dewey），48年未离","children":"三个孩子（两子一女）","turning":"28岁结婚彻底扭转人生；父亲去世促使她转行做丧亲辅导员","status70":"身体\"还不错\"，与丈夫同住乡下，70岁终章回归并第一次决定看这部片子","alive":true,"tags":["精英家庭","没上大学","退出过节目","退休"],"short":true,"resume":"<ul>\n<li><strong>7岁（1964）</strong>：伦敦私立学校的芭蕾女孩，想要&quot;两个孩子，再加一个保姆&quot;。</li>\n<li><strong>14岁（1970）</strong>：青春期阴郁，称节目&quot;又没劲又蠢&quot;；父母在这前后离婚。</li>\n<li><strong>21岁（1977）</strong>：16岁辍学去巴黎，镜头前不停抽烟，宣称对婚姻&quot;非常非常 cynical&quot;。</li>\n<li><strong>28岁（1984）</strong>：约1978–79年嫁事务律师鲁珀特·杜威，已有两个儿子，称婚姻带来幸福。</li>\n<li><strong>35岁（1991）</strong>：三个孩子（两子一女）的母亲，自信爱笑，与21岁判若两人。</li>\n<li><strong>42岁（1998）</strong>：幸福的已婚母亲，住乡下，公开细节很少。</li>\n<li><strong>49岁（2005）</strong>：宣布这可能是最后一集；四十多岁丧父后转行做丧亲辅导员。</li>\n<li><strong>56岁（2012）</strong>：&quot;出于义务&quot;回来，称节目是&quot;再烂也要读完的烂书&quot;；与尼克成邮件笔友。</li>\n<li><strong>63岁（2019）</strong>：罢演，阿普特德用别人手机打电话都被她挂掉。</li>\n<li><strong>70岁（2026）</strong>：为去世的尼克回归；48年婚姻仍在，自述身体&quot;还不错&quot;，发誓这辈子第一次看这部片子。</li>\n</ul>\n","verdict":"<p>苏西用63年反抗7岁时被贴的&quot;富家女&quot;标签，但系列唯一说准她的一件事——想要家庭的孩子会去建造家庭——成了她成年生活的全部：48年婚姻、三个孩子、从没请过保姆。她命运最大的变化是28岁的婚姻，像一道分水岭：之前是垮掉的愤青，之后是安顿的母亲。她留给观众的印象是&quot;不配合的诚实&quot;：恨了节目一辈子，最后却为了一个朋友回来，并决定第一次把它看完。</p>\n","verdictTitle":"她的一生","intro":"<p>全系列唯一的富家女孩：7岁是想要&quot;两个孩子加一个保姆&quot;的小淑女，21岁变成镜头前不停抽烟、对婚姻嗤之以鼻的愤青；28岁结婚后整个人翻了篇——48年婚姻、三个孩子、四十多岁转行做丧亲辅导员；她恨了这节目63年，70岁终章却为了去世的尼克回来了。</p>\n","background":"","ages":[],"compare":null,"conclusion":"","sources":""},"jackie":{"id":"jackie","name":"杰基·巴塞特","en":"Jackie Bassett","nickname":"向导演开火的东区妈妈","avatar":"avatars/jackie.jpg","summary":"一个7岁时靠话痨被选中的东区女孩，成年后离婚、丧母、患类风湿性关节炎、伴侣在癌症治疗期间车祸离世，却几十年敢当面质问导演的性别偏见；70岁搬到诺福克海岸重新开始，自称过着\"第二次童年\"，是\"很久以来最快乐\"的时候。","class7":"伦敦东区 Bethnal Green 的工人阶级家庭","education":"Susan Lawrence 小学，之后上综合学校；没上大学，一生遗憾没继续读书","career":"保险文员→帮父母经营酒吧→秘书；1998年起因类风湿性关节炎领残障补助","marriage":"19岁第一次结婚，后离婚；与伴侣 Ian 生两子，Ian 于2012年去世；现伴侣 Eddie（退休游泳教练）","children":"三个儿子（Charlie 与 Ian 的两个儿子），六个孙辈","turning":"30岁丧母、离婚；40岁确诊类风湿性关节炎；2012年伴侣 Ian 在癌症治疗期间车祸去世","status70":"搬到诺福克海岸的退休公寓，\"第二次童年\"；自称很久以来最快乐","alive":true,"tags":["工薪阶层","没上大学","离婚","有孙辈","退休"],"short":true,"resume":"<ul>\n<li><strong>7岁（1964）</strong>：东区Bethnal Green女孩，话最多；想嫁&quot;有点钱但不太有钱&quot;的男孩。</li>\n<li><strong>14岁（1970）</strong>：公开记录空白；节目组已开始只问女孩婚姻问题。</li>\n<li><strong>21岁（1977）</strong>：19岁结婚，Essex买房；因导演追问婚前恋爱史当场翻脸走人。</li>\n<li><strong>28岁（1984）</strong>：金融城保险文员转帮父母经营酒吧；第一次婚姻还没结束。</li>\n<li><strong>35岁（1991）</strong>：离婚，大儿子出生；30岁丧母后搬去苏格兰Motherwell。</li>\n<li><strong>42岁（1998）</strong>：单亲妈妈带三个儿子，住市议会公寓；约40岁确诊类风湿性关节炎。</li>\n<li><strong>49岁（2005）</strong>：当面把憋28年的话说给导演：你不会问男人这种问题；立志回学校读书。</li>\n<li><strong>56岁（2012）</strong>：领残障补助，伴侣Ian在癌症治疗期间车祸去世；人生最惨的一集。</li>\n<li><strong>63岁（2019）</strong>：五个孩子的奶奶；质问导演为何不问女性对国家的看法。</li>\n<li><strong>70岁（2026）</strong>：搬到诺福克海岸退休公寓，&quot;第二次童年&quot;；与旧识Eddie重逢，六个孙辈。</li>\n</ul>\n","verdict":"<p>杰基的人生是&quot;没人给她定路，所以格外跌宕&quot;：离婚、丧母、疾病、伴侣横死，没上过大学、领了十几年补助。她怎么看自己？她说&quot;别人有金钱的优势，但我们有自由&quot;。她命运最大的变化不是境遇，而是位置——从被问&quot;嫁什么样的男人&quot;的女孩，变成替所有女性参与者要平等提问权的人。她留给观众的印象是：把&quot;敢说话&quot;活成了一种人生，70岁在海边说，自己正过&quot;第二次童年&quot;。</p>\n","verdictTitle":"她的一生","intro":"<p>7岁时靠&quot;嘴不停&quot;被选中的东区女孩，成年后离婚、丧母、患类风湿性关节炎、伴侣离奇去世，却几十年敢当面质问导演的性别偏见；70岁搬到诺福克海岸，自称过着&quot;第二次童年&quot;。</p>\n","background":"","ages":[],"compare":null,"conclusion":"","sources":""},"lynn":{"id":"lynn","name":"林恩·约翰逊","en":"Lynn Johnson","nickname":"最早离场的老好人","avatar":"avatars/lynn.jpg","summary":"14 人里最稳的一个：7 岁说长大要去 Woolworths 当售货员，21 岁开着流动图书馆车给孩子们送书，在同一个岗位干了三十年，19 岁结婚一次到老；却是 14 人里第一个去世的，2013 年 5 月病逝，终年 57 岁，《70 Up》里只剩下一把\"空椅子\"。","class7":"伦敦东区工人阶级家庭","education":"Susan Lawrence 小学；考上文法学校（grammar school），三个女孩里学历起点最高","career":"儿童流动图书馆管理员（开图书馆车下乡送书）约三十年；预算削减后被裁员","marriage":"19 岁嫁给 Russ，一生一次婚姻，视他为灵魂伴侣","children":"两个女儿；三个孙辈","turning":"流动图书馆被砍、56 岁正式失业——干了一辈子的工作被紧缩政策终结；2013 年 5 月病逝","status70":"已于 2013 年 5 月去世（57 岁）；《70 Up》以\"空椅子\"纪念她","alive":false,"tags":["工薪阶层","没上大学","已去世","有孙辈"],"short":true,"resume":"<ul>\n<li><strong>7岁（1964）</strong>：东区小学生，说长大&quot;要去Woolworths工作&quot;，说得特别笃定。</li>\n<li><strong>14岁（1970）</strong>：考上文法学校（三个女孩里学历起点最高）；谈母亲参加过罢工。</li>\n<li><strong>21岁（1977）</strong>：19岁嫁Russ；开&quot;流动学校图书馆&quot;车给东区孩子送书。</li>\n<li><strong>28岁（1984）</strong>：两个女儿出生，图书管理员工作稳定，无大事发生。</li>\n<li><strong>35岁（1991）</strong>：&quot;稳定的对照组&quot;，衬托同伴们的动荡；仍在图书馆一线。</li>\n<li><strong>42岁（1998）</strong>：流动图书馆一干三十年；两个女儿长大。</li>\n<li><strong>49岁（2005）</strong>：流动图书馆服务被砍，转去学校图书馆；为公共服务预算发声。</li>\n<li><strong>56岁（2012）</strong>：预算削减失业，提前领养老金；母校兼职校董会主席25年；最后一次出镜。</li>\n<li><strong>63岁（2019）</strong>：已去世六年；节目用档案影像+丈夫女儿采访纪念，图书馆以她命名。</li>\n<li><strong>70岁（2026）</strong>：2013年5月病逝，57岁；终章里她是&quot;一把空椅子&quot;，被朋友们怀念。</li>\n</ul>\n","verdict":"<p>林恩证明了&quot;七岁看老&quot;最朴素的版本：知足、直率、守得住——工作三十年、婚姻一生、朋友一辈子，7岁到56岁几乎没变。她怎么看自己？21岁时她说&quot;我差不多做了所有我想做的事&quot;。她命运最大的变化其实是离场本身：看起来最稳的人第一个走，让所有人第一次意识到，这个系列不只是关于阶级和选择，也是关于死亡。她留给观众的印象，是紧缩时代里一个图书管理员的尊严。</p>\n","verdictTitle":"她的一生","intro":"<p>14人里最稳的一个：7岁说长大要去Woolworths当售货员，21岁开着流动图书馆车给孩子们送书，一干三十年，19岁结婚一次到老；却是最早离场的一个，2013年5月病逝，终年57岁。</p>\n","background":"","ages":[],"compare":null,"conclusion":"","sources":""},"sue":{"id":"sue","name":"苏·戴维斯","en":"Sue Davis（现名 Sue Fitzgerald）","nickname":"最爱这节目的幸运儿","avatar":"avatars/sue.jpg","summary":"三个东区女孩里最爱笑、也最爱这个节目的一个：没上过大学，却从秘书一路做到伦敦玛丽女王大学法学院的行政负责人，能站在 600 人的讲堂上讲话；35 岁离婚后单身带大两个孩子，与 Glenn 订婚 22 年后 2020 年结婚；70 岁退休搬到 Essex，自称\"除了离婚，人生一直平衡得不错\"。","class7":"伦敦东区工人阶级家庭，父母是市议会公房租户","education":"Susan Lawrence 小学，之后上综合学校；没上大学——后来却在大学里工作了几十年","career":"秘书起家→伦敦玛丽女王大学法学院行政部门负责人（主管法律课程）","marriage":"24 岁嫁给 Billy，35 岁离婚；与 Glenn Fitzgerald 订婚 22 年，2020 年结婚，改姓 Fitzgerald","children":"一子一女（William 和 Kathryn），均已四十多岁","turning":"35 岁离婚后单身带两孩子重返职场，从秘书一步步做到大学行政负责人","status70":"约 2025 年退休，与 Glenn 搬到 Essex；正在找志愿者工作，自称退休后\"有点找不着北\"","alive":true,"tags":["工薪阶层","没上大学","离婚","再婚","退休"],"short":true,"resume":"<ul>\n<li><strong>7岁（1964）</strong>：东区Susan Lawrence小学的外向女孩；三个女孩里&quot;外向的那个&quot;。</li>\n<li><strong>14岁（1970）</strong>：许愿&quot;知足，知道自己往哪儿去，能温柔地回望做过的事&quot;——70岁亲口认领。</li>\n<li><strong>21岁（1977）</strong>：当秘书；因导演反复追问婚事，当众翻脸走人。</li>\n<li><strong>28岁（1984）</strong>：24岁嫁Billy，辞职生下一子一女，全职妈妈。</li>\n<li><strong>35岁（1991）</strong>：离婚；&quot;任何破裂都让人难过，但我们还是朋友&quot;。</li>\n<li><strong>42岁（1998）</strong>：单亲妈妈重返职场，一个人养全家；结识Glenn，&quot;还早着呢&quot;。</li>\n<li><strong>49岁（2005）</strong>：与Glenn在一起七年；进入玛丽女王大学法学院行政部门。</li>\n<li><strong>56岁（2012）</strong>：订婚14年；站上600人讲堂讲话，被导演称为&quot;成功故事&quot;。</li>\n<li><strong>63岁（2019）</strong>：订婚21年&quot;已知最长&quot;；林恩去世后三个女孩第一次凑不齐。</li>\n<li><strong>70岁（2026）</strong>：2020年与Glenn结婚改姓Fitzgerald；约2025年退休搬到Essex，正在找志愿者工作。</li>\n</ul>\n","verdict":"<p>苏是&quot;七岁看老&quot;看对一半的例子：外向爱笑的性格7岁就定了，但人生的高度是她自己一层层加上去的——从&quot;同龄人里一个上大学的都不认识&quot;，到在大学法学院管了几十年行政。她怎么看自己？&quot;除了离婚，我的人生一直平衡得不错&quot;；14岁的愿望&quot;知足&quot;，70岁认领。她命运最大的变化是42岁离婚后重返职场那一步。她留给观众的印象，是14人里最以节目为傲的人：&quot;要说我有什么特别，就是参与了这个了不起的系列。&quot;</p>\n","verdictTitle":"她的一生","intro":"<p>三个东区女孩里最开朗、也最爱这个节目的一个：没上过大学，却从秘书一路做到伦敦玛丽女王大学法学院行政负责人；35岁离婚单身带大两个孩子，与Glenn订婚22年后2020年结婚；70岁自称&quot;除了离婚，人生一直平衡得不错&quot;。</p>\n","background":"","ages":[],"compare":null,"conclusion":"","sources":""},"paul":{"id":"paul","name":"保罗·克利格曼","en":"Paul Kligerman","nickname":"从儿童之家走到澳洲的建造者","avatar":"avatars/paul.jpg","summary":"14 个人里起点最低、结局最稳的一个：父母离异后住进儿童之家，8 岁随父亲移民澳洲；21 岁时说\"我总觉得自己是个没用的人\"，后来当泥瓦匠、白手起家做建筑生意；1978 年结婚，一次婚结了 48 年没离，是全系列唯一没离过婚的人；70 岁在墨尔本附近当祖父，留给观众的话是\"善良，宽恕，诚实地活\"。","class7":"父母离异后住进儿童之家的孩子（系列里\"一无所有\"的那一端）","education":"具体学校无公开资料；8 岁移民澳洲后在当地上学","career":"泥瓦匠→自己的建筑公司→招牌制作公司→与妻子一起在养老村做维修","marriage":"1978 年与 Sue（Susan）结婚，48 年无离异——14 人里唯一","children":"两个孩子；多个孙辈","turning":"8 岁离开儿童之家，随父亲、继母移居澳洲，人生从此换了一条跑道","status70":"住在墨尔本附近；祖父；可能是退休或半退休（无确证）；70 岁告别词谈家人与宽恕","alive":true,"tags":["儿童之家","没上大学","移民","有孙辈","退休"],"short":true,"resume":"<ul>\n<li><strong>7岁（1964）</strong>：住在伦敦 Twickenham 的 Shaftesbury 儿童之家；因&quot;不喜欢吃青菜&quot;而害怕结婚，留下全系列最著名的童言。</li>\n<li><strong>14岁（1970）</strong>：约 8 岁随父亲、继母移民澳洲，定居墨尔本一带；依然不自信，表达自己很费劲。</li>\n<li><strong>21岁（1977）</strong>：在澳洲当泥瓦匠；交了女友 Sue，第一次说&quot;我不是个没用的人&quot;。</li>\n<li><strong>28岁（1984）</strong>：1978 年与 Sue 结婚，育有两个孩子；自己开了建筑上的小生意。</li>\n<li><strong>35岁（1991）</strong>：在墨尔本安家，婚姻稳定，两个孩子长大；一集没落下。</li>\n<li><strong>42岁（1998）</strong>：继续泥瓦匠和自营生意；无婚姻变动、无搬家，平稳依旧。</li>\n<li><strong>49岁（2005）</strong>：从一线建筑退下，进招牌制作公司；节目组把他从澳洲飞回来与西蒙重聚拍摄。</li>\n<li><strong>56岁（2012）</strong>：和妻子 Susan 在本地养老村做维修工；孙辈开始出现。</li>\n<li><strong>63岁（2019）</strong>：与西蒙在澳洲家中重逢，成为《63 Up》里&quot;最动人&quot;的段落。</li>\n<li><strong>70岁（2026）</strong>：住墨尔本附近，48 年婚姻，儿孙绕膝；终章告别词谈家人、善良与宽恕，说到去世的父亲时哽咽。</li>\n</ul>\n","verdict":"<p>保罗 7 岁时是&quot;最没指望&quot;的孩子：父母离婚、妈妈离开、住进儿童之家，说话小声、眼神躲闪。8 岁那次移民是他人生唯一的换轨——从伦敦的机构，转到了墨尔本的阳光下。他没有学历、没有家底，靠泥瓦匠的手艺白手起家，21 岁遇到 Sue，1978 年结婚，一结就是 48 年。命运最大的变化不是发财，而是一句自我评价的翻转：21 岁&quot;我总觉得自己是个没用的人&quot;，70 岁成了儿孙绕膝、劝人&quot;善良、宽恕、诚实地活&quot;的祖父。他留给观众的核心印象是：起点最低的人，可以过得最完整；平稳本身，就是一种了不起。</p>\n","verdictTitle":"他的一生","intro":"<p>保罗是 14 个人里起点最低、结局最稳的一个：父母离异后住进儿童之家，8 岁随父亲移民澳洲，从泥瓦匠干起，1978 年结婚后 48 年没离过婚——成了全系列唯一一段婚姻走到底的人。他的人生是对&quot;七岁看老&quot;最安静的反驳。</p>\n","background":"","ages":[],"compare":null,"conclusion":"","sources":""},"symon":{"id":"symon","name":"西蒙·巴斯特菲尔德","en":"Symon Basterfield","nickname":"养过上百个孩子的父亲","avatar":"avatars/symon.jpg","summary":"14 人里唯一的混血孩子：父亲从未出现，母亲患抑郁症，他在儿童之家和母亲之间长大；7 岁想当电影明星，21 岁在香肠厂流水线上被导演问\"你觉得自己不值更好的吗\"；28 岁骄傲地给了五个孩子\"一个爸爸\"，中年离婚缺席一集，再婚后与妻子做了约 20 年寄养父母，照顾过 100 多名寄养儿童；70 岁最大的遗憾，是从没问清父亲是谁。","class7":"与保罗同一儿童之家的孩子；母亲患抑郁症，父亲从未出现","education":"具体学校无公开资料；56 岁时后悔没受过正规教育","career":"肉类冷冻厂→香肠厂流水线→仓库→希思罗货运仓库叉车司机→办公室工作","marriage":"早年娶 Yvonne，育有五个孩子，离婚（缺席《35 Up》）；再婚娶 Vienetta，育有一子 Daniel，并抚养继女","children":"六个孩子；12 个孙辈（\"还在增加\"）","turning":"49 岁与 Vienetta 开始做寄养父母——儿童之家的受助者，变成上百个孩子的给予者","status70":"与 Vienetta 住英国乡下，戴助听器；最大遗憾是从没问清父亲是谁","alive":true,"tags":["儿童之家","没上大学","离婚","再婚","有孙辈","退休"],"short":true,"resume":"<ul>\n<li><strong>7岁（1964）</strong>：与保罗同在 Shaftesbury 儿童之家；说长大想当电影明星。</li>\n<li><strong>14岁（1970）</strong>：已离开儿童之家和母亲同住；被问到父亲时说&quot;没有的东西，就不会想&quot;。</li>\n<li><strong>21岁（1977）</strong>：在肉类冷冻厂/香肠厂流水线工作；娶 Yvonne；被导演当面问&quot;你不值个更好的工作吗&quot;。</li>\n<li><strong>28岁（1984）</strong>：与 Yvonne 育有五个孩子；在镜头前骄傲地说给了孩子们&quot;一个爸爸&quot;。</li>\n<li><strong>35岁（1991）</strong>：与 Yvonne 婚姻破裂、走离婚程序，缺席本集——唯一缺席的一集。</li>\n<li><strong>42岁（1998）</strong>：再婚娶 Vienetta，育有一子 Daniel 并抚养继女，搬去 Essex；换了喜欢的办公室工作；前婚孩子不肯见他；母亲 1990 年病逝。</li>\n<li><strong>49岁（2005）</strong>：与 Vienetta 接受培训成为正式寄养父母；名下两套房含西班牙度假屋；与保罗第三次重聚拍摄。</li>\n<li><strong>56岁（2012）</strong>：在希思罗附近货运仓库当叉车司机；后悔没受过正规教育；继续做寄养父母。</li>\n<li><strong>63岁（2019）</strong>：与前婚孩子关系修复，有 10 个孙辈；和妻子飞去澳洲看保罗。</li>\n<li><strong>70岁（2026）</strong>：寄养过 120 多名儿童，有 12 个孙辈；戴着助听器说最后悔的是从没问清父亲是谁；说这个节目是&quot;一份礼物&quot;。</li>\n</ul>\n","verdict":"<p>西蒙的身世是 14 人里最不明的：父亲是个从没出现过的黑人（连哪国人都没确证），母亲是患抑郁症的白人女性，他在儿童之家&quot;管得很严&quot;的环境里长大。命运最大的变化发生在 49 岁：儿童之家养大的孩子，开始养儿童之家的孩子——他和妻子做了约 20 年寄养父母，把 28 岁时给五个孩子的&quot;一个爸爸&quot;，给了上百个没家的孩子。而 14 岁那句&quot;没有的东西就不会想&quot;，70 岁被他亲手推翻：&quot;我真希望当初问了。&quot;他留给观众的核心印象是慷慨：起点最低的人之一，最后成了 14 人里最慷慨的父亲；以及诚实——一个盔甲穿了 56 年的人，临了自己把它脱了下来。</p>\n","verdictTitle":"他的一生","intro":"<p>西蒙是 14 人里唯一的混血孩子：父亲从未出现，母亲患抑郁症，他在儿童之家和母亲之间长大；28 岁最骄傲的是给了五个孩子&quot;一个爸爸&quot;，再婚后与妻子做了约 20 年寄养父母，照顾过 100 多名寄养儿童。他这一生，是把&quot;缺&quot;活成&quot;给&quot;的过程。</p>\n","background":"","ages":[],"compare":null,"conclusion":"","sources":""},"neil":{"id":"neil","name":"尼尔·休斯","en":"Neil Hughes","nickname":"人生最跌宕的聪明男孩","avatar":"avatars/neil.jpg","summary":"7 岁时最聪明、最被看好的孩子之一，28 岁时却无家可归、在苏格兰高地流浪，42 岁起靠开放大学学位和地方政治慢慢爬回来，当了 21 年地方议员；70 岁时他独自住在法国一栋没有暖气的房子里，烧纸板取暖，自称“差不多是我这辈子能达到的最幸福状态”。","class7":"利物浦郊区中产家庭，父母都是教师","education":"阿伯丁大学辍学，后开放大学文学学士","career":"自民党地方议员（坎布里亚 21 年）、平信徒传道人","marriage":"短暂婚姻后分居","children":"无","turning":"28 岁无家可归；从流浪汉到当选地方议员","status70":"独居法国乡下，烧纸板取暖，每周半天书店义工","alive":true,"tags":["上大学","离婚","心理健康问题","移民","退休"],"short":true,"resume":"<ul>\n<li><strong>7岁（1964）</strong>：利物浦郊区中产家庭，父母都是教师；穿着粗呢大衣说&quot;长大要当宇航员&quot;。</li>\n<li><strong>14岁（1970）</strong>：性格大变，紧张焦虑；牛津入学考试失败；16 岁起患抑郁症。</li>\n<li><strong>21岁（1977）</strong>：阿伯丁大学第一学期退学，住伦敦占屋、建筑工地打零工；说&quot;想从政&quot;。</li>\n<li><strong>28岁（1984）</strong>：在苏格兰高地流浪，无家可归，靠救济金和驱赶松鸡的零工活着。</li>\n<li><strong>35岁（1991）</strong>：搬到设得兰群岛的公租房，在业余剧团写剧本、演哑剧。</li>\n<li><strong>42岁（1998）</strong>：回伦敦借住布鲁斯的公寓；开放大学拿到文学学士；当选哈克尼区议员。</li>\n<li><strong>49岁（2005）</strong>：搬去坎布里亚，2003 年当选伊登区议员；多次竞选国会议员均落败。</li>\n<li><strong>56岁（2012）</strong>：仍是区议员兼平信徒传道人；独居，说&quot;70 Up 对我来说就足够了&quot;。</li>\n<li><strong>63岁（2019）</strong>：仍是议员和传道人；坦言&quot;我觉得我的人生是个失败&quot;；最后一次竞选国会议员失败。</li>\n<li><strong>70岁（2026）</strong>：独居法国乡下无暖气的房子，烧纸板取暖；每周半天书店义工；与妻子分居；说&quot;差不多是我这辈子能达到的最幸福&quot;。</li>\n</ul>\n","verdict":"<p>尼尔 7 岁时拥有全系列最亮的起点：中产家庭、脑子灵活、被所有人看好。14 岁牛津落榜、16 岁抑郁症确诊之后，人生一路下坠，28 岁跌到谷底——高地的流浪汉。命运最大的变化从 42 岁开始：开放大学的学位、地方议员的选票、传道人的身份，他用了二十多年，把自己从&quot;没用的人&quot;爬回了&quot;有用的人&quot;。但他没有迎来传统意义上的成功：没有孩子，婚姻散了，70 岁独居法国烧纸板取暖。可他说这是&quot;差不多是我这辈子能达到的最幸福&quot;——从 63 岁的&quot;我的人生是个失败&quot;到 70 岁的和解，这七年里发生了某种原谅。他留给观众的核心印象是：一个人可以跌到最低，还能爬回来；幸福不一定要赢，接受也是一种赢。</p>\n","verdictTitle":"他的一生","intro":"<p>尼尔是全系列最让人放不下的一位：7 岁时 14 个孩子里最聪明、最被看好的一个，28 岁却在苏格兰高地无家可归；42 岁后靠开放大学学位和地方政治慢慢爬回来，当了 21 年议员。他这一生的反转，比任何编剧写出来的都大。</p>\n","background":"","ages":[],"compare":null,"conclusion":"","sources":""},"nick":{"id":"nick","name":"尼克·希奇翁","en":"Nick Hitchon","nickname":"约克郡农场的核科学家","avatar":"avatars/nick.jpg","summary":"约克郡山谷里一个 6 岁就被选中的农场孩子，23 岁拿下牛津博士，42 岁成为美国核聚变教授，两度婚姻、一个儿子；2019 年在镜头前公布喉癌，医生说他活不过 2020 年，他多活了三年半，并在去世前 3 天录下给《70 Up》的最后访谈，成为全系列终章的泪点。","class7":"约克郡山谷农场家庭，三个儿子中的老大","education":"牛津大学物理本科、硕士，23 岁获工程科学博士","career":"美国威斯康星大学核聚变教授（电气与计算机工程系）","marriage":"与第一任妻子离婚，2001 年再婚","children":"1 个儿子（Adam）","turning":"1982 年移居美国；2019 年确诊喉癌","status70":"2023 年 7 月 23 日因喉癌去世，享年 65 岁；70 Up 以他去世前 3 天的访谈谢幕","alive":false,"tags":["工薪阶层","上大学","离婚","再婚","移民","已去世","退休"],"short":true,"resume":"<ul>\n<li><strong>7岁（1964）</strong>：实际只有 6 岁，约克郡山谷农场孩子；说想&quot;搞清楚月亮和那些东西&quot;。</li>\n<li><strong>14岁（1970）</strong>：在 Skipton 的 Ermysted's 文法中学，科学出众，还是橄榄球队队长。</li>\n<li><strong>21岁（1977）</strong>：在牛津读博士；1979 年与牛津同学 Jacqui Bush 结婚。</li>\n<li><strong>28岁（1984）</strong>：1982 年移居美国，进威斯康星大学麦迪逊分校做核聚变研究；妻子拒绝再被拍摄。</li>\n<li><strong>35岁（1991）</strong>：在威斯康星站稳脚跟；事业上升，婚姻吃力。</li>\n<li><strong>42岁（1998）</strong>：1994 年升正教授；与 Jacqui 离婚；儿子 Adam 出生——&quot;最纯粹的快乐&quot;。</li>\n<li><strong>49岁（2005）</strong>：2001 年再婚，娶教师 Cryss Brunner；宏大计算机项目失败让他受挫。</li>\n<li><strong>56岁（2012）</strong>：与 Cryss 安定下来；公开抱怨节目把他拍成&quot;乡巴佬&quot;让他生气。</li>\n<li><strong>63岁（2019）</strong>：在镜头前公布喉癌，瘦了 60 磅；医生说他活不过 2020 年底。</li>\n<li><strong>70岁（2026）</strong>：2023 年 7 月 23 日因喉癌在威斯康星去世，享年 65 岁；去世前 3 天录的访谈成为《70 Up》核心段落。</li>\n</ul>\n","verdict":"<p>尼克的人生前半段是&quot;寒门贵子&quot;的标准答案：农场孩子→文法中学→牛津→23 岁博士→美国教授，村小到核聚变实验室，一步没踏空。但命运最大的变化是 2019 年的喉癌：医生说他活不过 2020 年，他多活了三年半，临死前 3 天还要把《70 Up》的访谈录完——&quot;想把 6 岁开始的事做完&quot;。他这辈子有两件事没放下：一是镜头里的&quot;乡巴佬&quot;标签，从 56 岁抱怨到 65 岁；二是对学生的责任，病重到&quot;临死前还在手机上批改学生论文&quot;。他留给观众的核心印象，藏在他自己早年那句话里：&quot;看一个人随时间变化的全貌，太神奇了&quot;——他成了这句话本身。</p>\n","verdictTitle":"他的一生","intro":"<p>尼克是全系列&quot;阶级跨越&quot;最彻底的一个：约克郡山谷的农场孩子，23 岁拿下牛津博士，成了美国威斯康星大学的核聚变教授。但他一辈子没甩掉&quot;乡巴佬&quot;的标签，也没躲过喉癌；去世前 3 天录下的访谈，成了《70 Up》最催泪的段落。</p>\n","background":"","ages":[],"compare":null,"conclusion":"","sources":""},"tony":{"id":"tony","name":"托尼·沃克","en":"Tony Walker","nickname":"没当成骑师的出租车司机","avatar":"avatars/tony.jpg","summary":"7 岁时说“长大要当骑师”，14 岁时又补了一句“如果不行就去开出租车”——两句话全中了：他只跑了 3 场职业赛马就因超重退役，然后开了几十年伦敦出租车；1998 年在镜头前承认出轨，婚姻差点散了，但和妻子 Debbie 厮守 46 年；70 岁住在埃平森林的房车里半退休，说“人生最后九洞，我打得很开心”。","class7":"伦敦东区工人家庭，父亲坐过牢，母亲酗酒","education":"没怎么好好读书，很早就进赛马马厩训练","career":"伦敦黑色出租车司机（The Knowledge 考出来的）","marriage":"1979 年与 Debbie 结婚，46 年婚姻，曾出轨但和好","children":"3 个孩子，3 个孙辈","turning":"体重超标断送骑师梦；42 岁在镜头前承认出轨","status70":"埃平森林房车半退休，与 Debbie 厮守，三个孩子三个孙辈","alive":true,"tags":["工薪阶层","没上大学","有孙辈","退休"],"short":true,"resume":"<ul>\n<li><strong>7岁（1964）</strong>：伦敦东区工人家庭，父亲坐过牢、母亲酗酒；说&quot;长大要当骑师&quot;。</li>\n<li><strong>14岁（1970）</strong>：在赛马马厩训练；补了一句&quot;如果当不成骑师，就去开出租车&quot;。</li>\n<li><strong>21岁（1977）</strong>：只跑 3 场职业赛马就因超重退役；开始考出租车司机 The Knowledge；1979 年娶 Debbie。</li>\n<li><strong>28岁（1984）</strong>：考出伦敦黑色出租车执照；开过酒吧 Rotherfield Arms；迷上表演去上表演课。</li>\n<li><strong>35岁（1991）</strong>：Debbie 失去一个孩子；托尼承认一夫一妻&quot;越来越让他吃力&quot;。</li>\n<li><strong>42岁（1998）</strong>：在镜头前承认出轨；全家搬去 Essex；拉过 John、Lynn、Neil 坐他的车。</li>\n<li><strong>49岁（2005）</strong>：名下两套房含西班牙度假屋；计划举家搬西班牙；开车送大部分演员去 Lynn 的葬礼。</li>\n<li><strong>56岁（2012）</strong>：一半时间住西班牙；因肺栓塞住院；顶回 Apted&quot;像种族主义者&quot;的提问。</li>\n<li><strong>63岁（2019）</strong>：西班牙计划被金融危机打碎，回埃平森林定居；投脱欧票后又后悔；帮着带孙女。</li>\n<li><strong>70岁（2026）</strong>：埃平森林房车半退休；与 Debbie 结婚 46 年，3 个孩子 3 个孙辈；创办伦敦出租车司机合唱团。</li>\n</ul>\n","verdict":"<p>托尼的起点是 14 人里最难的之一：东区、父亲坐牢、母亲酗酒，Apted 一度断言他&quot;28 岁前会进监狱&quot;。命运最大的变化不是发财，而是一次次&quot;差点翻车又开回来&quot;：骑师梦碎转开出租车，出轨差点散了婚姻，西班牙梦碎于金融危机——每一次，他都靠那股东区街头练出来的生命力扳了回来。他和 Debbie 的 46 年婚姻熬过了出轨，Debbie 说&quot;有时候我觉得我根本没熬过去，但我还在这里&quot;。他留给观众的核心印象是开心：7 岁时最被看衰的孩子，70 岁活成了最知足的大爷；他没实现 7 岁的梦，但他活成了 7 岁那个快乐男孩的 70 岁版本。</p>\n","verdictTitle":"他的一生","intro":"<p>托尼是&quot;7 岁看 70 岁&quot;应验得最准的一个：7 岁说要当骑师，14 岁补一句&quot;不行就去开出租车&quot;——两句全中。他只跑了 3 场赛马就退役，开了几十年出租车；出过轨、开过酒吧、西班牙买房被金融危机打回来，但和妻子厮守 46 年，70 岁说&quot;人生最后九洞，我打得很开心&quot;。</p>\n","background":"","ages":[],"compare":null,"conclusion":"","sources":""},"peter":{"id":"peter","name":"彼得·戴维斯","en":"Peter Davies","nickname":"骂过政府的乡村歌手","avatar":"avatars/peter.jpg","summary":"利物浦工薪家庭的孩子，7 岁时和尼尔一起说要当宇航员，28 岁时在镜头前痛骂撒切尔政府，被小报围攻后退出节目 28 年；消失的岁月里他离婚、改学法律、进了公务员系统、再婚生子；56 岁为宣传自己的乡村乐队回归，70 岁时已是全职音乐人和作家，出了小说、写了音乐剧。","class7":"利物浦工薪家庭，和尼尔同校","education":"伦敦大学历史学位，后改学法律","career":"教师→公务员（皇家检察署）→全职音乐人、作家","marriage":"离婚后再婚（第二任妻子是乐队搭档 Gabi）","children":"2 个孩子（与第二任妻子）","turning":"1984 年在镜头前痛骂撒切尔，被小报围攻后退出节目 28 年","status70":"与妻子定居利物浦，全职写歌、写小说、写音乐剧","alive":true,"tags":["工薪阶层","上大学","离婚","再婚","退出过节目","退休","心理健康问题"],"short":true,"resume":"<ul>\n<li><strong>7岁（1964）</strong>：利物浦工薪家庭，与尼尔同校；说长大要当宇航员。</li>\n<li><strong>14岁（1970）</strong>：公开记录很少，仍是学生，宇航员梦撞上青春期现实。</li>\n<li><strong>21岁（1977）</strong>：在伦敦大学读历史；左翼立场已经很明显。</li>\n<li><strong>28岁（1984）</strong>：当中学教师；在镜头前痛骂撒切尔政府，被小报围攻后退出节目。</li>\n<li><strong>35岁（1991）</strong>：拒绝参演；这期间离婚、改学法律。</li>\n<li><strong>42岁（1998）</strong>：拒绝参演；进入公务员系统，再婚生子，搬回利物浦。</li>\n<li><strong>49岁（2005）</strong>：拒绝参演；在就业与养老金部工作。</li>\n<li><strong>56岁（2012）</strong>：为宣传乡村乐队 The Good Intentions 回归；带妻子和两个十几岁的孩子出镜。</li>\n<li><strong>63岁（2019）</strong>：乐队获英国乡村音乐奖后吉他手去世；政治火气仍在。</li>\n<li><strong>70岁（2026）</strong>：全职音乐人和作家；出版小说《Valediction Records》；音乐剧《Under The Mersey Moon》2026 年 11 月在利物浦上演；公开谈论抑郁症。</li>\n</ul>\n","verdict":"<p>彼得 7 岁时和尼尔起点几乎一样：利物浦、工薪家庭、想当宇航员。命运最大的变化发生在 28 岁：他在镜头前说了真话，代价是被小报打成&quot;愤怒的红色分子&quot;，愤而退出 28 年。但消失不是沉沦——他离婚、改学法律、进了公务员系统、再婚生子，把&quot;铁饭碗&quot;端稳了；然后 56 岁带着一支获奖乐队回来，还跟 ITV 谈条件&quot;得聚焦我的创作&quot;。70 岁时他全职写歌、写小说、写音乐剧，公开谈抑郁症，说节目&quot;从一项阶级研究，变成了关于'做人意味着什么'的故事&quot;。他留给观众的核心印象是&quot;迟到&quot;的漂亮：没有在 28 岁被定格，而是用 28 年证明，自己不止是那个愤怒青年。</p>\n","verdictTitle":"他的一生","intro":"<p>彼得是&quot;消失&quot;最久的人：28 岁在镜头前痛骂撒切尔政府，被小报围攻后退出节目 28 年；消失的岁月里他离婚、改学法律、进公务员系统、再婚生子；56 岁为宣传自己的乡村乐队回归，70 岁成了全职音乐人和作家。他是全系列&quot;第二人生&quot;过得最像样的人之一。</p>\n","background":"","ages":[],"compare":null,"conclusion":"","sources":""},"bruce":{"id":"bruce","name":"布鲁斯·鲍尔登","en":"Bruce Balden","nickname":"最知足的数学老师","avatar":"avatars/bruce.jpg","summary":"7 岁时说想去非洲当传教士、想见 6000 英里外当兵的爸爸；牛津数学系毕业后，他辞掉保险公司的工作，去伦敦东区教了一辈子数学；40 多岁才结婚，有两个儿子；70 岁时和妻子退休定居英格兰东北海岸，每天海边遛狗、唱诗班、救生艇义工，说“现在比这辈子任何时候都享受生活”。","class7":"中上层军人家庭，父亲驻非洲，寄宿学校长大","education":"牛津大学数学系","career":"一辈子的数学教师（伦敦东区综合中学→私立名校）","marriage":"40 多岁与同为教师的 Penny 结婚","children":"2 个儿子","turning":"28 岁辞掉保险公司工作，去伦敦东区贫民学校教数学","status70":"与 Penny 退休定居伯威克海岸，唱诗班、救生艇义工，海边遛狗","alive":true,"tags":["精英家庭","上大学","退休"],"short":true,"resume":"<ul>\n<li><strong>7岁（1964）</strong>：寄宿学校男孩，父亲驻非洲；说想去非洲当传教士；最想见 6000 英里外的爸爸。</li>\n<li><strong>14岁（1970）</strong>：仍在寄宿学校；温和有礼，被剪成阶级叙事的一部分。</li>\n<li><strong>21岁（1977）</strong>：在牛津读数学；仍单身，被框成&quot;长期单身汉&quot;。</li>\n<li><strong>28岁（1984）</strong>：辞掉保险公司工作，去伦敦东区 Hackney 的综合中学教数学；父亲看了节目说为他骄傲。</li>\n<li><strong>35岁（1991）</strong>：休学术假去孟加拉国 Sylhet 支教；仍未婚，希望&quot;很快能结&quot;。</li>\n<li><strong>42岁（1998）</strong>：与教师 Penny 结婚，Apted 破例专门拍摄婚礼；从东区跳槽到私立 St Albans 学校。</li>\n<li><strong>49岁（2005）</strong>：两个儿子出生；在 St Albans 教书。</li>\n<li><strong>56岁（2012）</strong>：幸福的父亲和丈夫；坦言寄宿学校留下的&quot;受限情感状态&quot;还在。</li>\n<li><strong>63岁（2019）</strong>：从教师岗位退休；儿子们离巢；第一次深谈学校挨打的经历。</li>\n<li><strong>70岁（2026）</strong>：与 Penny 定居伯威克海岸；每天海边遛狗、晚上唱诗班、周三救生艇站义工；读父亲当年寄来的诗，说&quot;他想我，一点不比我想他少&quot;。</li>\n</ul>\n","verdict":"<p>布鲁斯的阶级位置是&quot;有资源、没包袱&quot;：私立寄宿学校、牛津数学系给了他选择的底气，但他没被精英剧本绑死。命运最大的变化是 28 岁那个选择：辞掉保险公司，去东区教数学——传教士没当成，&quot;帮人&quot;找到了成年版的形状，一干就是几十年。40 多岁才结婚，有两个儿子；晚年从东区跳槽到私立学校，有人说他&quot;出卖理想&quot;，他的回应是&quot;没彼得那事儿严重&quot;。70 岁时他在北海边遛狗、唱诗班、做义工，说&quot;现在比这辈子任何时候都享受生活&quot;。他留给观众的核心印象是温柔和知足：7 岁那个想见爸爸的男孩，70 岁读着爸爸的诗说&quot;他想我，一点不比我想他少&quot;——同一条线，从第一集贯穿到最后一集；也证明了不按剧本走，也可以走得很稳、很开心。</p>\n","verdictTitle":"他的一生","intro":"<p>布鲁斯是全系列最&quot;稳&quot;、也被公认最幸福的参与者之一：牛津数学系毕业后，他辞掉保险公司的工作，去伦敦东区教了一辈子数学；40 多岁才结婚；70 岁和妻子退休定居海边，每天遛狗、唱诗班、做救生艇义工，说&quot;现在比这辈子任何时候都享受生活&quot;。</p>\n","background":"","ages":[],"compare":null,"conclusion":"","sources":""}};
