重新走近（Daily Mail，2026；Entertainment Daily，2026）。62 年一集不落，就是他对这个项目最强的表态。</p>\n</ul>\n"}],"compare":{"title":"7岁的他，和70岁的他","html":"<h3>没变的地方</h3>\n<ul>\n<li><strong>腼腆和温和</strong>。7 岁说话小声，70 岁 ITV 还叫他&quot;腼腆的保罗&quot;；评论人说&quot;小时候温和，当祖父也温和&quot;（Lundegaard，2019）。六十年，气质没换过。</li>\n<li><strong>对&quot;家&quot;的执念</strong>。7 岁为&quot;结婚吃青菜&quot;焦虑——说白了是怕没有一个安稳的家；70 岁的告别词通篇是&quot;好家庭让你完整&quot;。同一个问题，想了一辈子。</li>\n<li><strong>话少</strong>。14 岁&quot;表达自己费劲&quot;，70 岁依然不是能说会道的人。但他说出来的每句都算数。</li>\n</ul>\n<h3>完全改变的地方</h3>\n<ul>\n<li><strong>自我评价</strong>。21 岁&quot;我总觉得自己是个没用的人&quot;→ 70 岁&quot;他做得很好&quot;（说父亲，也是说自己）。这是全系列最彻底的一次自我和解。</li>\n<li><strong>地理和人生跑道</strong>。伦敦儿童之家 → 墨尔本祖父。8 岁那次移民，是他人生唯一的、也是最大的一次换轨。</li>\n<li><strong>家庭角色</strong>。从&quot;被安排的孩子&quot;（父母离婚、进之家），到&quot;安排别人的人&quot;：丈夫、父亲、祖父，养老村里修东西的人。</li>\n</ul>\n<h3>最出人意料的变化</h3>\n<p>&quot;七岁看老&quot;在保罗身上翻车翻得最彻底：7 岁时那个最不被看好、最焦虑、&quot;最没指望&quot;的孩子，长成了 14 个人里<strong>唯一没离过婚</strong>、人生最稳的人。节目组当年把他当&quot;一无所有&quot;的样本，他却用 48 年的婚姻和一大家子证明：起点最低的人，可以过得最完整。21 岁那句&quot;我不是没用的人&quot;，他用了后半生来兑现。</p>\n"},"conclusion":"<p>一个 7 岁时住在儿童之家、怕结婚怕吃青菜的小男孩，8 岁随父亲移民澳洲，从泥瓦匠干起，白手起家，1978 年结婚后 48 年没离过婚——成了 14 个人里唯一一段婚姻走到底的人。他没当过名人，没发过财，没上过大学，但 70 岁时儿孙绕膝，留给观众的话是&quot;善良，宽恕，诚实地活&quot;。他这一生是对&quot;七岁看老&quot;最安静的反驳：7 岁时最不被看好的孩子，过得最稳。</p>\n","sources":"<p><strong>主要来源</strong>：ITV《70 Up》节目介绍（经 Hello Rayo，2026）；BBC News（2026 年 9 月 George Wright 回顾及重聚照）；Radio Times（2026）；Daily Mail（2026 年 9 月&quot;青菜&quot;专访：婚姻、离婚、移民、48 年婚姻、父亲约十年前去世）；TV Guide UK（2026 年 9 月 11 日：70 岁告别词、孙辈）；Entertainment Daily（2026 年 9 月）；TheWrap（2019）；NPR（2019）；Film Comment（2019）；Screen-Space（2019）；The Sun（2026）；IMDb / FilmAffinity（2026）；Erik Lundegaard（2019）；Wikipedia 仅作结构核对。</p>\n<p><strong>冲突与空白</strong>（如实记录）：1）儿童之家名称——Shaftesbury Homes、Twickenham（Wikipedia 2026，最具体）vs &quot;Barnardo's&quot;（小报/粉丝资料，无出处），以前者为准；2）移民同行人——&quot;父亲和继母&quot;（Wikipedia）vs&quot;父亲和兄弟&quot;（Daily Mail），两者兼容，无单一来源列全；3）移民年龄——&quot;约 8 岁离开之家&quot;（Entertainment Daily）vs&quot;《Seven Up!》之后不久&quot;（Wikipedia），都在 1965 年前后，确切年份不详；4）妻子名字 Sue（Daily Mail、IMDb）vs Susan（Wikipedia），同一人，Susan 是正式名；5）孩子数量：两个，一致；&quot;结过多次婚&quot;&quot;有孩子早夭&quot;的传言<strong>无任何可靠来源，不写</strong>；6）空白：确切生日和出生地不详；父母姓名不详；上过哪所学校不详；《35 Up》《42 Up》两集的颗粒度缺失；退休状态、健康状况、孤独感、对死亡的看法，均无可引用的原话——记空白，不推断。</p>\n"},"symon":{"id":"symon","name":"西蒙·巴斯特菲尔德","en":"Symon Basterfield","nickname":"养过上百个孩子的父亲","avatar":"avatars/symon.jpg","summary":"14 人里唯一的混血孩子：父亲从未出现，母亲患抑郁症，他在儿童之家和母亲之间长大；7 岁想当电影明星，21 岁在香肠厂流水线上被导演问\"你觉得自己不值更好的吗\"；28 岁骄傲地给了五个孩子\"一个爸爸\"，中年离婚缺席一集，再婚后与妻子做了约 20 年寄养父母，照顾过 100 多名寄养儿童；70 岁最大的遗憾，是从没问清父亲是谁。","class7":"与保罗同一儿童之家的孩子；母亲患抑郁症，父亲从未出现","education":"具体学校无公开资料；56 岁时后悔没受过正规教育","career":"肉类冷冻厂→香肠厂流水线→仓库→希思罗货运仓库叉车司机→办公室工作","marriage":"早年娶 Yvonne，育有五个孩子，离婚（缺席《35 Up》）；再婚娶 Vienetta，育有一子 Daniel，并抚养继女","children":"六个孩子；12 个孙辈（\"还在增加\"）","turning":"49 岁与 Vienetta 开始做寄养父母——儿童之家的受助者，变成上百个孩子的给予者","status70":"与 Vienetta 住英国乡下，戴助听器；最大遗憾是从没问清父亲是谁","alive":true,"tags":["儿童之家","没上大学","离婚","再婚","有孙辈","退休"],"intro":"<p>西蒙是 14 个孩子里唯一的混血儿，也是身世最不明的一个：父亲是个从没出现过的黑人，母亲是患抑郁症的白人英国女性，他在儿童之家和母亲之间长大。7 岁时他说想当电影明星；14 岁时被问到爸爸，他耸耸肩：&quot;没有的东西，就不会想。&quot;21 岁他在香肠厂流水线上，导演当面问他&quot;你觉得自己不值个更好的工作吗&quot;；28 岁他最骄傲的是给了五个孩子&quot;一个爸爸&quot;——他自己从没拥有过的东西。中年离婚，他缺席了《35 Up》；再婚后，他和妻子 Vienetta 做了约 20 年寄养父母，照顾过 100 多名寄养儿童。70 岁时，14 岁那句&quot;不会想&quot;被他自己推翻了：他最后悔的，就是一辈子没问清父亲是谁。</p>\n","background":"<p>西蒙约 1956 年生于英国（电影数据库一致记&quot;c. 1956 in UK&quot;；早期几集的字幕把他的名字拼成&quot;Simon&quot;，Wikipedia）。母亲是白人英国女性，一生受抑郁症困扰，<strong>1990 年死于癌症</strong>（Entertainment Daily，2026；TV Guide，2026）。节目里把母亲的抑郁症作为他进儿童之家的原因（Wikipedia）。</p>\n<p>父亲是个黑人，西蒙<strong>从没见过</strong>。父亲到底哪国人，<strong>没有确证</strong>：这份研究最初的简报里写&quot;牙买加&quot;，但西蒙自己在《70 Up》里说，他只隐约记得有人提过&quot;尼日利亚&quot;——&quot;我记不清是谁告诉我他是尼日利亚人，可能是我妈。但我不知道他是不是尼日利亚人。所以关于这个男人，我什么都不知道，我从没见过他&quot;（TV Guide，2026）。<strong>牙买加的说法没有出处，不采用；尼日利亚也只是他不确定的回忆</strong>。1964 年的旁白介绍他时，用的词是&quot;单身母亲的私生子&quot;（TV Guide，2026；Entertainment Daily，2026）——当年节目更在意&quot;私生&quot;，而不是他的肤色。后来影评人（Film Comment，2019）指出，他作为&quot;节目里唯一的非白人面孔&quot;，说明的更多是 1964 年节目组的预设，而不是当时英国的真实人口构成。</p>\n<p>儿童之家和保罗是同一家：<strong>Shaftesbury Homes 在 Twickenham 的儿童之家</strong>（Wikipedia）。2026 年有几家小报写他&quot;在巴纳德（Barnardo's）儿童之家&quot;，查无出处，基本可以判定是记者笔误——Barnardo's 是另一家机构。两家都是真机构，别混。</p>\n<p>他在之家的日子后来被两个当事人形容为&quot;<strong>管得很严</strong>&quot;（regimented），短期看留下的是&quot;缺自信、缺自我价值感&quot;（Film Comment，2019，转述《63 Up》）。到拍《7 Plus Seven》（1970）时，他已经离开之家、和母亲一起住了（Wikipedia）。有粉丝资料说他上过慈善性质的寄宿学校、在乡下白人家庭被寄养过，但<strong>都找不到可引用的出处</strong>，这里记&quot;未证实&quot;，不写进正文。</p>\n","ages":[{"age":7,"title":"7岁 ——《Seven Up!》（1964）","html":"<p>1963 年拍、1964 年 5 月 5 日播出的《Seven Up!》（导演 Paul Almond，年轻的 Apted 当调研员帮忙选孩子，Wikipedia），西蒙和保罗作为儿童之家的两个男孩一起出镜，旁白介绍他是单身母亲的&quot;私生子&quot;（TV Guide，2026）。</p>\n<p>被问到长大想干什么，7 岁的西蒙说想当<strong>电影明星</strong>（movie star）（NPR 下属电台 2019 年回顾《63 Up》时转述 1964 年片段）。《泰晤士报》（2026）后来叫他&quot;儿童之家那个犹豫的男孩&quot;——但 7 岁的他在回顾里显得开朗、外向。</p>\n<p>&quot;想当电影明星&quot;这句，70 岁时有了回响：他说这个节目是&quot;一份礼物&quot;，他觉得自己&quot;被看见了&quot;（The Times，2026）。7 岁想被全世界看见，70 岁觉得被一档节目看见了——这条线埋了六十年。</p>\n"},{"age":14,"title":"14岁 ——《7 Plus Seven》（1970）","html":"<p>14 岁的西蒙已经和母亲一起住了。AV Club（2019）形容他&quot;用安静、哀伤的语气谈自己是'私生子'这件事的影响&quot;。</p>\n<p>关于父亲，他留下了后来被反复引用的一段话——《70 Up》播出前 TV Guide（2026）又转述了一遍：&quot;人家问'你爸呢'，那会儿你妈出去上班了。我就跟他们说，我没有爸。<strong>我觉得这对我没什么影响，没有的东西，就不会想</strong>（what you don't have you don't miss）。&quot;</p>\n<p>这句&quot;不会想&quot;，是他 14 岁时给自己穿的盔甲。56 年后，70 岁的他亲手把它脱了下来——这是全系列最让人难受的&quot;伏笔回收&quot;之一，后面细讲。</p>\n"},{"age":21,"title":"21岁 ——《21 Up》（1977）","html":"<p>21 岁的西蒙在<strong>肉类冷冻厂</strong>上班——有的资料写&quot;香肠厂流水线&quot;（Film Comment，2019；NPR，2019）。镜头里 Apted 当面逼问他：你就不觉得自己<strong>值个比这更好的工作吗</strong>（Film Comment，2019）。这段对话后来经常被拿出来当&quot;Apted 居高临下、阶级预设&quot;的例子。</p>\n<p>感情上，他二十出头就结了婚，妻子叫 <strong>Yvonne</strong>（TV Guide，2026；Entertainment Daily，2026）。</p>\n<p>关于他 21 岁时怎么谈自己的混血身份：这份研究翻遍二手资料，<strong>没找到他亲口谈&quot;黑人还是混血&quot;的原话</strong>。节目给他的标签倒是稳定的——&quot;唯一的混血参与者&quot;（Wikipedia）、&quot;组里唯一的混血成员&quot;（NPR，2019）。标签是节目贴的，他心里怎么想，资料没写，不编。</p>\n"},{"age":28,"title":"28岁 ——《28 Up》（1984）","html":"<p>28 岁的西蒙，和 Yvonne 结婚，<strong>五个孩子</strong>（First Run Features《56 Up》新闻资料包）。他在镜头前骄傲地说：<strong>&quot;他们什么都有。他们有我从没拥有过的东西——一个爸爸&quot;</strong>（They've got everything. They've got what I never had – a father.）（TV Guide，2026；Entertainment Daily，2026）。</p>\n<p>这是他 28 岁人生的全部骄傲：把自己缺了一辈子的东西，给孩子补上了。评论人 Bruce Bawer 在《哈德逊评论》里回忆，28 岁的西蒙&quot;认命了：平淡的婚姻，沉闷的仓库工作&quot;。骄傲和认命，在他身上是同时成立的。</p>\n"},{"age":35,"title":"35岁 ——《35 Up》（1991）","html":"<p><strong>他没参加</strong>。和 Yvonne 的婚姻正在破裂、走离婚程序，他选择不拍这一集（Wikipedia；TV Guide，2026）。这是他唯一缺席的一集。</p>\n<p>缺席本身就是信息：14 个人里，退出又回来的不止他一个，但他在人生最低谷时选择消失，七年后才回来——这个&quot;空&quot;，和他后来的&quot;满&quot;对照着看才有意思。</p>\n"},{"age":42,"title":"42岁 ——《42 Up》（1998）","html":"<p>42 岁，西蒙回来了，带着新生活：</p>\n<ul>\n<li><strong>再婚</strong>。妻子 <strong>Vienetta</strong>——系列资料里写她是奥地利人，但这份研究<strong>没找到独立可引用的出处</strong>，记&quot;未证实&quot;。两人有个儿子 <strong>Daniel</strong>，拍的时候四岁；西蒙还成了 Vienetta 女儿的继父（Wikipedia；TV Guide，2026；First Run Features 新闻资料包）。一家搬去了 <strong>Essex</strong>（Culture Wikia/Fandom）。</li>\n<li><strong>工作</strong>。换了一份&quot;喜欢的办公室工作&quot;（Hudson Review）——28 岁那个认命的仓库工，语气完全变了；不过 AV Club（1999）还叫他&quot;混血劳工&quot;，标签没那么快撕掉。</li>\n<li><strong>裂痕</strong>。前一段婚姻的几个孩子<strong>不肯见他</strong>（First Run Features 新闻资料包）。《波士顿凤凰报》（1999）写：&quot;西蒙始终为前段婚姻的孩子和他保持距离而难受：他从小没有父亲，28 岁时最骄傲的是给了孩子们一个爸爸。&quot;——28 岁的骄傲，42 岁变成了痛。</li>\n<li><strong>母亲</strong>。他在片子里谈母亲 1990 年去世：&quot;<strong>有太多话我没跟我妈说，其实我想跟她说的</strong>&quot;（There were so many things I never actually said to my mum, that I would have liked to say to her.）（First Run Features 新闻资料）。</li>\n<p>42 岁的西蒙，是&quot;得到&quot;和&quot;失去&quot;同时进行的人：新家庭有了，旧孩子远了；工作顺了，对母亲的亏欠却永远补不上了。</p>\n</ul>\n"},{"age":49,"title":"49岁 ——《49 Up》（2005）","html":"<p><strong>寄养父母</strong>。他和 Vienetta 接受培训，成了<strong>正式的寄养父母</strong>（Wikipedia）。这是他人生的转折点：儿童之家养大的孩子，开始养儿童之家的孩子。</p>\n<p>物质上，那时他名下有两套房，包括西班牙一套度假房（Culture Wikia/Fandom）——从香肠厂流水线到西班牙度假房，跨度不小。</p>\n<p>节目组的老传统也没断：把保罗从澳洲飞回来，拍两人重聚（Wikipedia）。两个儿童之家男孩的 találkozó，第三次。</p>\n"},{"age":56,"title":"56岁 ——《56 Up》（2012）","html":"<p>56 岁的西蒙在<strong>希思罗附近的货运仓库</strong>上班（First Run Features 新闻资料包）；《纽约时报》衍生的资料写他当时是叉车司机，有个不错的家，和妻子一起照顾寄养儿童。</p>\n<p>他后悔没受过正规教育，觉得这限制了一辈子的收入；但&quot;婚姻幸福，期待人生的下一章&quot;（Wikipedia）。有个《56 Up》的观众评论说，西蒙&quot;特别值得听，因为他和妻子几十年如一日地当寄养父母&quot;（Letterboxd 观众评论）。</p>\n"},{"age":63,"title":"63岁 ——《63 Up》（2019）","html":"<p>63 岁的西蒙：和前段婚姻孩子的关系<strong>在修复</strong>，<strong>10 个孙辈</strong>（Wikipedia）；和 Vienetta&quot;在英国乡下安顿下来&quot;（Wikipedia）。</p>\n<p>重聚传统反过来了：这回是西蒙和妻子<strong>飞去澳洲看保罗</strong>（Wikipedia）。《TheWrap》（2019）说保罗–西蒙这条线是&quot;最动人&quot;的段落：两个男人处理破碎的原生家庭、经营好自己的小家，&quot;西蒙还成了固定的寄养父亲——让人喉头一哽&quot;。</p>\n<p>NPR（2019）还是把他框为&quot;组里唯一的混血成员&quot;。这份研究没找到他 63 岁时关于种族身份的新表述——身份这条线在片子里让位给了婚姻、父职、和解和寄养。</p>\n"},{"age":70,"title":"70岁 ——《70 Up》（2026）","html":"<p>终章《70 Up》（Asif Kapadia 在 Apted 2021 年 1 月去世后接手，2026 年 9 月 15 日和 22 日在 ITV1/ITVX 播出两集 90 分钟，Wikipedia；TV Guide，2026）。西蒙<strong>活着</strong>，参加了。</p>\n<p><strong>父亲之问——他&quot;唯一的大遗憾&quot;</strong>。在家拍摄的他，如今戴着助听器。镜头每七年问他的那个问题，他 70 岁终于正面回答了：母亲（抑郁多年，1990 年死于癌症）走了，他后悔没逼她、没逼别人给个答案：<strong>&quot;这事到现在还在我脑子里：我真该问。第一，我爸是谁？他是干什么的？他从哪儿来？……我不该怕惹人不高兴，我就该问。但我不知道问谁，所以没问。现在我真希望当初问了&quot;</strong>（It's still in my head now, I should have asked. First, who's my dad? What did he do? Where did he come from? … I shouldn't have worried about upsetting people. I should have just asked the question. But I didn't know who to ask, so I didn't. But now I wish to hell I had.）（TV Guide，2026；Entertainment Daily，2026）。</p>\n<p>关于&quot;尼日利亚&quot;的说法，他自己都不确定：&quot;我记不清是谁告诉我他是尼日利亚人，可能是我妈。但我不知道他是不是尼日利亚人。&quot;——所以简报里的&quot;牙买加父亲&quot;<strong>没有依据，不采用</strong>。</p>\n<p>14 岁的&quot;没有的东西就不会想&quot;，70 岁变成&quot;我真希望当初问了&quot;。一个盔甲穿了 56 年，临了自己脱下来。这大概是《70 Up》里最诚实的一段话。</p>\n<p><strong>寄养成绩单</strong>。ITV 官方介绍：西蒙&quot;寄养过 <strong>120 多名</strong>儿童&quot;，&quot;<strong>12 个孙辈（还在增加）</strong>&quot;（经 hellorayo.co.uk，2026，转引 ITV）；《太阳报》（2026）也是&quot;120 多&quot;；Wikipedia 写&quot;约 20 年，100 多名&quot;。各家数字略有出入，量级一致：<strong>一百多个</strong>。</p>\n<p><strong>婚姻</strong>：还是和 Vienetta（Jude Rogers，Substack，2026；TV Guide，2026）。<strong>母亲</strong>：Jude Rogers 注意到，终章里&quot;他和母亲的关系&quot;变了——人 1990 年就走了，但他终于和她&quot;和解&quot;了。<strong>对节目</strong>：《泰晤士报》五星评论（2026 年 9 月）写：&quot;儿童之家那个犹豫的男孩，长大后寄养了那么多孩子，他说这个节目是<strong>一份礼物</strong>。他觉得，自己<strong>被看见了</strong>。&quot;</p>\n<p><strong>没查到的</strong>：70 岁的具体住址（只说&quot;在家拍&quot;，63 岁时在英国乡下）、退休状态、日常作息、除了助听器之外的健康、对死亡的看法、孤独感——资料没写，记空白。<strong>他和 Apted</strong>：Apted 从 1970 年起每集都导，还一手安排了他和保罗的几次跨国重聚；21 岁时 Apted 逼问他&quot;值不值更好的工作&quot;，是两人关系里最扎眼的一幕。Apted 去世时，据 Jude Rogers（Substack，2026）披露，拍《63 Up》时他已患上未确诊的早发性痴呆——这也解释了《63 Up》里他的虚弱。</p>\n"}],"compare":{"title":"7岁的他，和70岁的他","html":"<h3>没变的地方</h3>\n<ul>\n<li><strong>想被看见</strong>。7 岁想当电影明星——说白了想被全世界看见；70 岁说节目是&quot;一份礼物&quot;，因为&quot;被看见了&quot;。同一个愿望，换了个实现方式。</li>\n<li><strong>嘴硬心软</strong>。14 岁对父亲的事耸耸肩说&quot;不会想&quot;；42 岁说起母亲&quot;有太多话没说&quot;。他习惯先穿盔甲，再慢慢脱。</li>\n</ul>\n<h3>完全改变的地方</h3>\n<ul>\n<li><strong>父亲之问</strong>。14 岁：&quot;没有的东西，就不会想。&quot;70 岁：&quot;我真希望当初问了。&quot;——这是他一生最大的反转，也是全系列最完整的一次&quot;伏笔回收&quot;。</li>\n<li><strong>从受助者到给予者</strong>。儿童之家养大的孩子，成了养过 120 多个寄养儿童的父亲。28 岁时他骄傲的是给了五个孩子&quot;一个爸爸&quot;；后来他把这个&quot;爸爸&quot;给了上百个没爸爸的孩子。</li>\n<li><strong>对母亲</strong>。从&quot;她抑郁、我进之家&quot;的疏离，到 70 岁终于&quot;和解&quot;。人走了三十多年，和解才完成。</li>\n</ul>\n<h3>最出人意料的变化</h3>\n<p>起点最低的人之一——父亲从没出现过、母亲抑郁、儿童之家&quot;管得很严&quot;——最后成了 14 个人里<strong>最慷慨的父亲</strong>。节目组 1964 年大概只想拿他当&quot;问题儿童样本&quot;；六十年后，他是那个让评论家写下&quot; remarkably humbling（让人谦卑）&quot;的人（Jude Rogers，2026）。而且别忘了：他是 14 个人里唯一缺席过一集（《35 Up》）又回来的——消失过，才显得回来有多不容易。</p>\n"},"conclusion":"<p>一个父亲从没出现、母亲患抑郁症、在儿童之家&quot;管得很严&quot;的环境里长大的混血男孩，7 岁想当电影明星，21 岁在香肠厂流水线上被导演问&quot;你不值个更好的吗&quot;；他早婚、五个孩子、离婚、缺席一集，再婚后和妻子做了约 20 年寄养父母，照顾过 100 多名没家的孩子。70 岁时他戴着助听器说，最后悔的是从没问清父亲是谁——14 岁那句&quot;没有的东西就不会想&quot;，他用 56 年推翻了。他这一生，是把&quot;缺&quot;活成&quot;给&quot;的过程。</p>\n","sources":"<p><strong>主要来源</strong>：ITV《70 Up》官方节目介绍（经 hellorayo.co.uk，2026：120+ 寄养儿童、12+ 孙辈）；TV Guide UK（2026 年 9 月 9 日：70 岁谈父亲、Yvonne/五个孩子、Vienetta/Daniel、助听器、母亲 1990 年病逝）；Entertainment Daily（2026 年 9 月）；The Times 五星终章评论（2026 年 9 月：&quot;一份礼物&quot;&quot;被看见&quot;）；The Sun（2026 年 9 月）；Jude Rogers（Substack，2026：与母亲和解、Apted 拍《63 Up》时已患未确诊的早发性痴呆）；Wikipedia（结构：Shaftesbury Homes、缺席 35 Up、42 Up 再婚、49 Up 寄养、63 Up 10 孙辈）；Film Comment（2019：肉类冷冻厂、&quot;值更好的吗&quot;之问、&quot;管得很严&quot;）；NPR（2019：7 岁想当明星、香肠厂流水线）；AV Club（2019：14 岁谈&quot;私生子&quot;）；First Run Features《56 Up》新闻资料包（28 岁五子、离婚、再婚、Daniel 四岁、前婚孩子不肯见、56 岁希思罗货仓）；Hudson Review（28 岁认命/42 岁办公室工作）；Boston Phoenix（1999）；TheWrap（2019）。</p>\n<p><strong>冲突与空白</strong>（如实记录）：1）儿童之家——Shaftesbury Homes、Twickenham（系列资料、Wikipedia）vs &quot;Barnardo's&quot;（2026 年小报衍生报道），以前者为准，后者疑为记者笔误；2）寄养儿童总数——&quot;约 20 年 100 多名&quot;（Wikipedia）vs &quot;120 多名&quot;（ITV、《太阳报》），量级一致，精确数字各家不一；3）父亲国籍——&quot;牙买加&quot;（研究简报，无出处，不采用）vs &quot;尼日利亚&quot;（西蒙自己不确定的回忆），<strong>均未证实</strong>，以西蒙原话&quot;什么都不知道&quot;为准；4）Vienetta 国籍&quot;奥地利&quot;、拼写 Vienetta/Viennetta，均无独立确证；5）TV Guide 把《Seven Up!》播出写成 1963 年——1963 年拍摄、1964 年 5 月 5 日播出，以后者为准；6）未证实：乡下白人家庭寄养、寄宿学校校名（粉丝资料说法，无出处）；7）空白：70 岁具体住址、退休状态、日常、助听器之外的健康、对死亡的看法、孤独感，均无公开资料；8）21–56 岁期间他亲口谈种族自我认同的原话，<strong>没找到</strong>——&quot;混血身份演变&quot;的说法没有直接引文支撑，不写。</p>\n"},"neil":{"id":"neil","name":"尼尔·休斯","en":"Neil Hughes","nickname":"人生最跌宕的聪明男孩","avatar":"avatars/neil.jpg","summary":"7 岁时最聪明、最被看好的孩子之一，28 岁时却无家可归、在苏格兰高地流浪，42 岁起靠开放大学学位和地方政治慢慢爬回来，当了 21 年地方议员；70 岁时他独自住在法国一栋没有暖气的房子里，烧纸板取暖，自称“差不多是我这辈子能达到的最幸福状态”。","class7":"利物浦郊区中产家庭，父母都是教师","education":"阿伯丁大学辍学，后开放大学文学学士","career":"自民党地方议员（坎布里亚 21 年）、平信徒传道人","marriage":"短暂婚姻后分居","children":"无","turning":"28 岁无家可归；从流浪汉到当选地方议员","status70":"独居法国乡下，烧纸板取暖，每周半天书店义工","alive":true,"tags":["上大学","离婚","心理健康问题","移民","退休"],"intro":"<p>尼尔是《人生七年》里最让人放不下的一位。7 岁时他是 14 个孩子里最聪明、最活泼的一个，穿着粗呢大衣、顶着 Beatles 式刘海，笑着说长大要当宇航员。谁也没想到，28 岁再见到他时，他在苏格兰高地无家可归，靠捡零工和救济金活着。但他的人生没停在最低点：42 岁起他慢慢爬回来，拿了开放大学的学位，当选地方议员，一当就是 21 年，还做了传道人。70 岁时，他独自住在法国一栋没有暖气的房子里，烧纸板取暖，却平静地说自己“差不多是我这辈子能达到的最幸福状态”。他这一生的反转，比任何编剧写出来的都大。</p>\n","background":"<p>尼尔 1956 年（也有 1957 年的说法，资料有冲突）出生在英格兰利物浦，家在郊区。父母都是教师——这是很重要的背景：他不是穷孩子，是中产家庭的孩子，家里有书、有稳定收入，父母对孩子有要求。尼尔自己后来回忆，童年不像镜头里看起来那么完美，家里也会吵架，全家开开心心出门旅行，回来时车里常常一路沉默。他是家里唯一的孩子，至少没有公开资料提到他有兄弟姐妹。</p>\n<p>他上的是一所本地的中学，按他自己的说法学校很“糙”，他常被欺负、挨打，也偶尔打回去。这个细节解释了为什么 14 岁的他一下子就变了——童年那份无忧无虑，可能本就比他表现出来的脆弱得多。</p>\n<p>阶级对尼尔起点的影响是间接但真实的：他不缺物质，所以 7 岁时才有底气说要当宇航员、幻想去牛津；但中产家庭也没能给他一张兜底的安全网——一旦精神垮了，没有家底可以让他“任性”地躺平很久，也没人能把他从流浪的路上拽回来。尼尔的起点不算低，但这个起点保护不了他。</p>\n","ages":[{"age":7,"title":"7岁 ——《Seven Up!》（1964）","html":"<p>1964 年 5 月，7 岁的尼尔出现在格兰纳达电视台的《Seven Up!》里。他是节目里最讨人喜欢的孩子之一：穿着粗呢大衣，脸上带着笑，说话自信又有主见。</p>\n<p>他说了那句被引用了六十多年的话：“<strong>我长大要当宇航员</strong>（I want to be an astronaut）。”他拒绝谈论女孩——六十年代的英国男孩，回答得像个小大人。评论家后来回忆他“是 14 个孩子里最有活力、最有希望的孩子之一”（The Arts Desk，2012；NPR，2019）。</p>\n<p>他谈学校、谈朋友，头头是道。制作组选中他，部分原因就是他的热情和见解——在当时，没有任何迹象预示他将经历怎样的人生：一个幸福的中产孩子，脑子灵活，被所有人看好。</p>\n<p>这也是后来每一集都让观众心碎的原因——正因为起点这么亮，28 岁的坠落才显得这么黑。</p>\n"},{"age":14,"title":"14岁 ——《7 Plus Seven》（1970）","html":"<p>到了 14 岁，尼尔完全变了。评论一致说他变得紧张、焦虑，眼睛里已经有了“悲伤”（The Guardian，2019；Bruce Bawer，NPR，2019）。那个活泼的孩子不见了。</p>\n<p>转折点是牛津。尼尔读了 Evelyn Waugh 的《故园风雨后》，迷上了牛津，梦想考上。他 A-level 成绩达标了，但在牛津入学考试上失败了——他后来回忆，部分原因是考试时引用错了材料。这件事困扰了他很多年，他自己说：“我到现在还没走出来。”（Evelyn Waugh Society，2019，转述 The Guardian）</p>\n<p>被牛津拒绝后，他花了半年时间搭便车流浪，“让自己硬气一点”，后来回忆说那段经历里有严重的危险、奇怪的地方和可疑的同伴。也是在这个年纪，16 岁，他被诊断出“神经官能症”——他后来直接叫它抑郁症，说“从 16 岁起我就一直活在抑郁里”（Entertainment Daily，2026）。</p>\n<p>14 岁的尼尔已经埋下了后来所有故事的种子：对自我价值的怀疑、精神健康问题、第一次被命运拒绝。那个 7 岁的宇航员梦，从这里开始裂缝。</p>\n"},{"age":21,"title":"21岁 ——《21 Up》（1977）","html":"<p>尼尔去阿伯丁大学读语言和法律，结果第一学期就退学了。他回忆说，苏格兰民族主义学生在宿舍里搞了场“苏联式接管”：“如果你不是苏格兰人，那你就惨了。没人威胁我，但气氛很可怕。”（The Guardian，2019）</p>\n<p>21 岁再见到他时，他住在伦敦的 squat（占屋）里，在建筑工地打零工。镜头前的他神情激动、坐立不安。但有意思的是，他仍然说得出野心：“<strong>我想成为某个重要位置上的人……我很想从政</strong>。”（Bruce Bawer，NPR，2019）</p>\n<p>这句话是个巨大的伏笔。当时没人相信一个住在占屋里的退学青年能从政，但二十年后，他真的成了议员——虽然不是威斯敏斯特的那种，是地方议会的那种。</p>\n"},{"age":28,"title":"28岁 ——《28 Up》（1984）","html":"<p>这是尼尔成为“系列之魂”的一集，也是纪录片史上最著名的坠落之一。</p>\n<p>28 岁的尼尔，无家可归，在苏格兰高地流浪。他在荒凉的乡下领救济金，给高地庄园当驱赶松鸡的人（grouse-beater）——这个细节后来被反复引用，因为它离“宇航员梦”实在太远了。镜头前的他形容枯槁，一位观众回忆他“回答问题时不停地前后摇晃，正处在精神崩溃中”（eriklundegaard.com，2019）。他承认在当地“以怪人出名”。</p>\n<p>为什么这一集让观众震惊？正因为 7 岁的尼尔是所有孩子里最聪明、最被认为会成功的之一。从“要当宇航员”到“高地的流浪汉”，中间只隔了 21 年。这种对比太残酷，以至于很多人把尼尔当成了整个系列的象征：如果连他都这样，人生还有什么确定性可言？</p>\n"},{"age":35,"title":"35岁 ——《35 Up》（1991）","html":"<p>35 岁时，尼尔已经不住在高地了。他搬到了苏格兰最北端的设得兰群岛，住在政府提供的公租房里，在当地业余剧团写剧本、演哑剧（The Big Issue，2019；Wikipedia，2026）。</p>\n<p>这是他缓慢的、脆弱的稳定期：终于有了住的地方，有了创作的出口，但抑郁症依然死死缠着他。从辍学算起，他已经在动荡里泡了近二十年。他在节目里公开谈论自己的“神经问题”——他一直用这个词来指代抑郁症。</p>\n"},{"age":42,"title":"42岁 ——《42 Up》（1998）","html":"<p>这是尼尔人生的第一个大反转。</p>\n<p>42 岁的他回到了伦敦，住在另一个参与者布鲁斯·鲍尔登的公寓里。布鲁斯成了他关键的精神支柱。尼尔后来在 70 Up 里说，他们俩的友谊“很了不起”，背景完全不同的人居然成了朋友，“认识到这一点是好事”（The Guardian，2026）。</p>\n<p>他通过开放大学拿到了文学学士学位——这个辍学生，用函授的方式把大学读完了。更重要的是，他进入了地方政治：他 1982 年就加入了自由党（后来自民党），1996 年当选伦敦哈克尼区议员（870 票），1998 年连任（1233 票），2000 年 10 月辞职。</p>\n<p>从高地流浪汉到伦敦区议员，这中间的跨度，是尼尔一生最了不起的爬升。</p>\n"},{"age":49,"title":"49岁 ——《49 Up》（2005）","html":"<p>49 岁时，尼尔离开伦敦，去了坎布里亚。2003 年他当选伊登区议会议员（代表 Shap 村），2007 年、2011 年连任；2005 年和 2009 年竞选坎布里亚郡议会议员都输给了保守党候选人，2013 年选区调整后当选，一直干到 2017 年连任。</p>\n<p>他 21 岁时说的“想从政”，真的实现了——只是实现的方式很接地气：区议会、郡议会，管的是社区厕所、交通这种事。他还五次代表自民党竞选国会议员（2005 斯托克顿北、2010 卡莱尔、2015/2017 彭里斯、2019 沃金顿），最好成绩是第三名，五次全败。沃金顿那次（2019 年 12 月），他是第四名，还丢了保证金。</p>\n"},{"age":56,"title":"56岁 ——《56 Up》（2012）","html":"<p>56 岁的尼尔还在坎布里亚当议员，而且多了一个身份：平信徒传道人（关于教派有冲突：2012 年 The Arts Desk 说他是圣公会的 lay minister，2019 年之后各媒体统一叫他“浸信会平信徒传道人” lay Baptist preacher——可能是换了教会，也可能是报道口径不一，这里如实记录）。</p>\n<p>《56 Up》里他第一次“稳定”了——住在同一个地方，干着同一份工作。但评论写得依然心酸：他一个人住，“还是身无分文”，“没有事业”；“感情来了又走，从没一个是他主动结束的”。他不停地写作，但找不到读者：“尽管上了这个节目，从来没人对我的写作感兴趣。”（The Arts Desk，2012）</p>\n<p>他谈死亡时很灰暗：70 Up “对我来说就足够了”（&quot;That'll be quite enough for me&quot;）。还说了一句很尼尔的话：“也许我们最幸福的时候，是我们意识不到幸福的时候。”</p>\n"},{"age":63,"title":"63岁 ——《63 Up》（2019）","html":"<p>63 岁时尼尔依然是坎布里亚的区议员和传道人。2019 年的媒体给了他最完整的一次肖像，The Guardian 的标题就是他自己的话：“<strong>我觉得我的人生是个失败</strong>”（“'I see my life as a failure'”，The Guardian，2019）。</p>\n<p>他对《Big Issue》说，7 岁那个说要当宇航员的孩子，“根本不会考虑这些事”；但“总的来说，我不后悔参加这个节目”。他不看电视，没有手机，对真人秀嗤之以鼻。</p>\n<p>2019 年 12 月，他最后一次竞选国会议员（沃金顿），依然失败。NPR 的评论总结 63 岁的他：“在和自己的生理、和不算完美的童年搏斗了一辈子之后，63 岁的尼尔不是没有信仰、朋友和资源。”（wcmu.org，2019）</p>\n"},{"age":70,"title":"70岁 ——《70 Up》（2026）","html":"<p>《70 Up》在 2026 年 9 月 15 日和 22 日分两集在 ITV1 播出，由奥斯卡导演 Asif Kapadia 接替 2021 年去世的 Michael Apted 执导。尼尔的部分是讨论度最高的之一。</p>\n<p><strong>住在哪里。</strong> 他现在长住法国，基本独居，住在从父母那里继承的一栋大房子里——以前是他度假的地方。房子没有中央供暖，他靠壁炉取暖，承认自己烧成堆的纸板保温，几乎见不到人（Entertainment Daily，2026；TV Guide，2026）。节目播出后，观众很担心，一位叫 Jayne Melvin 的粉丝还为他发起了 GoFundMe 众筹取暖费。</p>\n<p><strong>婚姻。</strong> 他法律上仍是已婚，但已经和妻子分居，婚姻只维持了四年。妻子的名字没有公开。反思这段失败，他说：“独居了这么多年，我意识到自己变得比我希望的更自私。”（Entertainment Daily，2026）</p>\n<p><strong>日常。</strong> 他每周的生活有个小结构：每周半天在“一间可爱的书店”做义工，“给了我一周的框架”，还去教堂。</p>\n<p><strong>健康和精神。</strong> 抑郁症从 16 岁跟到现在。回忆最难的岁月：“我睡过推土机，睡过冰冷刺骨的小屋和长椅，在伦敦两个不同的地方占过屋。”他说：“我的背景让我觉得自己是这个冷漠社会的一部分。”（Entertainment Daily，2026）</p>\n<p>他最被引用的一句话，是替所有精神困扰者说的：“<strong>有精神健康问题，不代表他们选择了古怪和反社会。</strong>”完整版是：“如果有人有精神健康问题，不代表他们奇怪，不代表他们选择了古怪和反社会……这不是他们选的，这就是他们。”（The Guardian，2026）</p>\n<p><strong>孤独和满足。</strong> 他承认自己“从来不擅长和人相处”：“即使留下来的朋友，也是因为我不每天见他们。”但他又说，真有危机时，他可以“求助”他们。他看过很多有类似问题的人变成“彻底的隐士”，警告说：“到最后，那对他们没好处。”对自己的状态，他的原话是：“<strong>差不多是我这辈子能达到的最幸福了</strong>”，以及“有时候我还是挺孤独的，但这是我们这个年纪的通病。”（Entertainment Daily，2026）《泰晤士报》的五星评论说：“他能走到今天，已经很不容易了。”</p>\n<p><strong>对 Apted 和节目的看法。</strong> 尼尔对 Kapadia 接手表示欢迎，参加是因为“这是个全新的开始”，也是“最后一次见见其他参与者的机会”。对 Apted，他很克制：“他非常专业，但他知道自己要什么。……Michael 在选择性地使用他手里的素材。我不批评这个，这是导演的权利。但——对观众最大的尊敬——他们没看到真正的我。<strong>这里有一个我，是 Michael 从没发现过的。</strong>”（The Guardian，2026）他不看电视，连《人生七年》自己都不看——“部分是自我保护”。他感谢制作人 Claire Lewis 在参与者之间营造了“大家庭”的感觉，也感谢布鲁斯的友谊，还坦白说：“因为我的人生一直在为钱挣扎，格兰纳达给的那点报酬，时不时帮了大忙。”</p>\n<p>2012 年他说 70 Up “对我来说就足够了”。他做到了。</p>\n"}],"compare":{"title":"7岁的他，和70岁的他","html":"<h3>没变的地方</h3>\n<ul>\n<li><strong>脑子快、嘴皮子利索。</strong> 7 岁时他是 14 个孩子里最会说话的；70 岁时，他依然是金句制造机——“差不多是我这辈子能达到的最幸福了”、“有精神健康问题不代表他们选择了古怪”。表达欲和洞察力，从 7 岁完整保留到了 70 岁。</li>\n<li><strong>理想主义。</strong> 7 岁想当宇航员；中年当传道人、为社区厕所奔走；70 岁还在为精神困扰者发声。他一直想“做点有意义的事”，只是形式变了。</li>\n<li><strong>敏感和自我审视。</strong> 14 岁眼睛里的悲伤，70 岁还在——只是学会了和它共处。他对自己一生的评价诚实得近乎残忍。</li>\n<li><strong>和体制的别扭。</strong> 21 岁在阿伯丁待不下去，28 岁流浪，70 岁住在法国乡下独居——他这辈子就没真正“合群”过。</li>\n</ul>\n<h3>完全改变的地方</h3>\n<ul>\n<li><strong>从万众瞩目到主动隐身。</strong> 7 岁时他是镜头宠儿；70 岁时他不看电视、不用手机，住在法国乡下几乎不见人。从“想被看见”变成了“不想被看见”。</li>\n<li><strong>从漂泊到扎根。</strong> 28 岁无家可归，35 岁还在设得兰群岛的公租房里；42 岁之后，他在坎布里亚扎下来 20 多年，人生第一次有了“根据地”。</li>\n<li><strong>对成功的定义。</strong> 7 岁要当宇航员，21 岁“想成为重要位置上的人”；70 岁时，他的幸福是“每周半天书店义工”和“差不多是我能达到的最幸福”。野心被生活磨成了具体的小确幸。</li>\n</ul>\n<h3>最出人意料的变化</h3>\n<p><strong>他居然从政成功了。</strong> 21 岁那个住在占屋里的退学青年说“我想从政”时，没人当真。但他真的当选了议员，一当 21 年，还五次竞选国会议员。这是全系列最大的反转之一：7 岁时最被看好的孩子跌到最低，又从最低处爬到了一个没人预料的位置。</p>\n<p>另一个反转是：<strong>他接受了自己的失败。</strong> 63 岁时他说“我觉得我的人生是个失败”；70 岁时他说“差不多是我这辈子能达到的最幸福了”。从“我失败了”到“我这样也挺好”，这七年里发生了某种和解。</p>\n"},"conclusion":"<p>一个 7 岁时聪明、快乐、被认为前途无限的孩子，成年后因抑郁症长期漂泊、无家可归；他没有获得传统意义上的事业和家庭成功，却在 42 岁后靠地方政治和信仰慢慢重建了人生；70 岁时他独居法国、烧纸板取暖，没有孩子、婚姻也散了，但他说这是“差不多是我这辈子能达到的最幸福”——他没有战胜命运，但他学会了和命运住在同一屋檐下。</p>\n","sources":"<ul>\n<li>出生年份冲突：Wikipedia 和 Grokipedia 给 1956 年，自由民主党官方候选人名单给 1957 年。未解决，两种都记录。</li>\n<li>教派冲突：The Arts Desk（2012）称他为圣公会 lay minister；2019 年之后各媒体统一称“浸信会平信徒传道人”。可能是换了教会，也可能是报道口径问题，未解决。</li>\n<li>婚姻：有资料称他在《63 Up》（2019）时已结婚、婚后分居；妻子的名字、结婚具体时间均未找到。</li>\n<li>主要来源：The Guardian（2019  profile、2026  preview，经 Brit Brief 等二手转述）、The Big Issue（2019）、The Arts Desk（2012）、Entertainment Daily（2026）、TV Guide（2026）、The Times（2026 五星评论）、Wikipedia（选举记录细节）、Brit Brief（2026）。</li>\n</ul>\n"},"nick":{"id":"nick","name":"尼克·希奇翁","en":"Nick Hitchon","nickname":"约克郡农场的核科学家","avatar":"avatars/nick.jpg","summary":"约克郡山谷里一个 6 岁就被选中的农场孩子，23 岁拿下牛津博士，42 岁成为美国核聚变教授，两度婚姻、一个儿子；2019 年在镜头前公布喉癌，医生说他活不过 2020 年，他多活了三年半，并在去世前 3 天录下给《70 Up》的最后访谈，成为全系列终章的泪点。","class7":"约克郡山谷农场家庭，三个儿子中的老大","education":"牛津大学物理本科、硕士，23 岁获工程科学博士","career":"美国威斯康星大学核聚变教授（电气与计算机工程系）","marriage":"与第一任妻子离婚，2001 年再婚","children":"1 个儿子（Adam）","turning":"1982 年移居美国；2019 年确诊喉癌","status70":"2023 年 7 月 23 日因喉癌去世，享年 65 岁；70 Up 以他去世前 3 天的访谈谢幕","alive":false,"tags":["工薪阶层","上大学","离婚","再婚","移民","已去世","退休"],"intro":"<p>尼克是《人生七年》里“阶级跨越”最彻底的一个：约克郡山谷里的农场孩子，6 岁（他其实没满 7 岁）被选中时说想“搞清楚月亮和那些东西”，23 岁拿下牛津博士，42 岁成为美国威斯康星大学的核聚变教授。他的人生看起来是全系列最“成功”的那条线：名校、教授、移民美国。但 2019 年，他在镜头前公布自己得了喉癌、瘦了 60 磅，医生说他活不过 2020 年。他多活了三年半，2023 年 7 月在去世前 3 天录下了给《70 Up》的最后一段访谈——那段访谈成了全系列终章最催泪的段落。</p>\n","background":"<p>尼克全名 William Nicholas Guy Hitchon，1957 年 10 月 22 日出生在约克郡的 Skipton，是三个儿子中的老大，父亲 Guy、母亲 Iona。家在约克郡山谷 Littondale（也有资料说是 Arncliffe 村附近的 Hawkswick 小村）的一个小农场。他最早上的是 Arncliffe 的一间单教室村小，据说离家要走四英里山路。</p>\n<p>1968 年到 1975 年，他上了 Skipton 的 Ermysted's 文法中学，在那里科学天赋开始冒头，体育也很好——他是校橄榄球队队长，还入选过约克郡校队。然后他去了牛津大学 Merton 学院读物理：1978 年本科毕业，1979 年硕士，1981 年 23 岁就拿到了工程科学博士。</p>\n<p>阶级对尼克的影响，是全系列最有代表性的“正面教材”：一个农场孩子，靠英国的教育选拔体系（村小→文法中学→牛津），硬是走到了核聚变教授的位置。他后来自己也说过，搬去美国给了他“在英国得不到的机会和生活水平”（Daily Mail，2021）。但这种跨越的代价是：他一辈子都觉得自己在镜头里被当成了“乡巴佬”。</p>\n","ages":[{"age":7,"title":"7岁 ——《Seven Up!》（1964）","html":"<p>尼克其实是个“作弊”选手：他出生于 1957 年 10 月，1964 年拍《Seven Up!》时只有 6 岁。传说是导演 Michael Apted（当时还是调研员）在约克郡找不到愿意说话的农村孩子，有人跟他说“这孩子肯定愿意说”，发现他只有 6 岁后，调研员觉得“6 岁也差不多”（Madison.com 家族讣告，2023）。</p>\n<p>6 岁的农场小子说出了跟随他一辈子的话：“我想搞清楚月亮和那些东西”（&quot;find out all about the moon and all that&quot;）。但他坚决拒绝谈论女孩——害羞得可爱。</p>\n<p>这个细节后来成了全系列最动人的伏笔：一个 6 岁的孩子说要研究月亮，60 年后，他真的成了研究等离子体和核聚变的科学家。耶稣会那句“7 岁看 70 岁”，在尼克身上应验得最漂亮。</p>\n"},{"age":14,"title":"14岁 ——《7 Plus Seven》（1970）","html":"<p>14 岁（实际 13 岁）的尼克在 Ermysted's 文法中学，对科学的热爱已经很明显了，还是个运动健将。评论说他是个“害羞的少年”，说的还是 6 岁时关于月亮的那套话。这个年龄段的英文媒体记录不多，但轨迹很清楚：村小→文法中学→牛津的路，已经铺好了。</p>\n"},{"age":21,"title":"21岁 ——《21 Up》（1977）","html":"<p>21 岁（实际 19 岁）的尼克已经在牛津读博士后课程了——23 岁拿博士学位，大多数同龄人本科还没毕业。有资料说他在《21 Up》时已经认识了第一任妻子 Jacqui Bush，牛津的本科同学，1979 年两人结婚（Wikipedia；The Sun，2026）。</p>\n"},{"age":28,"title":"28岁 ——《28 Up》（1984）","html":"<p>这是尼克人生的决定性一跃：1981 年拿到牛津博士后，1982 年他带着妻子 Jacqui 搬到了美国，加入威斯康星大学麦迪逊分校电气与计算机工程系，继续核聚变研究（UW-Madison 讣告，2023）。他这一待就是四十年。</p>\n<p>Jacqui 在《28 Up》里和他一起出镜，但观众对她的评价很刻薄，有人断言这段婚姻“注定完蛋”。她从此拒绝再被拍摄（《35 Up》《42 Up》都没出现）（Daily Mail Femail，2021）。Apted 当年甚至在镜头前预言过这段婚姻会失败——尼克后来一直记着这件事。</p>\n"},{"age":35,"title":"35岁 ——《35 Up》（1991）","html":"<p>35 岁时尼克已经在威斯康星站稳脚跟，妻子拒绝拍摄，婚姻在镜头前 visibly 吃力。英文媒体对他这一集的具体内容记录很少，但能看出：事业在上升，婚姻在下沉。</p>\n"},{"age":42,"title":"42岁 ——《42 Up》（1998）","html":"<p>42 岁，尼克 1994 年升为正教授，事业进入巅峰。也是在 42 岁左右，他和 Jacqui 离婚了（有报道说“在 42 岁离婚”，Daily Mail，2026），儿子 Adam 出生——尼克后来在镜头前说：“<strong>我这辈子最纯粹、最不掺假的快乐，就是儿子出生被放到我手里的那一刻。</strong>”（Daily Mail，2026）</p>\n<p>专业上他继续巩固：1999 年到 2002 年担任系主任。后来他总结这段研究岁月时说，自己的长期研究到最后“过时了”，让他很失望（rogerebert.com，2019）。这是科学家特有的遗憾：不是没做出东西，是做出的东西被时代超过了。</p>\n"},{"age":49,"title":"49岁 ——《49 Up》（2005）","html":"<p>49 岁时尼克已经离婚，出现在一段新恋情里。BFI 的评论说，他“被一个搞了很多年的宏大计算机项目的失败震得不轻”（BFI Sight and Sound，2005）。2001 年，他和大他十岁的 Cryss Brunner 结婚了——她是明尼阿波利斯的一名教师（The Sun，2026）。这是他的第二段婚姻。</p>\n"},{"age":56,"title":"56岁 ——《56 Up》（2012）","html":"<p>56 岁时尼克和 Cryss 安顿下来，继续在威斯康星教书做研究。他和另一个参与者苏西成了朋友——两个“农村孩子”在节目里找到了彼此。</p>\n<p>这一年还有个重要的插曲：2014 年他上 NPR 的节目《Wait Wait... Don't Tell Me!》，说他不喜欢节目早期把他拍成的样子：“<strong>很明显他们把我拍成了一个乡巴佬。我是说，你知道，我很生气。</strong>”（Daily Mail Femail，2021）这是尼克对节目最直接的一次抱怨：阶级跨越成功了，但镜头里的“农场小子”标签撕不掉。</p>\n"},{"age":63,"title":"63岁 ——《63 Up》（2019）","html":"<p>《63 Up》里，尼克在镜头前公布了全系列最沉重的一个消息：他得了喉癌。</p>\n<p>“<strong>你们看得出来，过去一年我瘦了 60 磅，我病得很重。我的喉咙里有癌症，我不知道预后……我不知道会发生什么。所以我现在不太考虑长远的未来，我只考虑眼前的未来。</strong>”（Daily Mail，2019）他说自己大概活不过 2020 年底。</p>\n<p>Apted 后来回忆，尼克是《63 Up》最后一个拍的，剧组被告知他“可能几天或几周内就去世”，只能每次拍十分钟——结果尼克给了整整一个半小时的访谈：“他非常、非常平静，非常、非常酷……他和我真的很亲近。他是这一切的中流砥柱，从没让我失望。”（nightviz.ca，2019）</p>\n<p>他对 NPR 说，参加这个节目“很不舒服”，“但人们觉得它重要，我觉得不舒服、有时很不开心，不代表我应该停下来。”（NPR，2019）</p>\n"},{"age":70,"title":"70岁 ——《70 Up》（2026）：身后的谢幕","html":"<p>尼克没能活到 70 岁。2023 年 7 月 23 日，他在威斯康星麦迪逊因喉癌去世，享年 65 岁——距离录完最后一段访谈，只有 3 天（Wikipedia；The Sun，2026）。他是 14 个人里第二个去世的（第一个是 2013 年去世的林恩）。</p>\n<p>但他的最后访谈成了《70 Up》第二集的情感核心。镜头在 6 岁梦想月亮的孩子和 65 岁骨瘦如柴的老人之间切换。他虚弱得走不了几步，说起 2022 年秋天的中风，说自己还活着“连医生都意外”：“<strong>我没想到自己会病成这样，也没想到自己还能活着……我还活着，医生们都很惊讶</strong>”；说起拖累家人：“<strong>大家都得替我收拾，我觉得很对不起他们</strong>。”（TV Guide，2026；Entertainment Daily，2026）</p>\n<p>他谈起自己的人生哲学，那是约克郡山谷里长出来的：“<strong>我这辈子一直在做的，就是纵身跳进那些吓人的事情里……在山谷里，你就是一直往前推，一直推，一直推。</strong>”</p>\n<p>最后他说，参加这些电影对他“极其重要”，结尾那句话让无数观众落泪：“<strong>等你们收拾东西走了——我很确定我们不会再拍了——我会觉得生命里缺了一块，那种感觉，我从 6 岁起就没再有过。</strong>”（Entertainment Daily，2026）节目用字幕确认：拍摄 3 天后，他去世了。</p>\n<p>《泰晤士报》的评论引用了他早年一句发光的话：“<strong>你看过那种延时摄影吗，花开了，又谢了。在一个人身上看到这个，太神奇了……看一个人随时间变化的全貌。</strong>”——他成了这句话本身。</p>\n<p>他的弟弟 Andrew（约克的记者）在《每日电讯报》撰文，说尼克是铁了心要录完这段访谈：“他是个意志坚定的人，我觉得他是想把 6 岁开始的事做完。”他希望《70 Up》能给所有参与者一个“体面的了结”。</p>\n"},{"age":null,"title":"2020–2023：最后的岁月","html":"<p>尼克没有按医生的剧本走。他多活了三年多，2022 年春天才从威斯康星大学退休（Madison.com 家族讣告，2023）。2022 年秋天他中风了——他在最后的访谈里透露，医生反复问他妻子 Cryss，要不要“就让他走”（TV Guide，2026；Entertainment Daily，2026）。</p>\n<p>但他没停下来。制作人 Claire Lewis 对《泰晤士高等教育》说：“<strong>直到最后一刻，临死前，尼克还在手机上批改学生的论文。他病得那么重，但脑子完全清楚。他对学生的投入，难以置信。</strong>”（The Sun，2026，转述）</p>\n<p>2021 年 1 月 Apted 去世，很多人以为系列就到《63 Up》为止了。但 2023 年，身患绝症的尼克给 Claire Lewis 发了一封“几乎是加密的邮件”，说他想参加《70 Up》（Daily Mail，2026）。《70 Up》当时还没立项，Lewis 说服 ITV 派她和摄制组飞到威斯康星，录下了最后一段访谈。</p>\n"}],"compare":{"title":"7岁的他，和70岁的他","html":"<h3>没变的地方</h3>\n<ul>\n<li><strong>对“搞清楚”的执念。</strong> 6 岁想“搞清楚月亮和那些东西”，65 岁临死前还在手机上批改学生的论文。对世界的好奇和对学生的责任，从头到尾没变。</li>\n<li><strong>约克郡山谷的硬气。</strong> “一直往前推，一直推”——这种闷头硬扛的劲儿，是农场孩子带出来的，一辈子没丢。</li>\n<li><strong>不服镜头。</strong> 14 岁拒绝谈女孩，56 岁公开说节目把他拍成“乡巴佬”让他生气——他从来不为镜头表演顺从。</li>\n</ul>\n<h3>完全改变的地方</h3>\n<ul>\n<li><strong>从英国农场到美国教授。</strong> 地理和阶级的双重跨越：约克郡山谷→牛津→威斯康星，农场孩子→核聚变教授。</li>\n<li><strong>从害羞到坦然面对死亡。</strong> 6 岁拒绝谈论女孩的害羞男孩，65 岁能在镜头前平静地谈论自己的死亡和葬礼。</li>\n<li><strong>对节目的态度。</strong> 从“被拍成乡巴佬”的愤怒，到“极其重要”、临死前 3 天也要录完——他和这个节目和解了。</li>\n</ul>\n<h3>最出人意料的变化</h3>\n<p><strong>他本该在 2020 年就去世，却多活了三年半，而且是用这三年半给全系列画上了句号。</strong> 2019 年所有人都以为这是告别，结果他活到了 2023 年，还主动要求录《70 Up》。更出人意料的是：这个一辈子抱怨节目把他拍成“乡巴佬”的人，最后成了全系列终章里最动人的段落——他用自己的死亡，给“7 岁看 70 岁”这句话做了最完整的注脚。</p>\n"},"conclusion":"<p>一个约克郡农场的孩子，靠读书一路读到牛津博士、美国教授，完成了全系列最彻底的阶级跨越；但他一辈子都没甩掉“乡巴佬”的标签，也没躲过喉癌；他在 65 岁去世前 3 天录下最后访谈，用自己的死亡证明了：人生最动人的部分，从来不是你爬到了多高，而是你愿不愿意把最后一段路也走完、说完。</p>\n","sources":"<ul>\n<li>拍摄时年龄：尼克在《Seven Up!》时只有 6 岁（不是 7 岁），每集都比标题小一岁（Madison.com 家族讣告，2023）。</li>\n<li>离婚年份：没有权威来源给出与 Jacqui Bush 离婚的确切年份，资料指向 1998–2001 年之间，有报道称“在 42 岁离婚”。</li>\n<li>主要来源：UW-Madison 工程学院官方讣告（2023）、Madison.com 家族讣告（弟弟 Andrew 撰写，2023）、The Telegraph 讣告（2023）、The Guardian “other lives”讣告（弟弟 Andrew 撰写，经二手转述）、NPR（2019）、The Times（2026）、The Sun（2026）、TV Guide（2026）、Entertainment Daily（2026）、Wikipedia。</li>\n</ul>\n"},"tony":{"id":"tony","name":"托尼·沃克","en":"Tony Walker","nickname":"没当成骑师的出租车司机","avatar":"avatars/tony.jpg","summary":"7 岁时说“长大要当骑师”，14 岁时又补了一句“如果不行就去开出租车”——两句话全中了：他只跑了 3 场职业赛马就因超重退役，然后开了几十年伦敦出租车；1998 年在镜头前承认出轨，婚姻差点散了，但和妻子 Debbie 厮守 46 年；70 岁住在埃平森林的房车里半退休，说“人生最后九洞，我打得很开心”。","class7":"伦敦东区工人家庭，父亲坐过牢，母亲酗酒","education":"没怎么好好读书，很早就进赛马马厩训练","career":"伦敦黑色出租车司机（The Knowledge 考出来的）","marriage":"1979 年与 Debbie 结婚，46 年婚姻，曾出轨但和好","children":"3 个孩子，3 个孙辈","turning":"体重超标断送骑师梦；42 岁在镜头前承认出轨","status70":"埃平森林房车半退休，与 Debbie 厮守，三个孩子三个孙辈","alive":true,"tags":["工薪阶层","没上大学","有孙辈","退休"],"intro":"<p>托尼是《人生七年》里“7 岁看 70 岁”应验得最准的一个——7 岁时他说长大要当骑师，14 岁时补了一句“如果当不成骑师，就去开出租车”，结果两句话全中了：他只跑了 3 场职业赛马就因为太重退役，然后开了几十年伦敦出租车。他的人生不算“成功”，但热闹：演过戏、开过酒吧、去西班牙买过房又被金融危机打回来、1998 年在镜头前承认出轨差点把婚姻作没。70 岁时，他和妻子 Debbie 结婚 46 年，住在埃平森林的房车里半退休，用高尔夫打比方：“我的人生打到了最后九洞，我很开心。”</p>\n","background":"<p>托尼 1955 年 9 月 14 日出生在伦敦东区的 Bethnal Green，父母是 John 和 Nellie Walker。他的原生家庭是 14 个人里最难的之一：父亲在他小时候坐过牢，母亲酗酒。他有两兄弟一姐妹——开出租车似乎是家传的：三个兄弟姐妹都成了伦敦出租车司机，他说家里“大概有 22 口人”干这行，包括他妻子和一个儿子（Wikipedia，2026，转述 2021 年伦敦出租车司机俱乐部采访）。</p>\n<p>他成长于五六十年代的东区工人社区：公租房、街市，街区里还残留着 Kray 双胞胎黑帮的阴影。Apted 后来承认，因为托尼的出身，他一度觉得托尼“可能变成罪犯”（Radio Times，2026）。</p>\n<p>他父母对镜头 Pragmatic 得很：2026 年托尼回忆，父母当年同意他参加 1964 年的拍摄，部分原因是剧组“给了 10 英镑”——“在当时是笔巨款，我那时候就没见过 10 英镑……我觉得我家需要这笔钱。”（LadBible，2026）“一百万年里没人想到这会是一辈子的事。”</p>\n<p>阶级对托尼的影响是全系列最直白的：东区工人孩子，没有学历，职业选项从一开始就很窄——骑师、出租车司机，都是靠身体和手艺吃饭的活。但反过来说，他的起点也给了他一样东西：一种街头练出来的生命力，让他在 70 岁时比很多“精英”都活得开心。</p>\n","ages":[{"age":7,"title":"7岁 ——《Seven Up!》（1964）","html":"<p>7 岁的托尼是节目里典型的东区男孩：活泼、话多、坐不住，大部分出镜时间都在和三个 Kensington 的富家男孩打架——节目用这个画面做阶级对比，简单粗暴但有效。</p>\n<p>他说了那句被引用六十年的话：“<strong>我长大要当骑师。嗯，我长大要当骑师。</strong>”（NPR，2019）旁白介绍他的同班同学 Michelle 是他的“女朋友”，Michelle 则说托尼是只“猴子”。</p>\n<p>耶稣会那句“7 岁看 70 岁”，在托尼身上被验证得最彻底：他 7 岁的预言，准确说中了他成年后的两份工作。</p>\n"},{"age":14,"title":"14岁 ——《7 Plus Seven》（1970）","html":"<p>14 岁时，托尼已经在赛马马厩训练了，骑师梦正在认真推进。NPR 后来总结说，少年托尼“以惊人的准确度预言了自己的未来：先当骑师，然后（‘如果我不够好’）去开出租车”（KHSU/NPR，2019）。括号里那句“如果我不够好”，是纯粹的托尼式幽默——做着大梦，还不忘给自己留条后路。</p>\n"},{"age":21,"title":"21岁 ——《21 Up》（1977）","html":"<p>梦碎了。托尼只跑了 3 场职业赛马就放弃了：他长得太壮，压不住骑师的体重。他后来一辈子都说，放弃骑马是他“最大的遗憾”，一位师傅当年警告过他体重会是个问题（Wikipedia，2026，转述《70 Up》）。</p>\n<p>但他有一件很骄傲的事：他和自己的偶像、传奇骑师 Lester Piggott 同场比过赛。</p>\n<p>21 岁时他在“狗赛场闲逛”，Apted 后来回忆：“托尼 21 岁时在狗赛场混……我确信他 28 岁前会进监狱。”（Daily Mail，2021）结果同一年，托尼开始准备 The Knowledge——伦敦出租车司机那场以变态难著称的街道考试。命运的岔路口，他选了那条更稳的路。</p>\n"},{"age":28,"title":"28岁 ——《28 Up》（1984）","html":"<p>28 岁，托尼考出来了，成了伦敦黑色出租车司机——这份工作定义了他的一生。1979 年他和 Debbie 结了婚，拍《28 Up》时 Debbie 正怀着第三个孩子。</p>\n<p>这个阶段他还有两条支线：一是演戏——读了一本 James Dean 的传记后迷上了表演，加入了临时演员协会，80 年代中期开始上表演课（《28 Up》里有他上课的镜头）；二是生意——80 年代初到中期，他在 Islington 开过一家叫 Rotherfield Arms 的酒吧，几年后卖掉，回去开出租车。小报还说他去好莱坞闯过、给《太阳帝国》里 Christian Bale 当过替身——这部分只有小报在说，没别处证实，这里如实标注存疑。</p>\n"},{"age":35,"title":"35岁 ——《35 Up》（1991）","html":"<p>中年这一集，托尼的故事从欢乐转向复杂。Debbie 透露，她在《28 Up》时怀的那个孩子没保住，但之后又生了一个；失去孩子给他们的关系带来了巨大压力。托尼自己在镜头前承认，一夫一妻“越来越让他吃力”。</p>\n"},{"age":42,"title":"42岁 ——《42 Up》（1998）","html":"<p>吃力变成了自白。1998 年，托尼在镜头前承认出轨：“我知道我以前混蛋过，但那是很久以前的事了。我们有起有落，就昨晚我们还大吵了一架。”——吵架的原因是给女儿钱的事（The Observer，2026）。</p>\n<p>这时候全家已经搬出东区，去了 Essex。托尼开着出租车满伦敦跑，还在不知情的情况下拉过好几个《人生七年》的参与者——John、Lynn、Neil 都坐过他的车（Wikipedia，2026）。神奇的是，他和 Debbie 熬过了出轨，没离婚。</p>\n"},{"age":49,"title":"49岁 ——《49 Up》（2005）","html":"<p>49 岁的托尼正在走上坡路：名下两套房，包括西班牙的一套度假屋，正计划把全家——妻子、孩子、孙辈——都搬去西班牙，站在西班牙房子的露台上对镜头说：“我喜欢和自己人待在一起。”</p>\n<p>他和东区三个女孩（Jackie、Lynn、Sue）走得最近。2013 年 Lynn 突然去世时，是托尼开车拉着大部分演员去的墓地（The Observer，2026）。</p>\n"},{"age":56,"title":"56岁 ——《56 Up》（2012）","html":"<p>56 岁时，据说托尼一年有一半时间住在西班牙，还 fondly 回忆曾经拉过宇航员 Buzz Aldrin——结果同行要的是托尼的签名，不是宇航员的（The American Spectator，2012）。</p>\n<p>这一集最著名也最有争议的一幕：Apted 问托尼，他关于移民改变东区的言论“听起来像种族主义”。托尼 defensive 地顶了回去，还带着点讽刺地指出，斋月让他的出租车生意变好，帮他度过了艰难时期。2026 年托尼还耿耿于怀：“Michael 问我是不是种族主义者时，我惊呆了。我真的很爱 Michael，把他当朋友、当传奇导演，但我觉得那是侮辱。”（Radio Times，2026）</p>\n<p>个人方面，2010 年代他因肺栓塞住过院（Wikipedia，2026）。</p>\n"},{"age":63,"title":"63岁 ——《63 Up》（2019）","html":"<p>西班牙篇章烂尾了。托尼在西班牙买了公寓，想开自己的体育酒吧，结果 2008 年金融危机后当地经济崩盘，计划全泡汤。他收拾行李回了英格兰，和 Debbie 定居在埃平森林的一个村子里：“ surrounded by nature……没那么大压力，更安定了。事实上，生活好得不能再好！”（TV Times，2019）回去继续开出租车，却发现 Uber 正在吃掉黑牌车的市场。</p>\n<p>政治上，63 岁的托尼在动：他投了脱欧票，但后来又后悔了（NPR，2019 的说法；也有报道说他对保守党失望到想下次投绿党）。他说自己从没变过：“<strong>你看我 7 岁的样子，再看我现在，快成老头了，我还是那个没心没肺、什么都有话说的 cheeky chappy。我一点没变！</strong>”（TV Times，2019）节目里还拍到他和 Debbie 帮着带一个孙女。他说拍摄“挺治愈的……我 100% 信任 Michael Apted，我忘了摄像机，就觉得在跟他聊天。”</p>\n"},{"age":70,"title":"70岁 ——《70 Up》（2026）","html":"<p>70 岁的托尼是终章里最有活力的大爷。《70 Up》2026 年 9 月 15 日和 22 日播出，由 Asif Kapadia 接替 2021 年去世的 Apted 执导。</p>\n<p>他和 Debbie 住在《Observer》说的“埃平森林那辆一尘不染的房车”里（名下在伦敦 Woodford Green 和西班牙 Alicante 还有房）。他说自己半退休了：“<strong>我想做的都做完了，听起来可能有点傻。我 70 岁的人生打到了最后九洞，半退休，很幸福。</strong>”（《70 Up》，2026）</p>\n<p>终章的情感核心是他和 Debbie 的 46 年婚姻。Debbie 从《28 Up》起就出镜，她一直说：“说实话，我从来不想上这个节目……但为了托尼我上了。”（The Observer，2026）熬过出轨并不容易，Debbie 说：“我也不知道自己是怎么熬过来的，说实话，有时候我觉得我根本没熬过去。但我还在这里。我还能說什么？”托尼回答：“<strong>从见到你的那一刻起我就一直爱你，不管我做过什么……我在这里，你在这里，46 年后我们还在这里。</strong>”</p>\n<p>托尼有 3 个孩子、3 个孙辈，Debbie 自己后来也成了出租车司机（Wikipedia，2026）。回顾一生，他对 Radio Times 说：“回头看，我看到了当时看不到的东西。我爸我妈，我爸妈为我上节目多骄傲……我妈特别骄傲，会去肉铺跟人说：‘嘿 Ted，你昨晚在电视上看到我儿子了吗？’……<strong>我混得不差，全靠自己一双手。</strong>”</p>\n<p>节目要结束了，他很舍不得：“我很难过它要结束了——我想继续，不是因为我自负或爱出风头——<strong>但这是我的人生，我活在这个节目里。</strong>”（Radio Things，2026）</p>\n<p><strong>对 Apted。</strong> 托尼对 Apted 的感情是所有参与者里最浓烈的。2021 年 Apted 去世，他对 PA 通讯社说“电影界熄灭了一盏明灯”，叫 Apted“非常好的人，非常忠诚的人……更像家人”，“我们对他的信任，无与伦比”（PA，2021）。他去参加 Apted 电影的首映（包括 1999 年的 007《黑日危机》），他孙女还和 Apted 的儿子是朋友。2026 年接受《Observer》采访时他哭了：“<strong>一想到他我就过不去那个坎，忍不住难过。我把整个人生都托付给了他。我觉得他爱我，我也爱他。他不是所有演员都喜欢的那杯茶，但对我来说，他像个爸爸。</strong>”</p>\n<p>Apted 也早就改观了：“托尼，我们都笑他——也笑话他——但他心好。<strong>他的心比我以为的好多了。我真以为他会进监狱。他挺过来了，真是不可思议。他是个很聪明的家伙，人生做了很多正确的决定。他的人生不容易。</strong>”（Toronto Star，2019）</p>\n<p>晚年还有个小花絮：2023 年他创办了“伦敦出租车司机合唱团”，18 个合唱团之一，在温莎城堡为查尔斯三世加冕音乐会献唱（Wikipedia，2026；Classic FM）。</p>\n"}],"compare":{"title":"7岁的他，和70岁的他","html":"<h3>没变的地方</h3>\n<ul>\n<li><strong>没心没肺的 cheeky chappy。</strong> 7 岁时和富家男孩打架还嬉皮笑脸，70 岁时自称“什么都有话说”。他自己说的“我一点没变”，基本是真的。</li>\n<li><strong>对家庭的执着。</strong> 7 岁时节目介绍他的“女朋友”Michelle；70 岁时和 Debbie 46 年，还在镜头前深情告白。对“自己人”的看重，一辈子没变。</li>\n<li><strong>生命力。</strong> 东区街头练出来的那股劲儿——Apted 以为他会进监狱，他偏偏活成了最开心的大爷。</li>\n</ul>\n<h3>完全改变的地方</h3>\n<ul>\n<li><strong>从追梦少年到认命的中年人，再到和解的老人。</strong> 7 岁要当骑师，21 岁梦碎，28 岁认命开出租车，70 岁说“我想做的都做完了”。野心→认命→知足，三段式。</li>\n<li><strong>和 Apted 的关系。</strong> 从被导演“以为会进监狱”的问题少年，到“把整个人生托付给他”、视如父亲。托尼是全系列里和 Apted 和解得最彻底的人。</li>\n<li><strong>经济状况。</strong> 7 岁时家里为 10 英镑参加节目；70 岁时名下多处房产、西班牙度假屋（虽然酒吧计划黄了）。东区穷小子，靠自己攒下了一份家业。</li>\n</ul>\n<h3>最出人意料的变化</h3>\n<p><strong>他居然成了全系列最幸福的人之一。</strong> Apted 21 岁时断言他 28 岁前会进监狱；结果他 70 岁时，有 46 年的婚姻、3 个孩子、3 个孙辈、自己的房子，半退休晒太阳。7 岁时最被看好的尼尔跌到了谷底，7 岁时最被看衰的托尼却活成了“人生赢家”——不是钱意义上的，是“开心”意义上的。这个反转让“7 岁看 70 岁”这句话变得很复杂。</p>\n"},"conclusion":"<p>一个 7 岁时说要当骑师的东区穷小子，只跑了 3 场职业赛马就因超重退役，转头开了几十年出租车；他出过轨、开过酒吧、去西班牙买过房又被金融危机打回来，但和妻子 Debbie 厮守 46 年、儿孙满堂；70 岁时他住在埃平森林的房车里半退休，说人生打到了“最后九洞”——他没实现 7 岁的梦，但他活成了 7 岁时那个快乐男孩的 70 岁版本。</p>\n","sources":"<ul>\n<li>脱欧立场：NPR（2019）说他后悔投脱欧，The Arts Desk 说他想转投绿党，《Observer》（2026）总结为投了脱欧但动摇。共同点是投了 Leave、之后公开动摇。</li>\n<li>好莱坞经历：The Sun（2026）说他给《太阳帝国》的 Christian Bale 当过替身——只有小报在说，未经证实。</li>\n<li>主要来源：The Observer（2026）、Radio Times（2026）、TV Times（2019）、NPR（2019）、The Arts Desk（2019）、PA 通讯社（2021）、Wikipedia（2026，转述托尼官网和伦敦出租车司机俱乐部采访）。</li>\n</ul>\n"},"peter":{"id":"peter","name":"彼得·戴维斯","en":"Peter Davies","nickname":"骂过政府的乡村歌手","avatar":"avatars/peter.jpg","summary":"利物浦工薪家庭的孩子，7 岁时和尼尔一起说要当宇航员，28 岁时在镜头前痛骂撒切尔政府，被小报围攻后退出节目 28 年；消失的岁月里他离婚、改学法律、进了公务员系统、再婚生子；56 岁为宣传自己的乡村乐队回归，70 岁时已是全职音乐人和作家，出了小说、写了音乐剧。","class7":"利物浦工薪家庭，和尼尔同校","education":"伦敦大学历史学位，后改学法律","career":"教师→公务员（皇家检察署）→全职音乐人、作家","marriage":"离婚后再婚（第二任妻子是乐队搭档 Gabi）","children":"2 个孩子（与第二任妻子）","turning":"1984 年在镜头前痛骂撒切尔，被小报围攻后退出节目 28 年","status70":"与妻子定居利物浦，全职写歌、写小说、写音乐剧","alive":true,"tags":["工薪阶层","上大学","离婚","再婚","退出过节目","退休","心理健康问题"],"intro":"<p>彼得是《人生七年》里“消失”最久的人。7 岁时他和尼尔是利物浦同校的两个小伙伴，一起说长大要当宇航员；28 岁时，他成了留着胡子的中学教师，在镜头前把撒切尔政府骂了个狗血淋头，结果被英国小报围攻，愤而退出节目——一退就是 28 年，《35》《42》《49》三集全缺席。消失的岁月里，他离婚、改学法律、进了公务员系统（干过皇家检察官）、再婚生子、搬回利物浦。56 岁他回来了，坦白说回来就是为了宣传自己的乡村乐队；70 岁时，他已经是全职音乐人和作家，出了小说、写了音乐剧，还公开谈论自己的抑郁症。他是全系列里“第二人生”过得最像样的人之一。</p>\n","background":"<p>彼得约 1957 年出生在利物浦（确切出生日期没有任何公开资料，这是推算），工薪家庭。他自己 2026 年说：“我觉得他们漏掉了一个新下层中产阶级的出现——像我这样的人，父母是工人阶级，但靠着一个资源充足的福利国家和公立教育体系，走出了那个背景，上了大学，改变了人生。”（Daily Mirror，2026）</p>\n<p>他和尼尔上的是同一所利物浦郊区的综合中学。阶级对彼得的影响是全系列最“教科书”的一例：工人家庭的孩子，靠公立教育和大学，完成了向中产的跨越——教师、公务员，都是典型的“新下层中产”职业。他后来的人生证明，这种跨越是真的，但代价是：你得先被体制推上风口浪尖（28 岁那次），再花几十年找自己真正想干的事。</p>\n","ages":[{"age":7,"title":"7岁 ——《Seven Up!》（1964）","html":"<p>1964 年，7 岁的彼得和尼尔一起出现在利物浦学校的镜头里。和尼尔一样，他说长大想当宇航员。两个男孩成了节目早期的标志性画面：“利物浦中产二人组”。</p>\n<p>节目用他和尼尔做对比装置：同样的起点、同样说要当宇航员。六十年后再看，这个对比成了全系列最妙的一笔——起点几乎一样，人生却天差地别。</p>\n"},{"age":14,"title":"14岁 ——《7 Plus Seven》（1970）","html":"<p>14 岁的彼得，公开资料里几乎没有单独的记录。他和尼尔还是学生，宇航员梦开始撞上青春期的现实。这一集最大的意义是确立了“每七年回来一次”的格式，彼得只是安静地在其中。</p>\n"},{"age":21,"title":"21岁 ——《21 Up》（1977）","html":"<p>21 岁时彼得在读大学，学历史。官方发行资料说他“拿到了伦敦大学的历史学位”（First Run Features，2012），Wikipedia 的说法是他在大学里“ drifted through”（混日子）——大概是个没什么方向的学生，但左翼立场已经很明显了。这份政治热情，七年后会把他推上风口浪尖。</p>\n"},{"age":28,"title":"28岁 ——《28 Up》（1984）：纠察线、撒切尔与退出的导火索","html":"<p>这是彼得全系列最著名、也最要命的一次出镜。</p>\n<p>1984 年，28 岁的彼得是个已婚的中学教师，留着胡子，情绪激烈，在镜头前对着撒切尔政府开火。那句被 2026 年媒体反复引用的话是：“<strong>这是我们有过的最无能、最没人性的 bloody 政府</strong>”（&quot;the most incompetent, uncaring bloody shower we've ever had&quot;，Daily Mirror，2026）。他谈的是政府砍教育经费（The Times，2026）。</p>\n<p>播出后，小报向他开炮。他回忆其中一个标题是：“<strong>你愿意让这种人教你孩子吗？</strong>”（Daily Mirror，2026）。在《63 Up》里他说，自己被右翼小报 caricature 成了“愤怒的年轻红色分子”（Film Comment，2019）。</p>\n<p><strong>他退出了。</strong> 他的说法一直很一致：小报的恶毒让他决定不再参加。“我很震惊这些报纸能这么恶毒，我决定不想再来一次，就退出了。”（Life Up North，2026）他还怪剪辑，直接跟 Apted 说：“<strong>你把我浓缩成了一个 caricature——来自英格兰北部的愤怒青年。</strong>”（Daily Mirror，2026）</p>\n<p>职业上，他在《28 Up》后不久离开了教师行业。关于他是“被小报搞丢了工作”还是“自己辞职”，资料有冲突：老版 Wikipedia 说他因小报运动丢了教职，有粉丝 wiki 说他在《56 Up》里否认被开除、说是自己走的；官方发行资料的中性说法是“在《28 Up》后不久离开了教师行业”（First Run Features，2012）。这里如实记录冲突：被开除一说未经证实。</p>\n<p>为什么这件事重要？因为这是全系列第一次有人因为“在镜头前说了真话”而付出代价。彼得 28 岁的遭遇，提前几十年预言了今天的“社死”：在镜头前表达政治观点，然后被舆论反噬。他用退出节目做了抵抗。</p>\n"},{"age":35,"title":"35岁 ——《35 Up》（1991）与 42岁 ——《42 Up》（1998）：缺席的岁月","html":"<p>彼得缺席了《35 Up》和《42 Up》。他的人生只通过 Apted 在《42 Up》里的导演旁白交代：他离了婚、学了法律、成了律师/进入公务员系统、再婚、有了孩子、搬回利物浦（Wikipedia）。</p>\n<p>消失的十几年，他完成了一次彻底的职业再造：从教室里的教师，到法学院学生，再到公务员。2012 年的资料说他在<strong>就业与养老金部</strong>（Department of Work and Pensions）工作（theartsdesk.com，2012），2026 年的 profile 说他的职业生涯“包括教书和当皇家检察官”（Life Up North，2026）——也就是刑事司法系统的公务员。</p>\n"},{"age":42,"title":"35岁 ——《35 Up》（1991）与 42岁 ——《42 Up》（1998）：缺席的岁月","html":"<p>彼得缺席了《35 Up》和《42 Up》。他的人生只通过 Apted 在《42 Up》里的导演旁白交代：他离了婚、学了法律、成了律师/进入公务员系统、再婚、有了孩子、搬回利物浦（Wikipedia）。</p>\n<p>消失的十几年，他完成了一次彻底的职业再造：从教室里的教师，到法学院学生，再到公务员。2012 年的资料说他在<strong>就业与养老金部</strong>（Department of Work and Pensions）工作（theartsdesk.com，2012），2026 年的 profile 说他的职业生涯“包括教书和当皇家检察官”（Life Up North，2026）——也就是刑事司法系统的公务员。</p>\n"},{"age":49,"title":"49岁 ——《49 Up》（2005）：依然缺席","html":"<p>《49 Up》他也没出现。一份当时的学术课程表把他列在“未出现在 49 Up 名单”里（Szarka，2010）。至此，他缺席了整整三集——1984 到 2012，28 年。</p>\n"},{"age":56,"title":"56岁 ——《56 Up》（2012）：为了乐队而回归","html":"<p>2012 年，彼得意外回归，而且很坦白：<strong>回来就是为了宣传自己的乐队</strong>。“他决定参加，是为了宣传他的乡村摇滚乐队 The Good Intentions。”（NPR，2013）</p>\n<p>The Good Intentions 是 2005 年成立的利物浦乡村/Americana 三人组：彼得（词曲作者，署名 R. Peter Davies）、妻子 Gabrielle（Gabi）Monk、Francesco Roskell。乐队拿过 2011 年英国乡村音乐奖“最佳 Americana 组合”，去加州录过音，上过 BBC 电台（liverpoolacoustic.co.uk，2012）。</p>\n<p>回归的彼得，银发，带着妻子和两个十几岁的孩子。他说现在“<strong>对自己这身皮舒服多了</strong>”（theartsdesk.com，2012）。他谈条件：回来可以，但 ITV 得聚焦他的创作。“回来的时候我提了条件：ITV 得聚焦我的创作项目，从那时起，这个节目对我人生的影响才变好了。”（Life Up North，2026）</p>\n"},{"age":63,"title":"63岁 ——《63 Up》（2019）","html":"<p>《63 Up》2019 年 6 月 4–6 日在 ITV 播出。彼得又回来了，乐队还在——但少了一个人：吉他手 Francesco 'Frank' Roskell 2015 年底去世了，新专辑献给他的记忆（liverpoolacoustic.co.uk，2016）。节目里播了乐队现场唱新歌 &quot;Almost Blue&quot; 的片段。</p>\n<p>评论说他是所有参与者里“最在意自己公众形象”的一个（Film Comment，2019）。他又谈起“愤怒的年轻红色分子”那个 caricature，政治上的火气还在——60 多岁了，左翼立场没变。美国评论 Erik Lundegaard 说他回来时“带着忐忑”，“担心自己两分钟前说的话”，但夸他“歌声真好听”。</p>\n"},{"age":70,"title":"70岁 ——《70 Up》（2026）：作家、音乐人与和解","html":"<p>《70 Up》2026 年 9 月 15 日和 22 日分两集在 ITV1 播出，Asif Kapadia 接替 2021 年去世的 Apted 执导。彼得全程参与，这时候他的“正经工作”已经结束了：<strong>全职作家和音乐人</strong>（Wikipedia；The Times，2026）。</p>\n<p><strong>现在的生活：</strong> 和第二任妻子 Gabrielle 住在利物浦——她是他 20 年的乐队搭档（The Times，2026）。孩子是和第二任妻子生的，2012 年时是两个十几岁的孩子；没有孙辈的可靠记录。</p>\n<p><strong>小说：</strong> 处女作《Valediction Records》由 Cranthorpe Millner 出版，讲一支 70 年代末乐队解散、几十年后成员被过去纠缠的故事。反响不错：《人生七年》的制作人 Claire Lewis 给了好评，编剧 Ray Connolly 夸它有“电影感”。他用笔名 &quot;R. Peter Davies&quot; 写作。接受采访时他才意识到，小说的横跨几十年的结构，是被《人生七年》潜移默化影响的：“我从来没刻意模仿过！”（Life Up North，2026）</p>\n<p><strong>音乐剧：</strong> 和默西塞德词曲作者 Jimmy Rae 合写了乡村音乐舞台剧《Under The Mersey Moon》，讲一个利物浦词曲作者去纳什维尔追梦的故事，2026 年 11 月 11–13 日在利物浦 Epstein 剧院上演，13 首原创歌曲（Life Up North，2026）。</p>\n<p><strong>抑郁症：</strong> 他公开谈论过自己的抑郁：“我还是那个工人阶级出身的男人的儿子，那代男人不谈这个。”（The Times，2026）关于创作和心理健康，他分得很清：创作没让他“一直更快乐，但让我觉得更充实，这反过来对心理健康有好处。”（Life Up North，2026）</p>\n<p><strong>对系列的评价：</strong> “<strong>它从一项阶级研究，变成了一个关于‘做人意味着什么’的故事。</strong>”（The Times，2026）他不认耶稣会那句格言：“环境、家庭、意外，会显著地改变你。”（The Times，2026）他没有宗教信仰。他赞成 70 岁就停：“它不能永远拍下去……已经走了两个人，Michael 也走了。所以，是的，现在结束是对的。”（Daily Mirror，2026）</p>\n<p><strong>对 Apted：</strong> 他觉得 Apted 对他被 caricature 化“负有部分责任”（Daily Mirror，2026），但他全系列最喜欢的一幕，是 Jackie 在镜头前痛骂 Apted 问问题太冒犯：“我觉得太不像话了，看到 Jackie 教训他，我可高兴了。”（The Times，2026）</p>\n<p><strong>对 Kapadia：</strong> 他和 Jackie 都“非常享受”和新导演合作：“之前有点公式化了……换个新人能搅动一下……他有些问题很难回答，但有意思，让我更用力地想了想。”（Daily Mirror，2026）</p>\n<p><strong>值不值：</strong> 尽管经历了这一切，“总的来说”他愿意再来一次（Daily Mirror，2026）。他承认节目帮他宣传了乐队的唱片和写作。他 6 岁就开始被拍：“这成了我一生的部分，很难想象没有它。”（Life Up North，2026）</p>\n"}],"compare":{"title":"7岁的他，和70岁的他","html":"<h3>没变的地方</h3>\n<ul>\n<li><strong>左。</strong> 21 岁就是左翼青年，28 岁骂撒切尔，63 岁“政治上的火气还在”，70 岁还在谈阶级和福利国家。政治立场是他一生最稳定的东西。</li>\n<li><strong>要表达。</strong> 7 岁和尼尔一起说要当宇航员，28 岁在镜头前开炮，70 岁写小说、写音乐剧、组乐队——表达欲从童言变成了作品。</li>\n<li><strong>不服。</strong> 28 岁敢在镜头前骂政府，敢退出节目 28 年；70 岁还在说耶稣会格言是错的。不服管，是他刻在骨子里的东西。</li>\n</ul>\n<h3>完全改变的地方</h3>\n<ul>\n<li><strong>从体制内到体制外。</strong> 28 岁是体制内的中学教师，42 岁是公务员，70 岁是全职的独立音乐人和作家。他花了 40 年，从“端铁饭碗”走到了“自己说了算”。</li>\n<li><strong>和节目的关系。</strong> 从被小报围攻后愤然退出，到“提条件回归”，再到“总的来说愿意再来一次”。28 年的裂痕，最后长好了。</li>\n<li><strong>对“留下痕迹”的理解。</strong> 28 岁时他说希望离世时“知道自己留下过印记”；70 岁时，印记变成了小说、音乐剧和歌——不是政治口号，是作品。</li>\n</ul>\n<h3>最出人意料的变化</h3>\n<p><strong>消失 28 年的人，回来了，而且回来得最有底气。</strong> 1984 年那个被小报打到退出节目的愤怒青年，谁也没想到他会在 56 岁时带着一支获奖乐队回来，还跟 ITV 谈条件；更没想到 70 岁时，他成了 14 个人里“第二人生”最丰盛的一个——小说出版了，音乐剧要上演了。这是全系列最漂亮的“迟到”：他没有在 28 岁被定格，而是用 28 年证明了自己不止是那个“愤怒青年”。</p>\n"},"conclusion":"<p>一个 7 岁时说要当宇航员的利物浦男孩，28 岁时在镜头前痛骂撒切尔政府，被小报围攻后退出节目 28 年；在消失的岁月里他离婚、改行、再婚，把“铁饭碗”换成了吉他；70 岁时他成了全职音乐人和作家，出了小说、写了音乐剧，公开谈论抑郁症——他没当成宇航员，但他把“留下印记”这件事，做成了作品而不是口号。</p>\n","sources":"<ul>\n<li>是否被学校开除：老版 Wikipedia 说他因小报运动丢了教职，有粉丝 wiki 说他在《56 Up》否认被开除；官方发行资料只说“在《28 Up》后不久离开教师行业”。“被开除”一说未经证实。</li>\n<li>回归集数：有 2026 年自媒体说他“缺席 27 年、在《49 Up》回归”——错。他回归的是《56 Up》，缺席 28 年。</li>\n<li>出生年份：没有任何可靠来源公布他的出生日期，“约 1957 年”是根据乐队 2019 年“他不是 63 岁”的声明推算的。</li>\n<li>主要来源：The Times（2026，彼得与布鲁斯专访）、Daily Mirror（2026-09-07，长篇采访）、Life Up North（2026-10，小说与音乐剧 profile）、First Run Features《56 Up》官方发行资料（2012）、Film Comment（2019）、NPR（2013）、theartsdesk.com（2012）、Wikipedia（系列概览，次要参考）。</li>\n</ul>\n"},"bruce":{"id":"bruce","name":"布鲁斯·鲍尔登","en":"Bruce Balden","nickname":"最知足的数学老师","avatar":"avatars/bruce.jpg","summary":"7 岁时说想去非洲当传教士、想见 6000 英里外当兵的爸爸；牛津数学系毕业后，他辞掉保险公司的工作，去伦敦东区教了一辈子数学；40 多岁才结婚，有两个儿子；70 岁时和妻子退休定居英格兰东北海岸，每天海边遛狗、唱诗班、救生艇义工，说“现在比这辈子任何时候都享受生活”。","class7":"中上层军人家庭，父亲驻非洲，寄宿学校长大","education":"牛津大学数学系","career":"一辈子的数学教师（伦敦东区综合中学→私立名校）","marriage":"40 多岁与同为教师的 Penny 结婚","children":"2 个儿子","turning":"28 岁辞掉保险公司工作，去伦敦东区贫民学校教数学","status70":"与 Penny 退休定居伯威克海岸，唱诗班、救生艇义工，海边遛狗","alive":true,"tags":["精英家庭","上大学","退休"],"intro":"<p>布鲁斯是《人生七年》里最“稳”的一位，也是评论家公认最幸福的参与者之一。7 岁时他是个温文尔雅的寄宿学校男孩，说想去非洲当传教士，最大的心愿是见到 6000 英里外当兵的爸爸。牛津数学系毕业后，他干了一件让很多人意外的事：辞掉保险公司的工作，去伦敦东区的一所综合中学教数学，一教就是几十年。40 多岁才结婚，妻子 Penny 也是教师，有两个儿子。70 岁时，他和 Penny 退休定居在英格兰东北海岸的伯威克，每天海边遛狗、晚上唱诗班、周三去救生艇站做义工。他说：“我觉得幸运。现在比我这辈子任何时候都享受生活。”</p>\n","background":"<p>布鲁斯约 1957 年出生。父亲先在皇家空军服役，后来在陆军，被派驻南罗德西亚（现在的津巴布韦）。父母在他小时候分居，他跟着母亲回英国。母亲要工作养家，他被送到汉普郡的一所寄宿学校，假期住在姑妈家（Daily Mail，2026）。</p>\n<p>他的阶级位置有点微妙：家里供得起私立寄宿学校，算中上层，但远不如 Kensington 那三个富家男孩——母亲要工作、假期寄人篱下，说明这份“体面”并不厚实。当代报道叫他“upper-middle-class background”（The A.V. Club，2015）。</p>\n<p>宗教贯穿了他的早年：7 岁时他是圣公会男孩，梦想去非洲当传教士；成年后他皈依了贵格会（Quaker），那份平静后来在他的采访里看得很清楚（The Times，2026）。</p>\n<p>阶级对布鲁斯的影响是“有资源、没包袱”：私立教育和牛津给了他选择的底气，但他没有被精英剧本绑死——他选了东区中学，而不是金融城。这在 14 个人里是独一份。</p>\n","ages":[{"age":7,"title":"7岁 ——《Seven Up!》（1964）","html":"<p>1964 年，7 岁的布鲁斯是个温柔、 thoughtful、极有礼貌的男孩。几十年来的报道都抓住两件事：他少年老成的气质，以及这份气质瞬间融化的那一刻——当他说出自己最大的心愿：见到在非洲当兵的爸爸，“6000 英里外”（Radio Times，2019）。</p>\n<p>他说了两句被引用六十年的话。第一句，关于爸爸：“<strong>我最大的心愿，是见到我爸爸，他在 6000 英里外。</strong>”（Daily Mail，2026）第二句，关于未来：他想去非洲当传教士，“<strong>教那些不开化的人变得、或多或少、好起来</strong>”（First Run Features，《49 Up》发行资料）。这话今天听很殖民、很过时，但它捕捉到了一种真实的男孩式理想主义——对贫穷和不公的在意。后来所有人都说，这就是他当老师的种子。</p>\n<p>多年后他在《63 Up》里回忆，寄宿学校里经常挨打，“还不总是知道为什么”——他把这称为自己“受限的情感状态”（restricted emotional state）的来源（Film Comment，2019）。</p>\n"},{"age":14,"title":"14岁 ——《7 Plus Seven》（1970）","html":"<p>14 岁的布鲁斯，公开资料里没有太多单独的记录。他还在寄宿学校，走私立教育路线。耶稣会那句格言到这时已经成了节目的论点：布鲁斯的温和有礼，和工人孩子的粗粝，已经被剪成了阶级叙事的一部分。</p>\n"},{"age":21,"title":"21岁 ——《21 Up》（1977）","html":"<p>21 岁时布鲁斯在牛津读数学（Wikipedia；Roger Ebert，1999）。童年的传教士梦还被当作衡量他成年选择的标尺：这个理想主义男孩，会去当传教士，还是会被 privilege 带去别的地方？当时还没答案。他还没结婚，后来节目把他框成“长期单身汉”。</p>\n"},{"age":28,"title":"28岁 ——《28 Up》（1984）","html":"<p>牛津毕业后，布鲁斯先在保险公司干了一小段时间——然后辞职，去伦敦东区 Hackney 的一所综合中学教数学。他说他“喜欢参与别人的进步”（Wikipedia，转述节目）。The A.V. Club 形容 1984 年的他是“<strong>来自中上层家庭的、轻声细语的行善者，一个社会主义者</strong>”（The A.V. Club，2015）。</p>\n<p>这是他青年时代最关键的道德选择：传教士没当成，但“去帮助人”这件事，找到了成年版的形状——在东区教数学。他父亲看了《28 Up》的片段，跟他说为他骄傲——父子间的 estrangement 从这里开始解冻，而布鲁斯很多年后才知道这句话（Daily Mail，2026）。</p>\n<p><strong>纠正一个常见误会</strong>：没有任何资料显示布鲁斯在南非教过书。他的非洲联系只有三样：父亲驻南罗德西亚、童年想去非洲当传教士、后来去孟加拉国支教（见 35 岁）。“在种族隔离的南非教书”是以讹传讹，不能当真。</p>\n"},{"age":35,"title":"35岁 ——《35 Up》（1991）","html":"<p>35 岁时布鲁斯在休学术假，去了孟加拉国的 Sylhet，教数学和英语，帮当地老师设计课程，然后回东区（Wikipedia）。这是他离童年传教士梦最近的一次——在穷国做服务，只是不是以教会的名义。</p>\n<p>35 岁他还没结婚，承认“希望很快能结”（First Run Features，《49 Up》发行资料）。《42 Up》的评论后来写他“在早年的节目里谈过对伴侣的需要，一直没找到”。</p>\n"},{"age":42,"title":"42岁 ——《42 Up》（1998）","html":"<p>布鲁斯成年后最大的转折发生在《42 Up》前夕：他和同为教师的 Penny 结婚了。Apted 为此打破了七年一拍的规矩，专门去拍了婚礼——这是全系列独一份的待遇（Wikipedia）。尼尔参加了婚礼，布鲁斯还帮尼尔在伦敦找了工作（Roger Ebert，1999）。</p>\n<p>Ebert 的评论是布鲁斯得到过的最温暖的评价之一：“<strong>布鲁斯一直是看起来最幸福的参与者之一。</strong>”Apted 在《42 Up》配套书的前言里说，如果重来，他会选更多中产参与者——布鲁斯是少数真正站在中产位置上的人。</p>\n<p>这时候他还在东区教书，但已经“被磨得有点累了”；后来去了 Hertfordshire 的 St Albans School——一所“ prestigious 的私立学校”（Wikipedia）。《泰晤士报》2026 年回顾说这次跳槽发生在 49 岁前。有人评论他“出卖了理想”，他的回应很布鲁斯：“<strong>没彼得那事儿严重。</strong>”（The Times，2026）——指的是彼得当年被小报围攻的事。跳槽是务实的：东区几十年把人磨干了，私立学校能让他这个要养小家庭的人干下去。</p>\n"},{"age":49,"title":"49岁 ——《49 Up》（2005）","html":"<p>《42 Up》和《49 Up》之间，布鲁斯和 Penny 有了两个儿子（Wikipedia；First Run Features）。他已经在 St Albans 教书了。</p>\n"},{"age":56,"title":"56岁 ——《56 Up》（2012）","html":"<p>56 岁时布鲁斯还在 St Albans 和 Penny 一起教书，是“幸福投入的父亲和丈夫”（Wikipedia）。他承认“还是很难表达内心感受，特别是对妻子”——寄宿学校挨打留下的“受限情感状态”，到 56 岁还在（Wikipedia；Film Comment，2019）。他对职业发展没有后悔（Wikipedia）。The Wrap 的评论写他是“40 多岁才结婚的数学老师”，“两个小儿子看着他们发福的老爸搭帐篷、打板球，乐不可支”——全系列最温情的画面之一。</p>\n"},{"age":63,"title":"63岁 ——《63 Up》（2019）","html":"<p>《63 Up》2019 年 6 月在 ITV 播出，是 Apted 的最后一部。布鲁斯已经从教师岗位退休。评论写他“格外低调”，“退休了，没当上管理层，正和体重作斗争，目送儿子们离巢，家庭单位在解体”（Screen-Space，2019）。</p>\n<p>这一集他最直接地谈了学校挨打和“受限的情感状态”——Film Comment 把他的经历和儿童之家的保罗、西蒙并列：不同的机构，同样规训的童年，同样持久的情感印记。</p>\n<p>儿子们已经是准备离家的年轻人。没有任何资料提到布鲁斯有孙辈。</p>\n"},{"age":70,"title":"70岁 ——《70 Up》（2026）","html":"<p>《70 Up》2026 年 9 月 15 日和 22 日在 ITV1 播出，Apted 2021 年去世后由 Asif Kapadia 执导。布鲁斯是健在参与者里看起来最幸福的一个。</p>\n<p>他和 Penny 退休定居在<strong>伯威克</strong>（Berwick-upon-Tweed），英格兰和苏格兰交界处的北海海岸（The Times，2026）。他的日常，来自《每日邮报》的独家片段：“<strong>每天先去海边遛狗，晚上唱诗班。周三一般去救生艇站训练。</strong>”他在当地诗班唱歌（排练亨德尔《弥赛亚》被拍到），在 Spittal 海滩的皇家救生艇站做义工，还帮着筹款（Daily Mail，2026；The Times，2026）。谈到救生艇在移民政治里的角色，他说：“有人把我们当成移民的出租车服务，真让人沮丧。”</p>\n<p>他对自己人生的总结平静得惊人：“<strong>我觉得幸运。现在比我这辈子任何时候都享受生活。我觉得人要过的就是好好过一生，怎么帮你做到就怎么来。</strong>”（Daily Mail，2026）</p>\n<p>问他想对 7 岁的自己说什么：“<strong>别太听大人的话，说实话……听听可以，但记住，他们看世界的方式不一定和你一样……最重要的是按你自己的光去活。是好是坏，我一辈子都在努力这么做。</strong>”（The Times，2026）看到 7 岁的自己：“我确实在那个 7 岁孩子身上看到自己……看到一个有点迷失的灵魂。我想告诉他，会有一段旅程，但人生会好的。”（Daily Mail，2026）</p>\n<p>最动人的是关于父亲的一幕。他在镜头前读父亲当年寄来的一首诗，随信还有一张照片——“这是我的照片，省得你忘了我长什么样”——那是他七八岁的时候。诗里有一句：“<strong>你给一颗遥远的、疼痛的心，带来了做梦都想不到的欢喜。</strong>”（Daily Mail，2026）布鲁斯把照片和诗裱起来了。他说：“我们之间有过很难跨越的 estrangement。但他说为我骄傲，因为他看了《28 Up》吧，就说‘我为你做的事感到骄傲’。”他还说：“<strong>他想我，一点不比我想他少。要是早知道，我会多花点力气，把错过的时间补回来。</strong>”《泰晤士报》说，最近有人在超市认出他，“哽咽着”谈起这一幕。</p>\n<p>节目要结束了，他的感受“有点如释重负——带着一点难过，可能再也见不到这帮人了”（The Times，2026）——采访者说，这是“典型的布鲁斯”。同一篇 profile 把他的平静归于贵格会信仰：“<strong>年纪越大，越不在乎别人怎么看你，皮就越厚。</strong>”</p>\n<p>70 岁的布鲁斯没有任何公开的健康问题——海边遛狗、诗班、救生艇训练，说明退休生活很 active。</p>\n<p>他和 Apted 的关系是全系列最顺的之一：Apted 为他打破七年规矩拍婚礼，他帮尼尔找工作、请尼尔喝喜酒。2026 年那篇“节目是否剥削了参与者”的报道里，Kensington 那几个在抱怨，布鲁斯的态度是温和的疏离——他的“皮厚哲学”，本身就是对“节目伤害了我”这种说法的安静反驳。</p>\n"}],"compare":{"title":"7岁的他，和70岁的他","html":"<h3>没变的地方</h3>\n<ul>\n<li><strong>温柔。</strong> 7 岁的“温文尔雅”，70 岁的“平静”——《泰晤士报》2026 年的标题就是“小布鲁斯，那个迷失的男孩，温柔从没变过”。这是 14 个人里性格最稳定的一位。</li>\n<li><strong>想帮人。</strong> 7 岁想去非洲当传教士“教人变好”，28 岁去东区教数学，70 岁去救生艇站做义工。形式变了，“帮人”这个内核 63 年没动。</li>\n<li><strong>对父亲的想念。</strong> 7 岁最大的心愿是见 6000 英里外的爸爸；70 岁在镜头前读爸爸的诗，说“他想我，一点不比我想他少”。这条线，从第一集贯穿到最后一集。</li>\n</ul>\n<h3>完全改变的地方</h3>\n<ul>\n<li><strong>从“迷失的男孩”到“最知足的老人”。</strong> 7 岁是个父母分居、假期寄人篱下的“有点迷失的灵魂”；70 岁说“现在比这辈子任何时候都享受生活”。这是全系列最圆满的弧线之一。</li>\n<li><strong>对“成功”的定义。</strong> 按精英剧本，他该去金融城；他选了东区中学的讲台，40 多岁才结婚，最后说“我觉得幸运”。他重新定义了什么叫“没白活”。</li>\n<li><strong>情感表达。</strong> 寄宿学校挨打留下的“受限情感状态”，让他 56 岁时还“很难对妻子表达内心”；70 岁时，他能在镜头前读着父亲的诗流露感情。皮厚了，心也打开了。</li>\n</ul>\n<h3>最出人意料的变化</h3>\n<p><strong>牛津数学系的高材生，一辈子当中学老师，而且越过越开心。</strong> 按 7 岁的剧本（私立学校→牛津→体面职业），他本该成为金融城精英或大学教授。但他 28 岁辞掉保险公司去东区教书，一教几十年，最后在伯威克海边遛狗、唱诗班、做义工，说这是“最享受生活”的时候。Roger Ebert 1999 年就说他是“最幸福的参与者之一”，27 年后，这句话依然成立。<strong>全系列里，只有布鲁斯证明了：不按剧本走，也可以走得很稳、很开心。</strong></p>\n"},"conclusion":"<p>一个 7 岁时想去非洲当传教士、想见 6000 英里外爸爸的寄宿学校男孩，牛津数学系毕业后辞掉保险公司的工作，去伦敦东区教了一辈子数学；40 多岁才结婚，有两个儿子；70 岁时和妻子退休定居海边，每天遛狗、唱诗班、救生艇义工，说“现在比这辈子任何时候都享受生活”——他没当成传教士，但他把“帮人”这件事，做成了一辈子的日常。</p>\n","sources":"<ul>\n<li>纠正：没有任何资料显示布鲁斯在南非教过书。他的非洲联系只有父亲驻南罗德西亚、童年传教士梦、孟加拉国支教三样。</li>\n<li>结婚年份：Daily Mail（2026）说 1997 年，其他资料只说“《42 Up》前”，两者兼容。</li>\n<li>跳槽到 St Albans 的时间：Wikipedia 放在《42 Up》后，《泰晤士报》（2026）说“到 49 岁时”，两者兼容。</li>\n<li>主要来源：The Times（2026，两篇：人物专访与五星剧评）、Daily Mail（2026-09，70 岁专访）、Film Comment（2019，学校挨打与受限情感）、Radio Times（2019）、First Run Features《49 Up》官方发行资料、RogerEbert.com（1999）、The A.V. Club（2015）、Screen-Space（2019）、Wikipedia（系列概览，次要参考）。</li>\n<li>未找到：确切出生日期、寄宿学校名字、牛津学院名字、是否有孙辈、布鲁斯对 Apted 去世的公开表态。</li>\n</ul>\n"}};
const ORDER=["andrew","john","charles","suzy","jackie","lynn","sue","paul","symon","neil","nick","tony","peter","bruce"];
const FILMS={"7":["Seven Up!","1964"],"14":["7 Plus Seven","1970"],"21":["21 Up","1977"],"28":["28 Up","1984"],"35":["35 Up","1991"],"42":["42 Up","1998"],"49":["49 Up","2005"],"56":["56 Up","2012"],"63":["63 Up","2019"],"70":["70 Up","2026"]};
const id=new URLSearchParams(location.search).get('id')||ORDER[0];
const p=DATA[id];document.title=p.name+' · 《人生七年》';
const i=ORDER.indexOf(id);
document.getElementById('pn').innerHTML=
 (i>0?'<a href="person.html?id='+ORDER[i-1]+'">← '+DATA[ORDER[i-1]].name+'</a>':'<span></span>')+
 (i<ORDER.length-1?'<a href="person.html?id='+ORDER[i+1]+'">'+DATA[ORDER[i+1]].name+' →</a>':'');
const meta=[['7岁家庭',p.class7],['教育',p.education],['主要职业',p.career],['婚姻',p.marriage],['子女',p.children],['最大转折',p.turning],['70岁状态',p.status70],['是否在世',p.alive?'在世':'已去世']]
 .map(([k,v])=>'<div><span class="k">'+k+'</span>'+v+'</div>').join('');
const ages=p.ages.map(a=>{const label=a.age===null?a.title:a.age+'岁 ·《'+FILMS[a.age][0]+'》('+FILMS[a.age][1]+')';return '<details'+(a.age===7||a.age===70?' open':'')+'><summary>'+label+'<span class="plus">＋</span></summary><div class="body">'+a.html+'</div></details>'}).join('');
document.getElementById('app').innerHTML=
 '<div class="person-head"><img src="'+p.avatar+'" alt="'+p.name+'卡通头像"><h1>'+p.name+(p.alive?'':' <span class="dead">（已故）</span>')+'</h1><div class="en">'+p.en+'</div><div class="nick">绰号：'+p.nickname+'</div></div>'
 +'<div class="meta">'+meta+'</div>'
 +'<h2>人生概括</h2>'+p.intro
 +'<h2>出身与家庭背景</h2>'+p.background
 +'<div class="section-label">人生时间线 · 7岁 → 70岁</div><div class="tl">'+ages+'</div>'
 +(p.compare?'<h2>'+p.compare.title+'</h2><div class="compare-box">'+p.compare.html+'</div>':'')
 +'<h2>70岁结论</h2>'+p.conclusion
 +(p.sources?'<details class="src"><summary>资料来源与冲突说明</summary>'+p.sources+'</details>':'');
</script></body></html>
