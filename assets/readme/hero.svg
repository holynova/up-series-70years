<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">《人生七年》时间线 Up Series 70 Years — 14 个人，63 年人生</title>
  <desc id="desc">米白纸面编辑风标题：《人生七年》，14 个人，63 年人生；右侧是一条 1964–2026 时间线，10 个节点标注 10 部纪录片，从 7 岁到 70 岁。</desc>

  <rect width="1200" height="360" rx="26" fill="#faf6ef"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#6e6a63">UP SERIES · 1964—2026 · 纪录片档案</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#1a1a1a">《人生七年》</text>
    <text x="56" y="168" font-size="23" fill="#333333">时间线 — 14 个人，63 年人生</text>
    <text x="56" y="204" font-size="19" fill="#6e6a63">从 7 岁到 70 岁，他们最后活成了什么样？</text>
    <g id="chips" font-size="18" fill="#1a1a1a" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#ddd6c4" stroke-width="1.5"/><text x="119" y="262">14 位主角</text></g>
      <g><rect x="194" y="238" width="144" height="36" rx="18" fill="#ffffff" stroke="#ddd6c4" stroke-width="1.5"/><text x="266" y="262">10 部纪录片</text></g>
      <g><rect x="350" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#ddd6c4" stroke-width="1.5"/><text x="413" y="262">6 篇章节</text></g>
      <g><rect x="488" y="238" width="126" height="36" rx="18" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/><text x="551" y="262" fill="#faf6ef">标签筛选</text></g>
    </g>
    <text x="56" y="318" font-size="18" fill="#6e6a63">人物卡片 · 横向比较 · 详细时间线</text>
  </g>

  <g id="timeline-scene" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="760" y="64" font-size="19" fill="#1a1a1a">十部，一部都不能少</text>
    <text x="760" y="92" font-size="18" fill="#6e6a63">每七年回访一次，63 年跟拍</text>
    <g id="axis">
      <line x1="760" y1="190" x2="1144" y2="190" stroke="#c9c2b2" stroke-width="2"/>
    </g>
      <g>
        <circle cx="776" cy="190" r="6.5" fill="#1a1a1a"/>
        <text x="776" y="164" font-size="16" fill="#6e6a63" text-anchor="middle">1964</text>
        <text x="776" y="222" font-size="16" font-weight="400" fill="#333333" text-anchor="middle">7岁</text>
      </g>
      <g>
        <circle cx="815" cy="190" r="6.5" fill="#1a1a1a"/>
        <text x="815" y="222" font-size="16" font-weight="400" fill="#333333" text-anchor="middle">14岁</text>
      </g>
      <g>
        <circle cx="854" cy="190" r="6.5" fill="#1a1a1a"/>
        <text x="854" y="164" font-size="16" fill="#6e6a63" text-anchor="middle">1977</text>
        <text x="854" y="222" font-size="16" font-weight="400" fill="#333333" text-anchor="middle">21岁</text>
      </g>
      <g>
        <circle cx="893" cy="190" r="6.5" fill="#1a1a1a"/>
        <text x="893" y="222" font-size="16" font-weight="400" fill="#333333" text-anchor="middle">28岁</text>
      </g>
      <g>
        <circle cx="932" cy="190" r="6.5" fill="#1a1a1a"/>
        <text x="932" y="164" font-size="16" fill="#6e6a63" text-anchor="middle">1991</text>
        <text x="932" y="222" font-size="16" font-weight="400" fill="#333333" text-anchor="middle">35岁</text>
      </g>
      <g>
        <circle cx="972" cy="190" r="6.5" fill="#1a1a1a"/>
        <text x="972" y="222" font-size="16" font-weight="400" fill="#333333" text-anchor="middle">42岁</text>
      </g>
      <g>
        <circle cx="1011" cy="190" r="6.5" fill="#1a1a1a"/>
        <text x="1011" y="164" font-size="16" fill="#6e6a63" text-anchor="middle">2005</text>
        <text x="1011" y="222" font-size="16" font-weight="400" fill="#333333" text-anchor="middle">49岁</text>
      </g>
      <g>
        <circle cx="1050" cy="190" r="6.5" fill="#1a1a1a"/>
        <text x="1050" y="222" font-size="16" font-weight="400" fill="#333333" text-anchor="middle">56岁</text>
      </g>
      <g>
        <circle cx="1089" cy="190" r="6.5" fill="#1a1a1a"/>
        <text x="1089" y="222" font-size="16" font-weight="400" fill="#333333" text-anchor="middle">63岁</text>
      </g>
      <g>
        <circle cx="1128" cy="190" r="9" fill="#9c3d2e"/>
        <text x="1128" y="164" font-size="16" fill="#6e6a63" text-anchor="middle">2026</text>
        <text x="1128" y="222" font-size="16" font-weight="700" fill="#9c3d2e" text-anchor="middle">70岁</text>
      </g>
    <g id="finale">
      <rect x="1004" y="298" width="140" height="34" rx="17" fill="#9c3d2e"/>
      <text x="1074" y="321" font-size="18" fill="#faf6ef" text-anchor="middle">70 Up · 终章</text>
    </g>
    <g id="quote">
      <text x="760" y="266" font-size="18" fill="#6e6a63">耶稣会格言说：“7 岁看 70 岁。”</text>
      <text x="760" y="291" font-size="18" fill="#6e6a63">62 年过去了，14 个人交卷了。</text>
    </g>
  </g>
</svg>
